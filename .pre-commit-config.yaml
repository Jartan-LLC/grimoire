# Bump every rev: pre-commit autoupdate --freeze
#
# The docker hooks resolve the workspace mount by inspecting this container, so
# they only see files under the bind-mounted project directory: see
# CONTRIBUTING.md (Setup) for where to run them.
#
# Deliberately absent, though it looks like an obvious addition: prettier, which
# fights generate-codex.py over plugins/*/.codex-plugin/plugin.json; no tree state
# satisfies both.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        # Eval cases that plant a misspelling for the agent to fix, references, which hold
        # agent output, edited only where a failing reference needs it, and judge labels, which
        # hold agent output never edited.
        exclude: ^tests/evals/(gitwise/skills/commit-pr-writing/cases/(plain-typo|branch-only-fix)(-messy)?/|.*/reference/|.*/judges/[^/]+/labels/)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # frozen: v0.23.3
    hooks:
      # Without --no-globs the hook appends the config globs to the filenames
      # pre-commit passes, so every run lints the whole tree and is never
      # incremental. `ignores` still apply either way.
      - id: markdownlint-cli2
        args: [--no-globs]
  - repo: https://github.com/lycheeverse/lychee
    # The rev is the lychee-v0.24.2 tag, but lychee-docker is a docker_image
    # hook and the entry: at this rev still pins lycheeverse/lychee:0.23.0, so
    # that is the binary that runs. external-link-check.yml is on 0.24.2.
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b # frozen: lychee-v0.24.2
    hooks:
      # Relative links only. External rot is non-deterministic and belongs in a
      # weekly report, not a blocking gate.
      - id: lychee-docker
        args: [--offline, --no-progress] # args replace the defaults, so restate --no-progress
        types: [markdown]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint-docker
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # generate-codex.py embeds agent Markdown bodies verbatim into the TOMLs,
      # so stripping whitespace there would fight the generator forever.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md] # preserve MD009's two-space break
        exclude: '^plugins/[^/]+/codex/agents/.*\.toml$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      # Without --assume-in-merge the hook returns 0 before reading a single
      # byte unless .git/ holds MERGE_MSG plus MERGE_HEAD/rebase-apply/
      # rebase-merge. A fresh `actions/checkout` never carries that state, so
      # every CI path -- and every local commit outside a live merge -- was a
      # no-op. The flag makes the scan unconditional, which is the only mode in
      # which this gate catches anything.
      #
      # Scanning unconditionally means a lone `=======` line now reads as a
      # marker, so a setext H1 underlined with exactly seven `=` would trip it.
      # The tree has no such line (`git grep -nE '^={3,}'` is empty); if one
      # ever lands legitimately, `exclude:` that path rather than dropping the
      # flag and losing the gate again.
      - id: check-merge-conflict
        args: [--assume-in-merge]
