version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependency"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # No update-types filter here, unlike github-actions above. A pre-commit
  # dependency's version is the frozen SHA, so update-types filtering empties
  # the group and Dependabot falls back to one ungrouped PR per hook
  # (dependabot-core#15266). Consequence: major hook bumps land in this group
  # too, and the automerge action's `target: minor` declines them, so they wait
  # for a manual merge.
  #
  # The lychee hook is invisible to this ecosystem: its tags are prefixed
  # (lychee-vX.Y.Z), so Dependabot cannot parse a version out of the `# frozen:`
  # comment and reports it as permanently current. Bump it by hand -- see
  # CONTRIBUTING.md.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependency"
    groups:
      minor-and-patch:
        patterns:
          - "*"
    cooldown:
      default-days: 7
