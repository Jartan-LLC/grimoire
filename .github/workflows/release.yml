name: Create GitHub Release

on:
  push:
    tags:
      # Per-plugin tags, {plugin}--v{version} (RELEASING.md). Quotes are required
      # for a pattern starting with '*'. Do NOT tighten to full semver: tag
      # filters are whole-ref matches, so praxis--v2.0.0-rc1 would stop firing.
      - "*--v[0-9]*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The notes come from the plugin's CHANGELOG.md at the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The view guard keeps re-runs idempotent. No --generate-notes: GitHub
      # diffs them repo-wide, so a praxis tag would be captioned with recursio's
      # commits.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          plugin="${GITHUB_REF_NAME%%--v*}"
          version="${GITHUB_REF_NAME#*--v}"
          # GitHub picks "Latest" as the newest non-prerelease by created_at, so
          # an unmarked rc would present as current.
          flags=()
          case "$version" in
            *-*) flags+=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          python3 scripts/check-changelogs.py --notes "$plugin" "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            "${flags[@]}" \
            --notes-file notes.md
