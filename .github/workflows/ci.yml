name: CI

on:
  pull_request:
    branches: [main]
  # A build on `main` plus a weekly one: pre-commit hooks pull their own envs and
  # the lychee/docker hooks reach the network, so `main` can break with no commit
  # touching it. Without these, the next unrelated PR is what discovers the drift.
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC (offset from external-link-check)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No pip cache: the Verify block is stdlib-only, so there is nothing to
      # install and nothing to key a cache on.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify
        run: make verify

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test
        run: make test

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Caches the hook environments only; the docker hooks pull fresh images.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      # Every hook is frozen to a SHA, but Dependabot's pre-commit ecosystem
      # watches the hook repos, not the runner itself -- so the runner is pinned
      # in ci/requirements.txt, which the "/ci" pip entry does watch.
      - run: pip install -r ci/requirements.txt

      - name: Lint
        run: make lint

  # The required status check. Do NOT add a `name:` -- the ruleset matches the
  # context by job id, so naming it silently stops the check from matching.
  check:
    if: always()
    # When you add jobs above, add them to BOTH the needs list and the results
    # array below.
    needs: [verify, test, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          results=("${{ needs.verify.result }}" "${{ needs.test.result }}" "${{ needs.lint.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Check failed: $r"
              exit 1
            fi
          done
