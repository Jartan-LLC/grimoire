name: Dependabot Automerge

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # use-github-auto-merge queues the merge behind the required `check`
      # context instead of merging immediately. It REQUIRES the main ruleset to
      # carry a required_status_checks rule -- without one the underlying
      # GraphQL mutation is rejected, the action's catch calls core.setFailed,
      # and every Dependabot PR ends up approved and permanently red. Do not
      # "fix" that by setting it to false: that path falls through to an
      # immediate merge with nothing gating it.
      - uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3
        with:
          target: minor
          merge-method: squash
          use-github-auto-merge: true
