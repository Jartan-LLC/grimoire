# markdownlint config -- lints Markdown structure/consistency (Prettier is off
# for Markdown; this does NOT reformat). Tune rules to taste.
config:
  default: true
  MD013: false # line length -- tables and prose legitimately run long
  MD024:
    siblings_only: true # repeated headings under sibling sections are fine
  MD041: false # first-line H1 -- agent bodies are prompts ("You are a ..."), not
    # documents, and the PR template is a fragment; none should grow a
    # decorative heading to satisfy a linter
  MD046: false # code-block style -- skills mix fenced and indented blocks
  MD060: false # table-column-style -- we deliberately don't auto-format tables
globs:
  - "**/*.md"
ignores:
  - "node_modules"
  - ".claude/workspace"
  - "AGENTS.md" # symlink to CLAUDE.md -- lint the target, not the alias
