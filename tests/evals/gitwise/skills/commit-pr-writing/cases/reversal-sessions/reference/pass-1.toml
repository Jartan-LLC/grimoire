commits = ["feat(sessions): keep sessions server-side so they can be revoked\n\n\"feat(sessions): store the session in the cookie\" put the user name in\nthe cookie, which needs no server state but leaves no way to end a\nsession: whoever holds the cookie stays logged in. The cookie now\ncarries only a random session id, and a dict in the sessions module\nmaps ids to users, so revoke() ends a session by dropping its entry.\n\nThe dict lives in process memory: sessions are lost on restart and are\nnot shared between processes, so running more than one worker needs a\nshared store.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "Sessions are now stored on the server, and I committed the change as `9d1e15a feat(sessions): keep sessions server-side so they can be revoked`. All 3 tests pass.\n\n- **The change:** in `sessions/__init__.py`, `start()` makes a random id with `secrets.token_urlsafe(32)` and saves it in a module-level `dict` that maps each id to its user. Only the id goes in the cookie. `user_of()` looks the id up.\n- **Revoking:** I added `revoke(cookie)`, which deletes the id from the dict. After that, `user_of()` raises `KeyError` for that cookie. A cookie with an id it doesn't recognise raises the same error.\n- **Tests:** I added two tests. One checks that the cookie no longer contains the user name, and the other checks that a revoked session doesn't resolve to a user.\n- **Running the tests:** `python3 -m pytest -q` from AGENTS.md fails here because the active venv doesn't have pytest installed. I used `/usr/local/python/current/bin/python3` instead.\n- **Limitation:** sessions live only in the app's memory. They're lost when it restarts and aren't shared between processes, so running more than one worker would need a shared store. The commit message says this.\n\nI added a new commit on top rather than rewriting the old one, because the branch is already pushed. I haven't pushed this commit; tell me if you want me to."
