commits = ["feat(sessions): keep sessions server-side and put only the id in the cookie\n\n\"feat(sessions): store the session in the cookie\" put the user name in\nthe cookie so no server state was needed, but such a session cannot be\nrevoked: the server has nothing to delete. The cookie now carries a\nrandom id from secrets.token_urlsafe, and a module-level dict maps each\nid to its user, so removing the entry ends the session.\n\nuser_of raises KeyError for an id the server does not know.\n\nThe dict lives in process memory: sessions are lost on restart and are\nnot shared between worker processes.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "Sessions are now stored on the server, and the change is committed as `6789c01` on `feature/sessions`. I haven't pushed it, so the branch is one commit ahead of `origin/feature/sessions`.\n\n- **How it works now:** `start()` creates a random id with `secrets.token_urlsafe(32)`, saves `id -> user` in the `_sessions` dict in `sessions/__init__.py`, and returns only the id for the cookie. `user_of()` looks the user up in that dict, and raises `KeyError` if it doesn't know the id. To revoke a session, delete its entry from the dict.\n- **Tests:** the existing round-trip test passes. The repo's venv has neither pytest nor pip, so `python3 -m pytest -q` doesn't run there; I ran the tests with the system Python at `/usr/local/python/3.12.15/bin/python3` instead.\n- **Limitation:** the dict lives in the process's memory. Sessions disappear when the server restarts, and separate worker processes can't see each other's sessions. If you run more than one process, you'll need a shared store such as Redis or a database table.\n\nThere's no `revoke()`/`end()` function yet, since you didn't ask for one. Say if you want it added, or want me to push."
