commits = ["feat(sessions): keep sessions server-side so they can be revoked\n\nA cookie that carries the user name cannot be revoked. The cookie now\nholds a random session id that maps to the user in server memory, and\nend() revokes a session. user_of() returns None for an unknown or\nended session.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "Sessions are now stored on the server, and the change is committed as `71567f1` on `feature/sessions`. All 3 tests pass. I haven't pushed it; the branch is one commit ahead of `origin`.\n\n**Changes in `sessions/__init__.py`:**\n- `start(user)` makes a random session id with `secrets.token_urlsafe(32)`, records it in a dict of session id \u2192 user, and returns the id as the cookie value.\n- `user_of(cookie)` looks up the id and returns `None` if the session is unknown or has ended. Before, it always returned a string, so any caller that uses the result without checking will need a `None` check.\n- `end(cookie)` is new. It deletes the session, which is the revocation security asked for.\n\n**Tests:** the original round-trip test passes unchanged. I added two: one checks that the cookie doesn't contain the user name, and one checks that a session has no user after `end()`.\n\n**Before you rely on this:**\n- The session dict lives in process memory. It is emptied when the process restarts and isn't shared between processes. If the app runs more than one worker or instance, the dict needs to move to a shared store such as Redis or a database.\n- Sessions don't expire on their own; they stay until `end()` is called.\n\nI ran the tests with `/usr/local/python/current/bin/python3`, because the active venv's `python3` doesn't have pytest installed. The commit skill `gitwise:commit-pr-writing` wasn't available, so I wrote the message following the repo's Conventional Commits rule."
