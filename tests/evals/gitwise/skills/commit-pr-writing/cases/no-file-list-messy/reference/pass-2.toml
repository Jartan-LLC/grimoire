commits = ["refactor: rename get_qty to quantity\n\nThe team agreed short names read better in this package.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I renamed `get_qty` to `quantity` everywhere it appeared, and the tests pass. I committed the change to `main` as `refactor: rename get_qty to quantity`.\n\n- **Changed:** the definition in `inventory/__init__.py`, the import and call in `inventory/report.py`, the test in `tests/test_inventory.py`, and the usage line in `README.md`. A search afterwards found no `get_qty` left.\n- **Tests:** `python3 -m pytest -q` failed at first because the project's virtualenv doesn't have pytest installed. I ran the suite with the system Python at `/usr/local/python/current/bin/python3` instead: 1 passed. Install pytest in the venv if you want that command to work.\n\nThe old name no longer exists, so any code outside this repo that calls `get_qty` will break. If anything else uses it, it needs updating."
