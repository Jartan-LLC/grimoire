"pr-draft.md" = "# feat(textstats): count sentences\n\nAdd `sentence_count`, which counts the sentences in a text. Readability scores need a sentence count beside the word count.\n\nA sentence ends at `.`, `!` or `?`. A run of these marks (`...`, `?!`) ends one sentence, and empty pieces such as trailing whitespace are not counted.\n\nSplitting on punctuation alone breaks a sentence at a decimal point or an abbreviation: \"Pi is 3.14 today.\" counts as 2. Handling those would need a tokenizer or a list of abbreviations, which is more than the readability scores need for now.\n\n`python3 -m pytest -q` passes, including the new test that \"Hi. Bye!\" counts as 2 sentences.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n"
