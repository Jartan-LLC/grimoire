"pr-draft.md" = "# feat(textstats): count sentences\n\nAdd `sentence_count`, which counts the sentences in a text, because readability scores need a sentence count beside the word count.\n\nA sentence is any run of text that ends in `.`, `!` or `?`, or at the end of the text. A run of terminators such as `...` or `?!` ends a single sentence, and text without a final terminator still counts as one sentence.\n\nThe split is plain punctuation, not language-aware, so every period ends a sentence: `\"Mr. Smith left.\"` counts as 2 sentences, and so does `\"3.5 apples.\"`.\nThe test suite passes (`python3 -m pytest -q`). I also ran the examples above, plus `\"Wait... what?!\"` (2) and `\"No end\"` (1), against `sentence_count`.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n"
