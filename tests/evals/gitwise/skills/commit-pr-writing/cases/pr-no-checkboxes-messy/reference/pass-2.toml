final = "I wrote the PR draft to `pr-draft.md` in the repository root.\n\n**Title:** `feat(textstats): count sentences`\n\n**Description:**\n- **What and why:** it adds `sentence_count`, because readability scores need a sentence count next to the word count.\n- **What counts as a sentence:** text ending in `.`, `!` or `?`, or at the end of the input. A run like `...` or `?!` ends one sentence. Text with no final punctuation still counts as one sentence.\n- **Known limit:** every period ends a sentence, so `\"Mr. Smith left.\"` counts as 2, and so does `\"3.5 apples.\"`. I left out why it was built this simple, because the branch doesn't say and I didn't want to guess.\n- **Testing:** it says the test suite passes, based on your run. It also lists the examples I ran against `sentence_count`: `\"Wait... what?!\"` gives 2 and `\"No end\"` gives 1.\n\nAGENTS.md says the PR title and description become the squash commit message, so I wrote the description to work as that message. That's why it has no \"where to start reading\" pointer and no checkbox list like the ones in #9 and #11."

