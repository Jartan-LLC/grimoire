"pr-draft.md" = "feat(textstats): count sentences\n\n## Summary\n\nAdds `sentence_count()` in `textstats/sentences.py`. Readability scores need\na sentence count alongside the word count.\n\nA sentence ends at `.`, `!` or `?`. A run of these counts as a single\nending, so `...` and `?!` end one sentence. Empty pieces are dropped, so\ntrailing punctuation and whitespace don't add a sentence.\n\nEvery `.` counts as an ending, so abbreviations and decimals split\nsentences: `\"Mr. Smith left.\"` and `\"It cost 3.50.\"` each count as 2.\n\n## Checklist\n\n- [x] Tests added\n- [x] Tests pass\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n"
