commits = ["refactor!: rename get_qty to quantity\n\nThe team agreed short names read better in this package. No alias for\nthe old name is kept, so callers of get_qty must switch to quantity.\n\nBREAKING CHANGE: get_qty is now quantity; get_qty no longer exists.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I renamed `get_qty` to `quantity` everywhere it appeared: the definition in `inventory/__init__.py`, its use in `inventory/report.py`, the test, and the README. The test passes (1 passed), and no `get_qty` is left in the repo.\n\nThe commit is `ac8d4a4 refactor!: rename get_qty to quantity`, on a new branch `feature/rename-get-qty`.\n\n- **Branch:** I first committed straight to `main` by mistake. I moved the commit to the new branch and reset `main` to where it started (`46d0b4f`). Nothing was pushed.\n- **Breaking change:** I didn't keep `get_qty` as an alias, so any code that calls it will break. The commit marks this with `!` and a `BREAKING CHANGE:` footer.\n- **Tests:** the virtual environment the project uses doesn't have pytest installed, so `python3 -m pytest -q` failed with \"No module named pytest\". I ran the tests with `/usr/local/python/current/bin/python3`, which does have it. You may want to install pytest in the venv."
