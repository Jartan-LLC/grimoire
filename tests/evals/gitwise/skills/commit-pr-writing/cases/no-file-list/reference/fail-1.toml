commits = ["refactor!: rename get_qty to quantity\n\nThe team prefers short names in this package, so the stock lookup\ndrops its get_ prefix. No alias is kept for the old name.\n\nBREAKING CHANGE: inventory.get_qty is now inventory.quantity; callers\nmust update their imports.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\n\n- `inventory/__init__.py`: renamed get_qty\n"]
final = "I renamed `get_qty` to `quantity` in all four places it appeared, ran the tests (1 passed), and committed the change as `ed05ee9` on a new branch, `feature/rename-get-qty-to-quantity`, rather than on `main`. Nothing is pushed.\n\nThe four places were:\n- the definition in `inventory/__init__.py`\n- the import and call in `inventory/report.py`\n- the test in `tests/test_inventory.py`\n- the usage line in `README.md`\n\nA search afterwards found no remaining `get_qty`.\n\n- **Tests:** `python3 -m pytest -q` failed with \"No module named pytest\", because the active virtualenv doesn't have pytest installed. I ran the same command with the system Python 3.12.15 instead and installed nothing.\n- **Breaking change:** `get_qty` was part of the package's public interface, so the commit is `refactor!: rename get_qty to quantity` with a `BREAKING CHANGE:` note. I didn't keep `get_qty` as an alias, so anyone outside this repo importing it will need to switch to `quantity`. If you'd rather give them time to move over, I can add a deprecated alias instead."
