split = "screen"
kind = "regression"
hints = ["list the files", "file list"]

[[check]]
metric = "kept"
artifact = "commits"
absent = '''(?m)^\s*[-*]\s+`?[\w./-]+\.(py|md|toml|txt|json)`?(\s|:|$)'''

[[check]]
metric = "format"
artifact = "commits"
present = '''\A(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)(\([^)]+\))?!?: \S'''

[[check]]
metric = "delivered"
artifact = "delivery"
skill = "gitwise:commit-pr-writing"
write = "commit"
state = "in-context"

[[baseline]]
model = "claude-opus-5-5"
arm = "old"
failures = 0
runs = 3
runner = 2

