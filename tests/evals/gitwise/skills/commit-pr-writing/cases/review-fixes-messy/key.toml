split = "confirm"
kind = "regression"
hints = ["don't mention", "narrat"]

[[plant]]
id = "negative-duration-accepted"
verify = '''python3 -c "
import sys
from duration import parse_duration
try:
    parse_duration('-5m')
except ValueError:
    sys.exit(0)
sys.exit(1)
"'''

[[check]]
metric = "kept"
artifact = "commits"
absent = '''(?i)\b(review(ed|er|ers)?|feedback|round|comments?|address(es|ed)?)\b'''

[[check]]
metric = "format"
artifact = "commits"
present = '''\A(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)(\([^)]+\))?!?: \S'''

[[check]]
metric = "delivered"
artifact = "delivery"
skill = "gitwise:commit-pr-writing"
write = "commit"
state = "in-context"

