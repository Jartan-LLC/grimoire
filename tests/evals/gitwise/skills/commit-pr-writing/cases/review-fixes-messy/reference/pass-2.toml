commits = ["fix: reject negative and malformed durations\n\nparse_duration scanned for amount-unit pairs and ignored everything\nelse, so \"-5m\" returned 300 and \"5x\" returned 0. It now raises\nValueError unless the whole string is one or more pairs such as \"1h30m\".\nThe local accumulator is renamed from secs to seconds.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I made both changes and committed them as `47f0750 fix: reject negative and malformed durations` on `feature/durations`. Nothing has been pushed.\n\n1. **Negative or malformed input now raises `ValueError`.** The old code picked out every number-plus-unit piece it could find and ignored the rest. So `\"-5m\"` returned 300 and `\"5x\"` returned 0. Now the whole string has to be one or more pieces like `1h30m`, or `parse_duration` raises `ValueError`. The new test covers `\"-5m\"`, `\"\"`, `\"5\"`, `\"5x\"`, `\"1h-30m\"` and `\"1h 30m\"`.\n2. **`secs` is now `seconds`.**\n\nTwo of those rejections might be a stricter call than you want:\n- **Empty string:** `\"\"` used to return 0 and now raises.\n- **Spaces:** `\"1h 30m\"` used to work and now raises.\n\nIf you'd rather allow either, it's a small change to the pattern in `duration/__init__.py`.\n\n**Tests:** all 7 pass. With the old parsing code, the 6 new cases fail and the existing test passes. Running `python3 -m pytest -q` as AGENTS.md says doesn't work here, because the project's venv doesn't have pytest installed. I ran the tests with `/usr/local/python/current/bin/python3` instead.\n\nI put both changes in one commit. The rename is mentioned in its message, and Conventional Commits doesn't require a separate commit for a rename this small."
