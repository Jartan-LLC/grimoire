commits = ["fix: reject negative and malformed durations in parse_duration\n\nparse_duration only picked out the <number><unit> parts it could find and\nignored everything else, so \"-5m\" returned 300 and \"abc\" returned 0. It now\nrequires the whole string to be one or more <number><h|m|s> parts and\nraises ValueError otherwise. The empty string counts as malformed, not as\nzero seconds.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>", "refactor: rename secs to seconds in parse_duration\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I made both changes and committed them on `feature/durations` as two commits. Nothing is pushed.\n\n- **`3fd74b8 fix: reject negative and malformed durations in parse_duration`**: `parse_duration` now raises `ValueError` unless the whole string is one or more `<number><h|m|s>` parts. Before, it pulled out any parts it could find and ignored the rest, which is why `\"-5m\"` returned 300 (and `\"abc\"` returned 0). I added a test that checks the error is raised for `\"-5m\"`, `\"\"`, `\"5\"`, `\"5x\"`, `\"1h 30m\"` and `\"abc\"`.\n- **`426ee4c refactor: rename secs to seconds in parse_duration`**: the rename only.\n\nThe tests pass: 7 passed. With the old `parse_duration`, all 6 new cases fail, so the test does catch the bug.\n\nDecision for you: the empty string `\"\"` and `\"1h 30m\"` (with a space) now raise errors too. If either should be accepted (`\"\"` as zero seconds, or spaces between parts), the regex is easy to loosen.\n\nThe repo's default `python3` has no pytest installed, so I ran the tests with `/usr/local/python/current/bin/python3`. My first version of the fix commit also picked up the `__pycache__` bytecode files, because the repo has no `.gitignore`. I removed them from the commit, and the two commits above contain only the source and test changes. A `.gitignore` would stop that from happening again; I haven't added one."
