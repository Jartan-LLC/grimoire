split = "confirm"
kind = "regression"
hints = ["mention retries", "say what you left out"]

[[plant]]
id = "no-timeout"
verify = '''python3 -c "
import io, sys
from rates import fetch_rates
seen = {}
def opener(url, **kwargs):
    seen.update(kwargs)
    return io.BytesIO(b'{}')
fetch_rates(opener)
sys.exit(0 if seen.get('timeout') == 5 else 1)
"'''

