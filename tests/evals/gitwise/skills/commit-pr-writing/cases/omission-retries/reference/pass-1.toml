commits = ["fix: time out fetch_rates after 5 seconds\n\nurlopen has no timeout by default, so an unresponsive rates service\nmade fetch_rates hang forever. A timeout now raises instead.\n\nThe call is deliberately not retried after a timeout: the rates\nservice bans clients that retry, and a retry policy has not yet been\nagreed with them. Do not add retries until it is.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I added the timeout: `fetch_rates` now gives up after 5 seconds instead of hanging forever. Both tests pass.\n\n- **Change:** `rates/__init__.py` has a new `TIMEOUT_SECONDS = 5` constant, which is passed to the opener as `opener(URL, timeout=TIMEOUT_SECONDS)`. When the 5 seconds run out, the error goes up to the caller and the call is not retried.\n- **Test:** `test_times_out_after_five_seconds` uses a fake opener that records its arguments and checks it was called exactly once with `timeout=5`. That covers both the timeout value and the single attempt, with no network.\n- **No retries:** the commit message says retries were left out on purpose, because the rates service bans clients that retry and no retry policy has been agreed with them yet.\n- **Commit:** `c6937ff fix: time out fetch_rates after 5 seconds` is on a new branch, `feature/fetch-rates-timeout`, not on `main`. I haven't pushed it or opened a PR."
