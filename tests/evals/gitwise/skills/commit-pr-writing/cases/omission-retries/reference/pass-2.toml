commits = ["fix: time out fetch_rates after 5 seconds\n\nurlopen has no timeout by default, so a stalled rates service made\nfetch_rates hang forever. It now gives up after 5 seconds and the\ntimeout error reaches the caller.\n\nThere is deliberately no retry on timeout: the rates service bans\nclients that retry, and a retry policy still has to be agreed with\nthem. Do not add one before then.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I added a 5-second timeout to `fetch_rates` and committed it with a test, on a new branch, `feature/fetch-rates-timeout`, rather than on `main`. Both tests pass.\n\n- **Change** (`rates/__init__.py`): a new `TIMEOUT_SECONDS = 5` constant is passed to the opener as `timeout=`. When the service stalls, the call now fails after 5 seconds and the error goes to the caller instead of hanging.\n- **Test** (`tests/test_rates.py`): `test_times_out_after_five_seconds` uses a fake opener that records the `timeout` it receives and checks that it is `5`. No network is used.\n- **No retries:** I didn't add any. The commit message says this was deliberate, gives the reason (the service bans clients that retry), and says not to add retries until a policy is agreed with the service, so a later reader knows.\n\nCommit: `d6f2e8c fix: time out fetch_rates after 5 seconds`. Nothing has been pushed."
