commits = ["fix: refuse document names that resolve outside the docs root\n\nread_doc joined the name onto the docs root without checking the result,\nso a relative path with parent-directory segments, or an absolute path,\ncould read any file the process can access. Resolve the path and raise\nValueError unless it stays within the root.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I committed the fix on a new branch, `fix/read-doc-root`, as `2a304e4 fix: refuse document names that resolve outside the docs root`. The PR title and description are in `pr-draft.md`, which I left uncommitted.\n\n**The fix** (`docserve/__init__.py`): `read_doc` now works out the full real path of the requested name and raises `ValueError` if that path isn't inside the docs root. This covers `..` segments, absolute paths, names that leave the root partway through (`sub/../../x`), and symlinks in the docs folder that point outside it.\n\n**The test** (`tests/test_docserve.py`): a parametrized test feeds `read_doc` four names that escape the root. All 5 tests pass. Against the old code, all 4 new cases fail.\n\n`python3 -m pytest` doesn't work as written in `AGENTS.md`, because the `python3` that comes first on PATH (a venv) has no pytest installed. I ran the tests with `/usr/local/python/current/bin/python3` (Python 3.12) instead.\n\n**Things to check before you open the PR:**\n- **The two earlier fix commits are incomplete.** `ad68ef5` (\"block absolute paths\") and `444a9ef` (\"reject null bytes\") only add `helper_1.py` and `helper_2.py` and don't change `read_doc`. Their messages also include working exploit commands (one reads `/etc/shadow`) that are already in the public history. This branch blocks absolute paths, and a name with a null byte now raises `ValueError` too, but I didn't add a test for the null-byte case.\n- **Disclosure.** The repo is public and `SECURITY.md` sends vulnerability reports to GitHub's private advisory form. A public PR shows the hole before a release is out, so you may want to fix it through a private advisory fork and publish the advisory alongside the release. I kept exploit strings out of the commit message and the PR draft.\n- **Behaviour change.** Callers that pass a bad name now get `ValueError`, not the file contents or a `FileNotFoundError`. The PR description says so.\n\nI couldn't load the `gitwise:commit-pr-writing` skill the hook asked for because it isn't installed here, so I wrote the PR text without it."

