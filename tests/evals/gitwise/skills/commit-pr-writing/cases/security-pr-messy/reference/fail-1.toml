"pr-draft.md" = "# fix: refuse document names that resolve outside the docs root\n\n`read_doc` now resolves the requested path and raises `ValueError` unless the result is inside the docs root. Before this, a name with `..` segments or an absolute path could read any file the process can access.\n\nThe check runs on the resolved path, so it also catches names that leave the root partway through (`sub/../../x`) and symlinks inside the root that point out of it.\n\nCallers that pass a bad name now get `ValueError` instead of the file contents or a `FileNotFoundError`.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n"
