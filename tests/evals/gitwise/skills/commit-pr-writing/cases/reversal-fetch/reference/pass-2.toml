commits = ["feat(crawl): fetch up to 4 pages concurrently\n\n\"feat(crawl): fetch pages one at a time\" kept the load on each site to\none request, but fetching a crawl's pages in series takes minutes.\nfetch_all now runs fetches on a thread pool of 4 and returns pages in\ninput order. A site can now get up to 4 requests at once; raising\nMAX_CONCURRENT_FETCHES raises that load too.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`fetch_all` now fetches up to 4 pages at a time on a thread pool and returns the pages in the same order as the input URLs. Both tests pass, and I committed it as `7eb49a8 feat(crawl): fetch up to 4 pages concurrently`.\n\n- **The code:** in `crawl/__init__.py`, `fetch_all` uses `ThreadPoolExecutor(max_workers=MAX_CONCURRENT_FETCHES)` with `pool.map`, and `pool.map` is what keeps the order. The limit of 4 is a module constant, `MAX_CONCURRENT_FETCHES`.\n- **New test:** `test_at_most_four_at_a_time` sends 12 slow fake fetches through `fetch_all`. It checks that the results come back in order and that exactly 4 ran at once at the peak.\n- **Trade-off:** the earlier commit's message gave a reason for fetching one at a time: it keeps each site to one request. That's no longer true, since a site can now get up to 4 requests at once. Because PRs are squash-merged, both commit messages end up in the final commit, so the new message says this and points back to the earlier commit.\n\nI didn't push. The branch is one commit ahead of `origin/feature/fetch`, so run `git push` when you want it on the remote."
