commits = ["perf(crawl): fetch up to four pages concurrently\n\nFetching one page at a time took minutes. A thread pool of four\nworkers runs the fetches in parallel; pool.map keeps the results in\ninput order.\n\nThis undoes the one-request-per-site limit from the previous commit:\na site can now get up to four requests at once.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`fetch_all` now fetches pages at most 4 at a time, and the results come back in input order. The test passes, and I committed the change as `cd3b748 perf(crawl): fetch up to four pages concurrently`.\n\n- **Change:** in `crawl/__init__.py`, `fetch_all` runs the fetches in a `ThreadPoolExecutor` with 4 workers (`MAX_CONCURRENT_FETCHES = 4`). `pool.map` returns results in the same order as the input URLs.\n- **Trade-off:** the previous commit said fetching one page at a time kept each site to a single request. Now a site can get up to 4 requests at once. The commit message says so, so whoever reviews the PR sees it.\n- **Test coverage:** the existing test only checks order. Nothing tests the limit of 4, and nothing checks what happens when a fetch fails. If one fetch raises, `fetch_all` raises that error, as it did before.\n- **Not pushed:** the commit is on top of what's already pushed, so I didn't rewrite any history. I haven't pushed it; your branch is 1 commit ahead of `origin/feature/fetch`.\n\nA hook asked me to load a `gitwise:commit-pr-writing` skill, but no skill by that name is installed, so I wrote the commit message to the project's Conventional Commits rule instead."
