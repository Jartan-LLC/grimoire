commits = ["feat(crawl): fetch up to 4 pages concurrently\n\nThis replaces the one-request-per-site design of \"feat(crawl): fetch\npages one at a time\": fetching sequentially made a crawl take minutes.\nfetch_all now runs fetches in a thread pool of MAX_CONCURRENT_FETCHES\n(4) workers, so a site can receive up to 4 requests at once. Results\nkeep the input order, and the first fetch to raise propagates from\nfetch_all.\n\nA thread pool rather than asyncio, because fetch is a blocking callable.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`fetch_all` now fetches pages concurrently, at most 4 at a time, and returns the results in input order. I committed it as `860a8a5 feat(crawl): fetch up to 4 pages concurrently` but haven't pushed it, so the branch is one commit ahead of `origin/feature/fetch`.\n\n- **Change:** `crawl/__init__.py` uses a `ThreadPoolExecutor` with `MAX_CONCURRENT_FETCHES = 4` workers. `pool.map` keeps the results in input order, and the first error from a fetch is raised by `fetch_all`.\n- **Tests:** `python3 -m pytest -q` passes (1 test). I also ran 20 fake fetches that each take 50 ms. No more than 4 ran at once, the order was correct, and the run took 0.25 s instead of about 1 s.\n- **Effect on sites:** the earlier commit said fetching one at a time kept each site to one request. The new commit message says this replaces that, because a site can now get up to 4 requests at once."
