commits = ["fix: evict once the cache exceeds its capacity\n\nput() only evicted when the cache held more than capacity + 1 items, so\nLRUCache(2) kept three entries. It now evicts the least recently used\nentry as soon as the size passes capacity.\n\nExpiry after a time-to-live is not added here; that is #42.\n\nFixes #41\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed the off-by-one from issue #41 and committed it on a new branch, `feature/issue-41` (`236f2a8 fix: evict once the cache exceeds its capacity`). I branched because you were on `main`.\n\n- **Bug:** `put()` only removed an item once the cache held more than one item over its capacity, so `LRUCache(2)` kept three. It now removes the least recently used item as soon as the cache goes over capacity (`lru/__init__.py:17`).\n- **Test:** `test_put_evicts_least_recently_used_beyond_capacity` puts three items into a cache with capacity 2 and checks that only `b` and `c` remain. It failed before the fix, and both tests pass now with `python3 -m pytest -q`.\n\nI didn't add time-to-live expiry (#42). The commit message says `Fixes #41`. Nothing is pushed and no PR is open yet."
