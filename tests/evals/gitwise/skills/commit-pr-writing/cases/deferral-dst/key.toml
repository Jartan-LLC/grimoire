split = "screen"
kind = "regression"
hints = ["mention #32", "follow-up"]

[[fact]]
text = "#32"
where = "prompt"

[[plant]]
id = "offset-ignored"
verify = '''python3 -c "
import sys
from tzconv import to_utc
sys.exit(to_utc('2026-03-01 09:00', 'Europe/Paris').hour != 8)
"'''

[[check]]
metric = "kept"
artifact = "commits"
present = '''#32\b'''

[[check]]
metric = "format"
artifact = "commits"
present = '''\A(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)(\([^)]+\))?!?: \S'''

[[check]]
metric = "delivered"
artifact = "delivery"
skill = "gitwise:commit-pr-writing"
write = "commit"
state = "in-context"

