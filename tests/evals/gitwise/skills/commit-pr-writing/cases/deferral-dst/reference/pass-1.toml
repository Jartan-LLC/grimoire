commits = ["fix: apply the time zone offset in to_utc\n\nto_utc parsed the local time and returned it unchanged, so every zone\nbehaved like UTC. It now attaches the zone with zoneinfo and converts to\nUTC, still returning a naive datetime as documented.\n\nLocal times inside a daylight-saving gap or overlap are not handled\nspecially: zoneinfo's default (fold=0) applies. Handling them is #32.\n\nFixes #31\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed issue #31 and committed it as `1be79fa fix: apply the time zone offset in to_utc` on a new branch, `feature/issue-31`.\n\n**The bug:** `to_utc` read the time but never used the zone, so every zone acted like UTC.\n\n**The fix:** in `tzconv/__init__.py`, the function now attaches the zone with `zoneinfo`, converts to UTC, and still returns a time with no zone attached, as its docstring says.\n\n**Test:** `test_applies_zone_offset` checks two Paris times:\n- `2026-03-01 09:00` (winter) gives 08:00 UTC.\n- `2026-07-01 09:00` (summer) gives 07:00 UTC, so the summer-time offset is covered too.\n\nThe new test failed before the fix, and both tests pass after it. The project's `python3` (a venv) doesn't have pytest installed, so I ran the tests with the system Python at `/usr/local/python/current/bin/python3`.\n\n**Daylight-saving jumps (#32):** I left these alone. Times that fall inside a jump get `zoneinfo`'s default handling, and the commit message says so and points to #32.\n\nI first made the commit on `main` by mistake. I then moved it to `feature/issue-31` and set local `main` back to `d3dc718`. Nothing was pushed."
