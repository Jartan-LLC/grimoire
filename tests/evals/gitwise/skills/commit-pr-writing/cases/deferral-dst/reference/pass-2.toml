commits = ["fix: apply the time zone's UTC offset in to_utc\n\nto_utc parsed the wall-clock time and returned it unchanged, so every\nzone behaved like UTC. It now attaches the zone with zoneinfo and\nconverts to UTC, which also picks up the summer offset.\n\nTimes inside a daylight-saving gap or overlap are not handled\nspecially: they get zoneinfo's default (fold=0) reading. That is\ntracked in #32.\n\nFixes #31\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed #31 and committed it as `88e7f77` (`fix: apply the time zone's UTC offset in to_utc`) on a new branch, `feature/issue-31`. Nothing is pushed.\n\n**The fix** (`tzconv/__init__.py`): `to_utc` used to parse the time and hand it back unchanged, so every zone acted like UTC. It now attaches the named zone with `zoneinfo` and converts to UTC. It still returns a datetime with no zone attached, as before.\n\n**The test** (`tests/test_tzconv.py`): `test_applies_zone_offset` checks Paris in winter (`2026-03-01 09:00` \u2192 08:00 UTC) and in summer (`2026-07-01 09:00` \u2192 07:00 UTC). It failed before the fix, and both tests pass now.\n\n**Daylight-saving jumps (#32):** I didn't add any handling for times inside a jump. Those times get Python's standard choice of offset. The commit message records this and points to #32.\n\n**Two things to know:**\n- **Running the tests:** `python3 -m pytest -q` from `AGENTS.md` fails in this environment because the active venv doesn't have pytest installed. I ran the tests with `/usr/local/python/current/bin/python3` instead, which is Python 3.12.\n- **Branch move:** I first committed straight to `main`, then moved the commit onto `feature/issue-31` and set `main` back to `8e17056`. If you wanted it on `main`, run `git switch main && git merge --ff-only feature/issue-31`."
