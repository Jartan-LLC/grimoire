commits = ["fix(textstats): count hyphenated words as one word\n\nword_count replaced hyphens with spaces before splitting, so\n\"well-known\" counted as two words. It now splits on whitespace only.\n\nA hyphen surrounded by spaces (\"a - b\") now counts as a word of its\nown. Apostrophes (\"don't\") are left as they are until #18 settles how\ncontractions count.\n\nFixes #17\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed #17 and committed it as `a14140e` on a new branch, `feature/issue-17`, since `main` is the default branch. Nothing is pushed.\n\n**Cause:** `word_count` turned every hyphen into a space before splitting, so \"well-known\" counted as two words. It now splits on whitespace only (`textstats/__init__.py`), and I updated the docstring to match.\n\n**Test:** `test_hyphenated_word_is_one_word` checks that `word_count(\"a well-known fact\") == 3`. It failed before the fix and passes after it. The whole suite passes (2 tests).\n\n**Side effect:** a hyphen with spaces on both sides now counts as a word, so `word_count(\"a - b\")` returns 3 instead of 2. I ran this and the commit message says so. Tell me if you'd rather a lone hyphen not count.\n\n**#18:** I left apostrophes alone. `\"don't\"` still counts as 1, and the commit message points to #18 for the decision on contractions.\n\n**pytest:** the project's venv at `/tmp/grimoire-eval-uo07tl1q/venv` has no pytest, so `python3 -m pytest -q` fails there. I ran the tests with `/usr/local/python/current/bin/python3`, which is also 3.12, and didn't install anything into the venv."
