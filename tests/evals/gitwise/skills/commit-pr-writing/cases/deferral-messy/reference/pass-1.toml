commits = ["fix(textstats): count hyphenated words as one word\n\nword_count replaced hyphens with spaces before splitting, so\n\"well-known\" counted as two words. A hyphenated compound is one word,\nso word_count now splits on whitespace only.\n\nWords with apostrophes are left as they are; how to count\ncontractions is undecided and tracked in #18.\n\nFixes #17\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed #17 and committed it as `cc1101c fix(textstats): count hyphenated words as one word` on a new branch, `feature/issue-17`. Nothing is pushed and no PR is open.\n\n- **The bug:** `word_count` in `textstats/__init__.py` replaced every hyphen with a space before splitting the text into words. That turned \"well-known\" into two words.\n- **The fix:** it now splits on whitespace only, and I updated the docstring to say so.\n- **The test:** `test_hyphenated_word_counts_as_one` in `tests/test_textstats.py` checks that `\"a well-known fact\"` counts as 3 words. It failed before the fix and passes after it, and both tests in the suite pass.\n- **Apostrophes:** I left them alone. The commit message says the contraction question is tracked in #18, and it ends with `Fixes #17`.\n\nThe project's virtualenv doesn't have pytest installed, so `python3 -m pytest -q` from AGENTS.md fails there. I ran the tests with the system Python at `/usr/local/python/current/bin/python3`, which has pytest, and didn't install anything into the venv.\n\nI first named the branch `fix/17-hyphenated-words`, then renamed it to `feature/issue-17` to follow the repo's branch-naming convention. The rename happened before any push."
