commits = ["fix(textstats): count hyphenated words as one word\n\nword_count turned hyphens into spaces, so \"well-known\" counted as two\nwords. It now splits on whitespace only.\n\nCloses #17\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed issue #17 and committed it as `2df1e25` on a new branch, `feature/issue-17`. `main` is where it started, and nothing has been pushed.\n\n- **Fix** (`textstats/__init__.py`): `word_count` used to turn hyphens into spaces before splitting the text. It now splits on whitespace only, so \"well-known\" counts as one word.\n- **Test** (`tests/test_textstats.py`): `test_hyphenated_word_is_one_word` checks that `word_count(\"a well-known fact\") == 3`.\n- **Commit:** `fix(textstats): count hyphenated words as one word`, with `Closes #17` in the body.\n\n**I couldn't run the suite with pytest:** `python3 -m pytest -q` failed because pytest isn't installed in the project venv or the system Python. Instead I called the test functions directly with plain Python. The new test failed on the old code and passed after the fix, and `test_spaces` still passes. To run them properly, install pytest and run the suite again.\n\n**Two slips, both fixed before pushing:**\n- My first commit included `__pycache__` files, so I amended the commit to take them out.\n- I'd committed directly on `main`, so I moved the commit to the branch and set `main` back to `04af8b8`.\n\nI didn't change apostrophe handling, since that's #18. The fix doesn't touch it, so \"don't\" still counts as one word, as before."
