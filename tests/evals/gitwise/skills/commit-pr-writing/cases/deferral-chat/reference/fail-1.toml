final = "I fixed #203 and committed it on a new branch, `feature/issue-203` (`3929942`), not on `main`. Both tests pass.\n\n- **Fix** (`money/__init__.py`): `money(-5)` now returns `-$5.00`. The amount is still formatted exactly as before; the code only moves the minus sign in front of the `$`. Rounding stays as it was, so #204 is untouched.\n- **Test** (`tests/test_money.py`): added `test_negative`, which checks that `money(-5)` gives `-$5.00`.\n- **Commit:** `fix: put the minus sign before the dollar sign`, with `Closes #203` in the body.\n\nWhen #204 gets decided, finance should also say how tiny negative amounts should display. Today `money(-0.001)` gives `-$0.00`, the same as the old `$-0.00` with the sign moved.\n\nA hook asked me to load the `gitwise:commit-pr-writing` skill, but it isn't installed, so I couldn't check the commit message against it. Nothing has been pushed and I haven't opened a PR. Tell me if you want either."
