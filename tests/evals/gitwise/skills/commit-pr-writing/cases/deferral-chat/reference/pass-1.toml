commits = ["fix: put the minus sign before the dollar sign\n\nFinance wants negative amounts written as -$5.00, not $-5.00.\n\nAn amount that rounds to zero from below, such as -0.001, still\nformats as -$0.00. Whether that should read $0.00 depends on the\nhalf-cent rounding rule, which is waiting on finance in #204.\n\nCloses #203\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed #203: `money(-5)` now returns `-$5.00`, and a new test checks it. Both tests pass. It's committed as `dd30f73` (`fix: put the minus sign before the dollar sign`, with `Closes #203`) on a new branch, `feature/issue-203`, since you were on `main`. Nothing is pushed.\n\nOne edge case for #204: a tiny negative amount like `-0.001` now prints `-$0.00` instead of `$-0.00`. Whether it should print plain `$0.00` depends on the rounding rule finance hasn't decided yet, so I left it alone. The commit message notes this and points to #204."
