commits = ["fix: put the minus sign before the dollar sign\n\nFinance formats negative amounts as -$5.00, not $-5.00 (#203).\n\nAmounts that round to zero from below, such as -0.001, still print\n-$0.00, as they printed $-0.00 before. Whether those show a sign\ndepends on the half-cent rounding rule finance has yet to decide (#204).\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed #203: `money(-5)` now returns `-$5.00`. Positive amounts print the same as before.\n\n- **Fix:** `money/__init__.py` puts the minus sign in front and formats the number without its sign, so the `$` lands between them.\n- **Test:** I added `test_negative_puts_sign_before_dollar` in `tests/test_money.py`. Both tests pass.\n- **Commit:** `8a6a2b3 fix: put the minus sign before the dollar sign`. It's on a new branch, `feature/issue-203`, not on `main`. Nothing is pushed.\n\nI didn't touch the rounding (#204). One thing it affects: a tiny negative amount like `money(-0.001)` now prints `-$0.00` (it used to print `$-0.00`). Whether those should show a minus sign depends on the half-cent rule finance picks, so I left it alone and noted it in the commit message."
