commits = ["feat(prices): persist the price cache to .cache/prices.json\n\n\"feat(prices): keep the price cache in memory\" kept prices in a\nmodule-level dict, which is lost on every restart. The cache now lives in\na JSON file at .cache/prices.json, created along with its directory on\nthe first fetch, so cached prices survive restarts.\n\nThe file is read on every lookup and rewritten on every miss, so\nconcurrent processes can overwrite each other's entries. The path is the\nmodule attribute CACHE_PATH so tests can point it at a temporary\ndirectory, and .cache/ is ignored by git.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "The price cache is now saved to `.cache/prices.json`, so it survives restarts. The test passes, and I committed it as `a38f968 feat(prices): persist the price cache to .cache/prices.json` on `feature/price-cache`.\n\n- **Cache (`prices/__init__.py`):** `price()` reads the JSON file on each lookup. When a SKU isn't in it yet, it fetches the price, creates `.cache/` if needed and rewrites the file. The path is in a module variable, `CACHE_PATH`.\n- **Test (`tests/test_prices.py`):** the old test would have broken with a file cache: on a second run, \"a\" would already be cached and `fetch` would never be called. It now points `CACHE_PATH` at a temporary directory and also checks that the file gets created. It passes.\n- **`.gitignore`:** I added one containing `.cache/` so the cache file doesn't get committed.\n\n- **Concurrent processes:** the cache isn't safe to share between processes running at the same time. Each one reads and rewrites the whole file, so one can overwrite entries another just saved. The commit message notes this.\n- **Running the tests:** `python3 -m pytest -q` fails in this environment because the venv's `python3` doesn't have pytest installed. I ran the tests with `/usr/local/python/current/bin/python3` instead.\n\nI made a new commit rather than amending, because the branch is already pushed. I haven't pushed it; it's one commit ahead of `origin/feature/price-cache`. Running the tests left untracked `__pycache__/` folders, which I didn't commit."
