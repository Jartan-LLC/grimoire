commits = ["feat(prices): persist the price cache to .cache/prices.json\n\n\"feat(prices): keep the price cache in memory\" held prices in a\nmodule-level dict, which is lost on every restart, so each new process\nrefetched every price. The cache is now a JSON file at\n.cache/prices.json, created along with its directory on the first miss\nand ignored by git.\n\nThe file is read on every lookup rather than once at import, so a\nlookup sees prices written by another process. Writes are neither\natomic nor locked, so the cache is not safe for concurrent writers.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "The price cache now lives in a JSON file at `.cache/prices.json`, so prices survive a restart. The change is committed as `342d65e feat(prices): persist the price cache to .cache/prices.json`. I haven't pushed it, so the remote branch is still at `e5f2eb9`.\n\n- **`prices/__init__.py`:** `price()` reads the file on every lookup. The first time a price isn't in the file, it creates the `.cache/` directory and writes the file. Reading on every call means a lookup also sees prices that another process wrote.\n- **Test:** it now points the cache at a temporary directory. Otherwise the file from one run would be found on the next run, the price wouldn't be fetched, and the \"fetches once\" check would fail. It also checks that the file gets created. It passes (1 passed).\n- **`.gitignore`:** new file containing `.cache/`, so the cache file isn't committed by accident.\n\n- **Running the tests:** `python3 -m pytest -q` failed because the repo's virtualenv doesn't have pytest installed. I ran the tests with `/usr/local/python/current/bin/python3` (also Python 3.12) instead.\n- **Two processes at once:** writes to the file aren't locked or atomic, so it isn't safe for two processes to update the cache at the same time. The commit message says so.\n\nTo publish it, run `git push`. No force push is needed since nothing already pushed was changed."
