commits = ["feat(prices): persist the price cache to a JSON file\n\nThe in-memory dict was lost on every restart. Prices are now read from and\nwritten to .cache/prices.json, created on first write, so cached prices\nsurvive a restart. The directory is ignored by git.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "The price cache now lives in `.cache/prices.json`, so it survives restarts. The test passes and the change is committed as `ec548fa feat(prices): persist the price cache to a JSON file`. I haven't pushed it.\n\n- **`prices/__init__.py`:** `price()` reads the cache from `CACHE_PATH` (`.cache/prices.json`). On a miss, it fetches the price, creates the directory if needed and writes the file back.\n- **`tests/test_prices.py`:** the test now points `CACHE_PATH` at a temporary directory. Otherwise it would read a leftover cache file and fail every time after the first run.\n- **`.gitignore`:** I added `.cache/` so the cache file doesn't show up as untracked. There was no `.gitignore` before.\n\nPytest isn't installed in the project's virtualenv, which has no pip either, so `python3 -m pytest -q` fails. I ran the test through `uv run --with pytest` instead. My first test run failed on that and I didn't catch it until after the commit; the commit is unchanged since then and the test passes on it.\n\nThe cache file is read and rewritten on every call, and nothing locks it. That's fine for a single process, but two processes writing at once could lose entries."
