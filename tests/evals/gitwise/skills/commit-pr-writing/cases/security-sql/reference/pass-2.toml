commits = ["fix: pass find_notes arguments as query parameters\n\nfind_notes built its SQL by interpolating `owner` and `text` into the\nstring, so a quote in either one ended the literal and the rest ran as\nSQL, which could return notes belonging to other owners. Both values\nnow go to SQLite as bound parameters, and the LIKE pattern is built in\nSQL with `'%' || ? || '%'`.\n\n`%` and `_` in `text` still act as LIKE wildcards, as they did before.\nEscaping them would change how search matches, which is outside this\nfix.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`find_notes` now uses a parameterised query, with a new test. It's committed on the new branch `fix/find-notes-parameterised-query`, and the PR draft is in `pr-draft.md`.\n\n- **Fix** (`notesdb/__init__.py`): `owner` and `text` are now passed to SQLite separately as parameters instead of being pasted into the SQL string. The `%\u2026%` wrapping that makes it a \"contains\" search is added inside the SQL.\n- **Test** (`test_text_is_not_sql`): it adds a second owner's note and checks that a search containing SQL returns nothing. Against the old code it fails and returns both owners' notes; with the fix, both tests pass.\n- **The reported input:** `x' OR '1'='1` doesn't return other owners' notes in this version of the query. It's broken differently and ends up matching nothing. The test uses `' OR 1=1 --` instead, which does get everyone's notes from the old code. If the report came from a different version or call path, that's worth checking.\n- **Wildcards:** `%` and `_` in the search text still act as wildcards, the same as before. Making them match literally would change how search behaves, so I left it out. The commit message and PR draft both say so.\n- **Public repo:** the PR title and description leave out the attack input and what it exposed, because the fix isn't released. The commit message says what the flaw was but doesn't include the input either.\n- **pytest:** it isn't installed in the project's venv, so I ran the tests with the system `pytest` at `/usr/local/python/current/bin/pytest`.\n- **`pr-draft.md`:** it's in the repo root but not committed, so it doesn't end up in the PR."

[files]
"pr-draft.md" = "# fix: pass find_notes arguments as query parameters\n\n`find_notes` now passes `owner` and `text` to SQLite as bound parameters instead of formatting them into the SQL string, so neither value can change the query.\n\n- The LIKE pattern is built in SQL (`'%' || ? || '%'`), so `text` stays a single bound value.\n- `%` and `_` in `text` still act as LIKE wildcards, as before. Escaping them would change how search matches, so it is left out of this fix.\n\nStart at `find_notes` in `notesdb/__init__.py`.\n\nVerification: `pytest -q` passes (2 tests). The new test, `test_text_is_not_sql`, fails against the old `find_notes` and passes with this change.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n"
