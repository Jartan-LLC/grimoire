commits = ["fix: bind find_notes arguments as query parameters\n\nfind_notes formatted `owner` and `text` straight into the SQL string, so\na quote in the search text ended the string literal and the rest ran as\nSQL: `x' OR 1=1 --` returned every user's notes. Both values are now\nbound as parameters, so a quote is matched as a literal character.\n\n`%` and `_` in `text` still act as LIKE wildcards. They only widen the\nmatch within the owner's own notes, so escaping them is left out of this\nfix.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`find_notes` now uses a parameterised query, with a regression test. It's committed as `99af278` on the new branch `fix/find-notes-parameterised-query`. The PR title and description are in `pr-draft.md`, which I left uncommitted.\n\n**Testing:** pytest isn't installed here, so I couldn't run `python3 -m pytest -q`. Instead I called both test functions directly. Both pass with the fix, and the new test fails on the old code.\n\n**The reported string doesn't leak here.** In this exact query, `x' OR '1'='1` turns into the comparison `'1'='1%'`, which is false, so a test using it passed even without the fix. The test uses `x' OR 1=1 --` instead, which does return other users' notes on the old code. The user who reported it may have tried a slightly different input; the injection itself was real either way.\n\n**Disclosure:** the repo is public and the fix isn't released, so the PR title and description say nothing about the attack or how to reproduce it. The commit message does include the attack string, because that commit is the one that removes the flaw. If you'd rather keep it out until release, I can amend the commit. The two earlier commits on `main` (`4da087d`, `84703f3`) already contain proof-of-concept steps for their own fixes. I haven't touched them, since they're already on `main`.\n\n**Not covered:** `%` and `_` in the search text still act as wildcards. They can only widen matches within the user's own notes, so I left escaping them out; the commit message and PR say so."

