"pr-draft.md" = "# fix: bind find_notes arguments as query parameters\n\n`find_notes` now passes `owner` and `text` to SQLite as bound parameters instead of formatting them into the SQL string.\n\n- `%` and `_` in the search text still work as LIKE wildcards. They only widen matches within the owner's own notes, so escaping them is left for a separate change.\n\nStart reading at `find_notes` in `notesdb/__init__.py`.\n\nVerification: pytest isn't installed in this environment, so I called both test functions directly. Both pass with the fix. The new test, `test_quotes_in_text_stay_literal`, fails on the old code.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n\nRepro: search for x' OR '1'='1 to see every note.\n"
