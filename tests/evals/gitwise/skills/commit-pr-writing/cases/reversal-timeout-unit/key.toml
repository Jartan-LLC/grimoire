split = "confirm"
kind = "regression"
hints = ["earlier commit", "previous commit"]

[[check]]
metric = "kept"
artifact = "commits"
present = '''(?i)take\s+the\s+connect\s+timeout\s+in\s+milliseconds'''

[[check]]
metric = "kept"
artifact = "commits"
present = '''(?i)\bseconds?\b'''

[[check]]
metric = "format"
artifact = "commits"
present = '''\A(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)(\([^)]+\))?!?: \S'''

[[check]]
metric = "delivered"
artifact = "delivery"
skill = "gitwise:commit-pr-writing"
write = "commit"
state = "in-context"

[[baseline]]
model = "claude-opus-5-5"
arm = "none"
failures = 3
runs = 3
runner = 2

