commits = ["fix(netlib)!: take the connect timeout in seconds\n\nconnect(timeout=...) now takes seconds, like every other function in\nnetlib. This reverses 81ed60e, which switched it to milliseconds: pass\nseconds, not milliseconds. The default stays 5 seconds.\n\nBREAKING CHANGE: connect(timeout=...) is in seconds, not milliseconds.\nCallers updated to pass milliseconds must change back, e.g.\ntimeout=2000 becomes timeout=2.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I switched `connect` back to seconds and committed it as `9435cd0` on `feature/connect`. The test passes. I haven't pushed it.\n\n- **Code:** `connect(host, timeout: float = 5)` now takes seconds and stores the value unchanged as `timeout_s`. The default is still 5 seconds, the same as the old 5000 ms.\n- **Test:** it now passes `timeout=2` and expects `2`.\n- **Commit message:** `fix(netlib)!: take the connect timeout in seconds`. Since `81ed60e` was already pushed, I added a new commit instead of rewriting that one. The message says it reverses `81ed60e` and that callers should pass seconds, not milliseconds. It also has a `BREAKING CHANGE:` footer with an example: `timeout=2000` becomes `timeout=2`. That way teams who already followed the earlier commit will know to change their calls back.\n\nThe branch is now one commit ahead of `origin/feature/connect`. Run `git push` when you want the other teams to see it.\n\nThe hook asked me to load a `gitwise:commit-pr-writing` skill, but no skill by that name is installed. I used `gitwise:github-conventions` and the commit rules in `AGENTS.md` instead."
