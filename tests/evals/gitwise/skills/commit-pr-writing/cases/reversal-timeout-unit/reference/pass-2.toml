commits = ["fix(netlib)!: take the connect timeout in seconds\n\n\"feat(netlib): take the connect timeout in milliseconds\" told callers to\npass timeout= in milliseconds. That made connect the only function in\nthe library not taking seconds. Pass timeout= to connect in seconds,\nlike every other netlib function; the default stays 5 seconds.\n\nBREAKING CHANGE: connect(timeout=...) takes seconds, not milliseconds.\nA caller passing milliseconds (timeout=2000) now gets a 1000x longer\ntimeout; divide by 1000.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`connect` now takes its timeout in seconds again, and I committed the change as `81f65bd` on `feature/connect`. The default is still 5 seconds. The test now passes `timeout=2` and expects 2 seconds back, and the test suite passes.\n\n- **Commit message:** it names the earlier commit, \"feat(netlib): take the connect timeout in milliseconds\", by its subject. It tells callers to pass seconds like every other function in the library.\n- **Marked as breaking:** anyone who already followed the milliseconds instruction will silently get a timeout 1000 times too long (`timeout=2000` becomes 2000 seconds). So the subject is marked breaking with `fix(netlib)!:`, and a `BREAKING CHANGE:` footer tells callers to divide their value by 1000.\n- **Earlier commit left as is:** I added a new commit rather than amending or rewriting the milliseconds one, because the branch is already pushed.\n\nI haven't pushed, so the other teams won't see the new message until you do. Run `git push` when you're ready."
