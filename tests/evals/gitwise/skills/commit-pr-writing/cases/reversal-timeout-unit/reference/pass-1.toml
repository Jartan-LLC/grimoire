commits = ["fix(netlib)!: take the connect timeout in seconds\n\n\"feat(netlib): take the connect timeout in milliseconds\" told callers to\npass timeout= in milliseconds. That is withdrawn: every other function in\nnetlib takes seconds, and a single millisecond outlier invites unit\nmix-ups. Callers must pass connect(timeout=...) in seconds; a call\nupdated to milliseconds (e.g. timeout=2000) must go back to seconds\n(timeout=2). The default stays five seconds, and timeout now accepts a\nfloat for sub-second values.\n\nBREAKING CHANGE: connect(timeout=...) takes seconds, not milliseconds.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`connect` takes its timeout in seconds again, and I committed the change as `a4417a2` on `feature/connect`. The test passes.\n\n- **Code:** in `netlib/__init__.py`, `connect(host, timeout: float = 5)` passes the value through as `timeout_s`. The default is still five seconds, and fractional values like `0.5` now work.\n- **Test:** it now calls `connect(\"h\", timeout=2)` and checks for `timeout_s == 2`.\n- **Commit:** the subject is `fix(netlib)!: take the connect timeout in seconds` and it has a `BREAKING CHANGE:` footer. Since other teams update their calls from the commit messages, the body names the earlier commit (\"feat(netlib): take the connect timeout in milliseconds\") and says its advice is withdrawn. It also tells callers to go back to seconds: `timeout=2000` becomes `timeout=2`.\n\nI left the earlier milliseconds commit in place rather than rewriting it, because it's already pushed. The new commit isn't pushed yet; the branch is one commit ahead of `origin/feature/connect`. Teams won't see the correction until it's pushed. Should I push it?"
