final = "I wrote the PR draft to `pr-draft.md` in the repository root. Its title is `feat(textstats): count sentences`, the same as the branch's only commit.\n\nThe description says why the change exists (readability scores need a sentence count alongside the word count) and notes three behaviours a reviewer could miss. I checked each one by calling `sentence_count` directly:\n- **Repeated punctuation:** a run like `...` or `?!` ends one sentence, so `\"Wait... what?!\"` counts as 2.\n- **No closing punctuation:** text after the last `.`, `!` or `?` still counts, so `\"no terminator\"` counts as 1. Empty text counts as 0.\n- **Abbreviations and decimals:** these are split as if they ended a sentence, so `\"Dr. Smith paid 3.5 dollars.\"` counts as 3.\n\nFor testing, the draft says that you ran the tests and they passed. I couldn't run them myself because pytest isn't installed in this environment. It also says that only the two-sentence case has a test.\n\nThe draft doesn't say whether splitting on abbreviations is intended or a known limitation, because I didn't want to make up a reason. If you have one, it belongs on the abbreviations line."

