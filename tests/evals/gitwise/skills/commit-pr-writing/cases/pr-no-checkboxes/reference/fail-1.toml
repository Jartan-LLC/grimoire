"pr-draft.md" = "# feat(textstats): count sentences\n\nAdds `sentence_count`, which counts the sentences in a text, because readability scores need a sentence count to go with the word count.\n\n- A run of terminators ends one sentence, so `\"Wait... what?!\"` counts as 2.\n- Text after the last terminator counts as a sentence, so `\"no terminator\"` counts as 1. Empty or whitespace-only text counts as 0.\n- Abbreviations and decimals are not handled: `\"Dr. Smith paid 3.5 dollars.\"` counts as 3.\n\nStart reading at `sentence_count` in `textstats/sentences.py`.\n\n`python3 -m pytest -q` passes, run by the author. The cases above were checked by calling `sentence_count` directly. Only the two-sentence case in `tests/test_sentences.py` has a test.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n\n- [x] Tests pass\n"
