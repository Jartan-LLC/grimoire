commits = ["fix(paths): collapse repeated slashes in normalize\n\n`a//b` now normalizes to `a/b`, like the trailing-slash case already did.\n\nBackslashes are left alone on purpose: nobody here can test on Windows,\nand guessing at backslash semantics could break the one user who runs\nit there. A test pins that behaviour so a later change has to be\ndeliberate.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`normalize` now collapses repeated slashes, so `a//b` becomes `a/b`. It's committed as `f1919ad fix(paths): collapse repeated slashes in normalize`.\n\n- **Change:** `paths/__init__.py` collapses any run of two or more `/` into one, then removes the trailing slash as before.\n- **Backslashes:** I added `test_backslashes_untouched` so the decision to leave them alone is covered by a test. Anyone who changes it later will see that test fail. The commit message gives the reason.\n- **Tests:** I couldn't run `python3 -m pytest -q`: pytest isn't installed in the venv, and neither is pip. Instead I called each test function directly, and all three passed: the two new ones and the existing trailing-slash test. I also checked that the old code turns `a//b///c` into `a//b///c` unchanged, so the new test does fail without the fix.\n\nOne side effect: a leading `//` (as in `//host/share`) also becomes `/`. That fits what you asked for, but tell me if you want leading `//` kept as it is."
