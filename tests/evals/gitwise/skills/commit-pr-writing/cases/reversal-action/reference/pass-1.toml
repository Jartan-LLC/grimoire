commits = ["feat(users): return None from get_user for an unknown user\n\nThis replaces \"feat(users): raise LookupError for an unknown user\". That\ncommit told callers to catch LookupError from get_user() when the id may\nnot exist, which made every caller wrap the call in try/except. get_user()\nno longer raises for an unknown id: it returns None. Callers should drop\ntheir LookupError handlers and check the result for None instead."]
final = "`get_user` now returns `None` for an unknown id instead of raising `LookupError`. I committed this as `13a3360` on `feature/get-user`.\n\n**Change:**\n- `users/__init__.py`: `get_user` now has the return type `str | None` and uses `_USERS.get(user_id)`. I removed the `_missing` helper because nothing else used it.\n- `tests/test_users.py`: the test now asserts `get_user(9) is None`, and the `pytest` import is gone.\n\n**Commit message:** the other teams read the branch's commit messages, so the body names the earlier commit by its subject, \"feat(users): raise LookupError for an unknown user\". It explains that the earlier commit made every caller wrap the call in try/except. It then tells callers what to do now: remove their `LookupError` handlers and check the result for `None`.\n\n**Tests:** I couldn't run `python3 -m pytest -q`. pytest isn't installed in this environment's venv, and pip isn't available to install it. Instead I checked the behaviour directly in Python: `get_user(9)` returns `None` and `get_user(1)` returns `\"ana\"`. Please run the test suite before merging.\n\n**Not pushed:** the branch is one commit ahead of `origin/feature/get-user`. The other teams won't see the new message until it's pushed. I can push it if you'd like."
