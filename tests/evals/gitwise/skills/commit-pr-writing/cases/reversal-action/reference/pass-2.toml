commits = ["feat(users)!: return None from get_user for an unknown user\n\nThis replaces \"feat(users): raise LookupError for an unknown user\". Raising\nmade every caller wrap get_user() in try/except, even where a missing user\nis an expected outcome.\n\nget_user() no longer raises LookupError: it returns None for an unknown id.\nCallers that catch LookupError must check for None instead.\n\nBREAKING CHANGE: get_user() returns None instead of raising LookupError\nfor an unknown id.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`get_user` now returns `None` for an unknown id instead of raising `LookupError`. The test checks for `None`, and I committed both as `6fa7a4e`. The test passes, but only with `/usr/local/python/current/bin/python3`. The project's venv `python3` doesn't have pytest installed.\n\nThe commit message is for the two teams updating their callers:\n\n- **Subject:** `feat(users)!: return None from get_user for an unknown user`. The `!` and a `BREAKING CHANGE:` footer mark it as a breaking change under Conventional Commits.\n- **First paragraph:** it names the earlier commit by its subject (\"feat(users): raise LookupError for an unknown user\"). It says why that wasn't enough: every caller had to wrap `get_user` in try/except, even when a missing user is expected.\n- **What callers should do:** stop catching `LookupError` and check for `None` instead.\n\nI haven't pushed the commit. Run `git push` when you want the other teams to see it."
