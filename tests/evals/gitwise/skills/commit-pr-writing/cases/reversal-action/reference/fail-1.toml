commits = ["feat(users)!: return None from get_user() for an unknown user\n\nWrapping every get_user() call in try/except LookupError made callers\nnoisy; a missing user is an expected outcome, not an error.\n\nBREAKING CHANGE: get_user() no longer raises LookupError for an unknown\nid; it returns None, and its return type is now `str | None`. Replace\n`try: get_user(id) except LookupError:` with a check for\n`get_user(id) is None`. An except LookupError block left in place no\nlonger runs, so the None would pass through unhandled.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I committed the change as `fc1d9ed` on `feature/get-user`. `get_user()` now returns `None` for an unknown id, and its return type is `str | None`. The test now checks for `None` instead of expecting `LookupError`.\n\n- **Testing:** `python3 -m pytest -q` didn't run because pytest isn't installed in this environment, and neither is pip, so I couldn't install it. Instead I imported `get_user` directly: it returns `None` for id 9 and `\"ana\"` for id 1. The test file itself hasn't been run under pytest.\n- **New commit, not an amend:** the earlier commit (`24cb7dc`) is already pushed, so I added a new commit on top rather than rewriting it.\n- **Marked as breaking:** the commit has `!` in the subject and a `BREAKING CHANGE:` footer. The footer tells the other two teams how to change their code: replace `try/except LookupError` with a check for `get_user(id) is None`. It also warns them that a leftover `except LookupError` block will never run, so the `None` would pass through unhandled.\n- **Squash-merge:** with GitHub's default squash message, the merge commit on `main` will contain both commit messages. That means it will still include the old \"callers must catch LookupError\" line. Edit that message when you merge so it doesn't mislead anyone reading `main`.\n- **Not pushed:** you asked for a commit only, so the branch is one commit ahead of `origin`. The other teams won't see the new message until you push.\n\nA hook asked me to load a `gitwise:commit-pr-writing` skill, but it isn't in the list of available skills, so I couldn't load it."
