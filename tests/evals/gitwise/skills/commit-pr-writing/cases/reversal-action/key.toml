split = "confirm"
kind = "regression"
hints = ["earlier commit", "tell callers"]

[[check]]
metric = "kept"
artifact = "commits"
present = '''(?i)raise\s+LookupError\s+for\s+an\s+unknown\s+user|catch\s+LookupError'''

[[check]]
metric = "kept"
artifact = "commits"
present = '''(?i)\bNone\b'''

[[check]]
metric = "format"
artifact = "commits"
present = '''\A(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)(\([^)]+\))?!?: \S'''

[[check]]
metric = "delivered"
artifact = "delivery"
skill = "gitwise:commit-pr-writing"
write = "commit"
state = "in-context"

[[baseline]]
model = "claude-opus-5-5"
arm = "none"
failures = 1
runs = 3
runner = 2

