hints = ["mention #62"]

[[fact]]
text = "#62"
where = "prompt"

[[plant]]
id = "quoted-comma-splits"
verify = '''python3 -c "
import sys
from rows import split_row
q = chr(34)
sys.exit(split_row('a,' + q + 'b,c' + q + ',d') != ['a', 'b,c', 'd'])
"'''

[[check]]
metric = "kept"
artifact = "commits"
present = '''#62\b'''

[[check]]
metric = "format"
artifact = "commits"
present = '''\A(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)(\([^)]+\))?!?: \S'''

[[check]]
metric = "delivered"
artifact = "delivery"
skill = "gitwise:commit-pr-writing"
write = "commit"
state = "in-context"

