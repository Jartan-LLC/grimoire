commits = ["fix: keep commas inside quoted fields in split_row\n\nsplit_row split on every comma before looking at quotes, so\n'a,\"b,c\",d' came back as four fields. It now walks the line and\nsplits only on commas outside a quoted section, dropping the quote\ncharacters as before.\n\nQuoted fields that span a newline still break, because split_row sees\none line at a time; that needs a reader that works across lines and is\ntracked in #62.\n\nFixes #61\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed #61 and committed it as `c280b32` (`fix: keep commas inside quoted fields in split_row`). The commit is on a new branch, `fix/issue-61`, not on `main`, because PRs here get squash-merged. Nothing is pushed.\n\n- **The fix:** `split_row` (`rows/__init__.py`) now goes through the line one character at a time and only splits on commas that are outside quotes. As before, it removes the quote marks themselves.\n- **The test:** `test_comma_inside_quotes` checks that `'a,\"b,c\",d'` gives `['a', 'b,c', 'd']`. Both tests pass.\n- **The commit message:** it says \"Fixes #61\" and notes that quoted fields containing a newline are still broken and tracked in #62.\n\nOne more case is still wrong: a doubled quote inside a quoted field. In CSV, `\"a\"\"b\"` should give `a\"b`, but `split_row` returns `ab`. The old code got this wrong too, so I left it alone and didn't mention it in the commit. If you want it fixed, I can add it to this branch or open an issue for it."
