commits = ["fix: keep commas inside quoted fields together\n\nsplit_row split on every comma, so 'a,\"b,c\",d' gave four fields. It now\nparses the line with the stdlib csv reader rather than a hand-written\nquote scanner, which also turns a doubled quote (\"\") into one literal\nquote. An empty line now gives [] instead of [''].\n\nQuoted fields that contain a newline still break, since split_row sees\none line at a time; that is #62.\n\nFixes #61\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed #61: `split_row('a,\"b,c\",d')` now returns `['a', 'b,c', 'd']`. The commit is `0a91626 fix: keep commas inside quoted fields together` on a new branch, `feature/issue-61`. I first committed it straight to `main` by mistake, then moved it to the branch and set `main` back to `8742589`. Nothing has been pushed.\n\n- **Fix:** `split_row` in `rows/__init__.py` now uses Python's built-in `csv` module to split the line, instead of splitting on every comma and stripping quotes.\n- **Test:** I added `test_comma_inside_quotes` to `tests/test_rows.py`. It failed before the fix and passes after it; both tests pass.\n- **Other behaviour changes:**\n  - A doubled quote inside a quoted field (`\"x\"\"y\"`) now comes back as one quote (`x\"y`).\n  - An empty line now returns `[]` instead of `['']`.\n\n  I checked both by running them, and the commit message records them.\n- **#62:** The commit message says quoted fields containing a newline still break and points to #62. It ends with `Fixes #61`."
