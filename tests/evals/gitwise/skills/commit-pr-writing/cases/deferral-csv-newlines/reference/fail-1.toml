commits = ["fix: don't split on commas inside quoted fields\n\nsplit_row split on every comma, so 'a,\"b,c\",d' gave four fields. It\nnow tracks whether it is inside quotes, and reads a doubled quote\ninside a quoted field as a literal quote.\n\nFixes #61\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed bug #61 and committed it as `d05ac64` on a new branch, `feature/issue-61`; I didn't commit straight to `main`. Nothing is pushed. All 3 tests pass.\n\n- **Fix:** `split_row` in `rows/__init__.py` used to split on every comma. It now keeps track of whether it's inside quotes, so `split_row('a,\"b,c\",d')` returns `['a', 'b,c', 'd']`.\n- **Doubled quotes:** inside a quoted field, `\"\"` now reads as one literal `\"`. You didn't ask for this, but it's the usual CSV rule and the new quote handling needed some answer for it. Before, those quotes were simply dropped.\n- **Tests:** I added two to `tests/test_rows.py`, one for the comma inside quotes and one for doubled quotes.\n- **Commit message:** it ends with `Fixes #61`, so GitHub will close the issue when this reaches `main`. I didn't mention #62 in the commit, so it stays open.\n\nThe `gitwise:commit-pr-writing` skill a hook asked for doesn't exist here, so I wrote the commit message without it."
