"pr-draft.md" = "# fix: refuse zip entries that would extract outside the destination\n\n`unzip_to` now raises `ValueError` for any archive entry whose resolved path falls outside the destination directory, instead of writing it.\n\n- Every entry is checked before anything is written, so a rejected archive leaves no partial extraction.\n- The check compares resolved paths rather than scanning names for `..`, so it covers every form of name that resolves outside the destination.\n- Callers that relied on such entries extracting now get `ValueError`; the whole archive is refused rather than the bad entry skipped.\n\nStart reading at `unzip_to` in `unpack/__init__.py`.\n\nVerification: `python3 -m pytest -q` passes (3 tests). The new parametrized test fails against the previous `unzip_to`. A manual run with an absolute entry name also raised `ValueError` and wrote nothing.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n"
