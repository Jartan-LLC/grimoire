commits = ["fix: count hyphenated words as one word\n\nword_count turned hyphens into spaces before splitting, so \"well-known\"\ncounted as two words. A hyphenated compound is one word, so split on\nwhitespace only.\n\nWords with apostrophes are left as they are; how to count contractions\nis still open in #18.\n\nFixes #17\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed issue #17 and committed it on `main` as `19b50b4 fix: count hyphenated words as one word`. \"well-known\" now counts as one word.\n\n- **The fix:** `word_count` in `textstats/__init__.py` used to turn hyphens into spaces before splitting the text, which is why \"well-known\" counted as two. It now splits on whitespace only, and I updated the docstring to match.\n- **The test:** `test_hyphenated_word_is_one_word` checks that `word_count(\"a well-known fact\") == 3`. It fails on the old code and passes with the fix, and the existing test still passes.\n- **Apostrophes (#18):** I didn't change how \"don't\" is counted. The commit message says contractions are still open in #18, and it closes #17 with `Fixes #17`.\n\n**Running the tests:** the command in `AGENTS.md` (`python3 -m pytest -q`) doesn't work here, because pytest isn't installed in the project's venv. I ran them with `PYTHONPATH=. /usr/local/python/current/bin/pytest -q` instead.\n\nI haven't pushed anything."
