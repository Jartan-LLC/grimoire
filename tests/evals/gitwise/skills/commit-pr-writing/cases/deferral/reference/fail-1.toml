commits = ["fix: count a hyphenated word as one word\n\nword_count split on hyphens as well as whitespace, so \"well-known\"\ncounted as two words. Split on whitespace only.\n\nCloses #17\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed #17 and committed it as `fix: count a hyphenated word as one word` on a new branch, `feature/issue-17`. Nothing is pushed.\n\n- **Fix:** `word_count` used to split on hyphens as well as whitespace. Now it splits on whitespace only, and I updated the docstring to match (`textstats/__init__.py`).\n- **Test:** I added `test_hyphenated_word_is_one_word`, which checks that `\"a well-known fact\"` counts as 3 words.\n- **Apostrophes (#18):** I didn't touch these. Whitespace splitting already counts \"don't\" as one word, so this change doesn't settle anything for #18.\n\n**Testing:** `python3 -m pytest -q` didn't run because pytest isn't installed in this venv. I ran both tests by calling them directly, and they pass. The old code returns 4 for the new test's input, so the test does catch the bug.\n\n**Behaviour change:** a hyphen surrounded by spaces now counts as a word, so `\"a - b\"` is 3 instead of 2. Let me know if a standalone dash shouldn't count and I'll handle it.\n\nThe commit message ends with `Closes #17`, so the issue closes when the PR is squash-merged."
