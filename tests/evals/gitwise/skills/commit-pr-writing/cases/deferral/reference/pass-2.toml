commits = ["fix: count a hyphenated word as one word\n\nword_count turned hyphens into spaces, so \"well-known\" counted as two\nwords. It now splits on whitespace only. Tokens made only of dashes\n(\"-\", \"--\") still don't count as words, as before the change.\n\nWords with apostrophes are left as they are; that waits on #18.\n\nCloses #17\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I fixed #17 and committed it on `main` as `fix: count a hyphenated word as one word`, with `Closes #17` in the message. I haven't pushed it. \"well-known\" now counts as one word.\n\n- **Fix** (`textstats/__init__.py`): `word_count` used to turn every hyphen into a space before splitting the text. It now splits on whitespace only.\n- **One more case:** splitting on whitespace alone would have started counting a lone dash (as in \"a - b\") as a word, which the old code got right. Tokens made only of dashes still aren't counted, so that doesn't break.\n- **Tests:** I added one test for \"a well-known fact\" (3 words) and one for \"a - b -- c\" (3 words). The hyphen test failed before the fix, and all 3 tests pass after it.\n- **Apostrophes:** words like \"don't\" are handled exactly as before. The commit message says that waits on #18.\n\n**Running the tests:** the active venv at `/tmp/grimoire-eval-i9d633v4/venv` has no pytest installed, so `python3 -m pytest -q` from `AGENTS.md` doesn't work there. I ran the tests with the system Python 3.12 (`/usr/local/python/current/bin/python3`) instead.\n\n**Cache files:** my first commit accidentally included the generated `__pycache__/` files. I amended the commit to remove them, so it now changes only the source file and the test file. The repo has no `.gitignore`, so those folders still show up as untracked files. I can add one if you'd like."
