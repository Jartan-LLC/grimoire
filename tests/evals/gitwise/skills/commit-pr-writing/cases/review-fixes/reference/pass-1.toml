commits = ["fix: reject negative or malformed durations\n\nparse_duration collected every <amount><unit> part it could find and\nignored the rest of the string, so \"-5m\" returned 300 and \"5x\" returned\n0. It now requires the whole string to be one or more such parts and\nraises ValueError otherwise. The empty string is rejected too, rather\nthan read as zero seconds.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>", "refactor: rename secs to seconds in parse_duration\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I made both changes and committed them on `feature/durations` as two commits. They aren't pushed.\n\n1. **`16e4bd6 fix: reject negative or malformed durations`**: before, `parse_duration` added up whatever `<number><h|m|s>` pieces it found and ignored the rest of the string, so `\"-5m\"` returned 300. Now the whole string must be one or more of those pieces, or it raises `ValueError`. The new parametrized test checks `\"-5m\"`, `\"5x\"`, `\"1h 30m\"`, `\"m\"` and `\"\"`.\n2. **`92d39a0 refactor: rename secs to seconds in parse_duration`**.\n\n**Behaviour changes to check:**\n- An empty string now raises `ValueError`. It used to return 0.\n- `\"1h 30m\"` is now rejected because of the space. If you want spaces allowed, it's a small change to the pattern.\n\n**Tests:** all 6 pass. With the old code, all 5 new cases fail. The command in `AGENTS.md` (`python3 -m pytest -q`) doesn't work as written here: the `python3` on PATH is the repo's venv, which has no pytest installed. I ran the tests with the system Python 3.12 at `/usr/local/python/current/bin/python3` instead.\n\nRunning the tests left `__pycache__/` directories untracked because the repo has no `.gitignore`. I didn't commit them."
