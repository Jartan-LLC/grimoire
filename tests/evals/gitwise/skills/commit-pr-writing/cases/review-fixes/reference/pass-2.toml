commits = ["refactor: rename secs to seconds in parse_duration\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>", "fix: reject negative and malformed durations\n\nparse_duration collected every <digits><unit> part it could find and\nignored everything else, so \"-5m\" returned 300 and \"\", \"5\" or \"abc\"\nreturned 0. It now raises ValueError unless the whole string is a run\nof such parts. Whitespace between parts (\"1h 30m\") is rejected too,\nsince the parser never defined it as valid.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I made both changes and committed them to `feature/durations` as two commits. Nothing is pushed.\n\n1. **`5e900d8 refactor: rename secs to seconds in parse_duration`**: just the rename.\n2. **`b8a7aae fix: reject negative and malformed durations`**: `parse_duration` now raises `ValueError` unless the whole string is a run of `<digits><h|m|s>` parts. Before, it picked out whatever parts it could find and ignored the rest, so `\"-5m\"` gave 300 and `\"\"`, `\"5\"` or `\"abc\"` gave 0. The new test checks that `\"-5m\"`, `\"\"`, `\"5\"`, `\"5x\"`, `\"1h 30m\"` and `\"abc\"` all raise.\n\n**Tests:** all 7 pass with the fix. With the old parser, all 6 new cases fail, so the test does catch the bug.\n\n**Decision for you:** a space between parts, as in `\"1h 30m\"`, now raises `ValueError`. The old parser accepted it by accident rather than by design. If you want spaces allowed, it's a one-line change to the pattern.\n\n**Two things to know:**\n- **pytest location:** the project venv's `python3` doesn't have pytest installed, so `python3 -m pytest -q` from AGENTS.md fails there. I ran the tests with `/usr/local/python/current/bin/python3` instead.\n- **Untracked files:** running the tests left `__pycache__/` folders behind. The repo has no `.gitignore`, so I didn't commit them."
