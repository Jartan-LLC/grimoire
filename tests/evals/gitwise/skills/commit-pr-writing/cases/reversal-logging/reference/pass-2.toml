commits = ["fix(applog): log to stderr instead of a file\n\n\"feat(applog): log to a file beside the script\" kept logs after the\nterminal closed, but in a container nobody can read a file written\ninside it. Container runtimes capture stderr, so the logs now go there;\nstdout stays free for the program's own output.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I committed the change as `f596c56 fix(applog): log to stderr instead of a file`.\n\n- **Change:** `setup()` in `applog/__init__.py` now attaches a `logging.StreamHandler(sys.stderr)` instead of the `FileHandler`, so no `.log` file is written next to the script anymore.\n- **Tests:** `python3 -m pytest -q` passes (1 test). I also ran it by hand: a logged warning shows up on stderr and nothing goes to stdout.\n- **Commit:** it's a new commit on top of the earlier \"log to a file beside the script\" commit, not an amend, because the branch is already pushed. Its message says why the file approach doesn't work in a container.\n\nI haven't pushed; the branch is 1 commit ahead of `origin/feature/logging`. Tell me if you want me to push it."
