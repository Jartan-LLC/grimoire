commits = ["fix(applog): log to stderr instead of a file\n\n\"feat(applog): log to a file beside the script\" kept the logs after the\nterminal closed, but in the container nobody can read that file. The\ncontainer runtime captures stderr, so the logs go there; stdout stays\nfree for the program's own output.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "The logger now writes to stderr instead of a file, the test passes, and the change is committed as `9698531 fix(applog): log to stderr instead of a file`.\n\n- **The change:** `setup()` in `applog/__init__.py` now adds a `StreamHandler(sys.stderr)` in place of the `FileHandler`, so no `<name>.log` file is created anymore. The container runtime picks up stderr, and stdout stays free for the program's own output.\n- **Commit:** I added a new commit on top of the earlier one rather than rewriting it, because the branch is already pushed. With squash merge both messages end up on `main`, so the new one names the earlier \"log to a file beside the script\" commit and explains why it was replaced.\n- **Push:** I haven't pushed; the branch is one commit ahead of `origin/feature/logging`. To publish it, run `git push`."
