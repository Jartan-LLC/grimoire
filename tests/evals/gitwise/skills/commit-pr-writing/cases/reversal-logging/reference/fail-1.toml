commits = ["fix(applog): log to stderr instead of a file\n\nIn the container nobody can read a file beside the script, while the\ncontainer runtime captures stderr.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I switched the logger from a file to stderr and committed it as `e451a3a` on `feature/logging`. The test passes (`python3 -m pytest -q`: 1 passed).\n\n- **Change:** `setup()` in `applog/__init__.py` now uses `logging.StreamHandler()`, which writes to stderr by default. It no longer creates the `.log` file next to the script.\n- **New commit, not an amend:** the earlier commit `9b955c3` is already pushed, so I added a new commit rather than rewriting it. The message is `fix(applog): log to stderr instead of a file`, and its body says why: nobody can read the file in the container, but the container runtime captures stderr.\n- **Not pushed:** the branch is now 1 commit ahead of `origin/feature/logging`.\n\nWhen the PR is squash-merged with GitHub's default message, both commit messages will end up in the commit on main. That includes `9b955c3`'s \"log to a file beside the script\", which is no longer true. Give the PR a title like \"log to stderr\" so the merged history says what the code actually does.\n\nBefore committing I was told to load a skill called `gitwise:commit-pr-writing`, but it isn't installed, so I wrote the message using the repo's Conventional Commits rule."
