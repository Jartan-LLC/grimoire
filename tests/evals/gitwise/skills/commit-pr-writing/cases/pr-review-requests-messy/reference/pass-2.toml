"pr-draft.md" = "# feat(slug): add slugify for URL slugs\n\nAdd `slugify`, which lower-cases text and turns each run of non-alphanumeric characters into one hyphen, trimming hyphens at the ends. Titles become URL path segments, so they need a stable ASCII form.\n\nText with no letters or digits, such as `\"!!!\"`, gives an empty string rather than a placeholder like `\"untitled\"`, because callers already handle an empty slug. A test covers that case.\n\nBoth tests in `tests/test_slug.py` pass when called directly. The full `python3 -m pytest -q` run was not done, because pytest is not installed in this environment.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n"
