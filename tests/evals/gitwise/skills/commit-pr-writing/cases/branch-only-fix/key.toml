split = "dev"
kind = "regression"
hints = ["no body", "subject only", "one line"]

[[plant]]
id = "misspelled-return"
verify = '''python3 -c "
import sys
sys.exit('Retrun' in open('slug/__init__.py').read())
"'''

[[check]]
metric = "kept"
artifact = "commits"
present = '''\A[^\n]+\s*(\n+Co-Authored-By:[^\n]*)*\s*\Z'''

[[check]]
metric = "format"
artifact = "commits"
present = '''\A(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)(\([^)]+\))?!?: \S'''

[[check]]
metric = "delivered"
artifact = "delivery"
skill = "gitwise:commit-pr-writing"
write = "commit"
state = "in-context"

