split = "screen"
kind = "regression"
hints = ["first line", "open with", "Requires #52"]

[[fact]]
text = "#52"
where = "prompt"

[[check]]
metric = "kept"
artifact = "file:pr-draft.md"
present = '''(?i)\A(?:[^\n]*\n){0,8}[^\n]*\b(requires|depends on|after|needs)\b[^\n]*#52'''

