"pr-draft.md" = "# Title\n\nfeat(notes): read #tags from a note\n\n# Description\n\nRequires #52.\n\nAdds `tags()`, which returns the `#words` in a note's text. A later search can then filter notes by tag without a schema change.\n\n- A tag is any whitespace-separated word that starts with `#`. A bare `#` is skipped, and a `#` in the middle of a word (`c#d`) doesn't count. Punctuation stays in the tag, so `#milk,` gives `milk,`.\n- Tags come back in the order they appear, and duplicates are kept.\n\nStart reading at `tags()` in `notes/tags.py`.\n\nVerification: `pytest` isn't installed in this environment, so `python3 -m pytest -q` didn't run. I called `test_tags` directly, and it passed. `tags(\"a # #b c#d #e\")` returned `['b', 'e']`.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n"
