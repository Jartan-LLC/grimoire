commits = ["fix: reject impossible dates in parse_date\n\nparse_date built the date from the first of the month plus a day offset,\nso a day past the month's end rolled over: \"2026-02-30\" became March 2nd.\nIt now passes the day straight to datetime.date, which raises ValueError\nfor a day the month does not have.\n\nRows already stored with rolled-over dates are not corrected here; their\ndata migration is #311, which has to be scheduled with ops.\n\nFixes #310\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I committed the fix for #310: `parse_date(\"2026-02-30\")` now raises `ValueError` instead of returning March 2nd.\n\n**The cause:** the function added the day to the first of the month, so any day past the month's end rolled into the next month. It now passes the day straight to `datetime.date`, which raises `ValueError` for a day the month doesn't have. The docstring is updated to match.\n\n**The test:** `test_impossible_date_raises` in `tests/test_dates.py`. Against the old code it fails (\"DID NOT RAISE\"), and with the fix both tests pass.\n\n**The commit:** `23b06a1 fix: reject impossible dates in parse_date`. Its message says why the change was made, says the stored rolled-over rows are left for #311 (to be scheduled with ops), and ends with `Fixes #310`. The data migration isn't in this change.\n\nI first committed straight to `main`, then moved the commit to a new branch, `feature/issue-310`, and set local `main` back to `c191066`. Nothing has been pushed and no PR is open. I can push the branch and open one if you'd like."
