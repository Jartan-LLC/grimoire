commits = ["fix: accept plus-addressing in the local part\n\n`ana+news@example.com` was rejected because the local-part character\nclass left out `+`, which RFC 5322 allows and mail providers use for\nsubaddressing.\n\nThe domain pattern is unchanged: whether to accept non-ASCII domains\nis still open in #89.\n\nFixes #88\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`is_valid_email(\"ana+news@example.com\")` now returns True, and the fix is committed on `main` as `d98a8a0 fix: accept plus-addressing in the local part`.\n\n- **Fix:** the pattern for the part before the `@` didn't allow `+`. I added it in `emails/__init__.py:5`.\n- **Test:** I added `test_plus_addressing` to `tests/test_emails.py`. It failed before the fix, and both tests pass after it.\n- **Domains:** I left the domain pattern alone, so non-ASCII domains are still rejected. The commit message says #89 is still open.\n- **Issue link:** the commit message says `Fixes #88`, so GitHub will close #88 when the commit reaches `main` on the remote. Nothing has been pushed."
