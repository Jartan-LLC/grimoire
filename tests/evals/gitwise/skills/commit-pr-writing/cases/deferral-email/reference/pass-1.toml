commits = ["fix: accept plus-addressed local parts in is_valid_email\n\nPlus-addressing (ana+news@example.com) is a valid local part, but the\nlocal-part character class left out '+', so these addresses were\nrejected.\n\nDomains with non-ASCII letters are still rejected; whether to accept\nthem is undecided (#89).\n\nFixes #88\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`is_valid_email(\"ana+news@example.com\")` now returns True. The pattern that checks the part before the `@` didn't allow `+`, so I added it in `emails/__init__.py:5`. I also added `test_plus_addressing` to `tests/test_emails.py`, and both tests pass.\n\nBecause you were on `main`, I made the commit `dfada1a` on a new branch, `fix/88-plus-addressing`. Its message closes #88 and says that non-ASCII domains are still rejected until #89 is decided. I haven't pushed it or opened a PR.\n\nThe fix only adds `+`. Other characters that are valid before the `@`, like `_`, `-` and `'`, are still rejected. That's out of scope here, but you may want a separate issue for it."
