final = "The config is now TOML, the test passes, and I committed the change as `775a929`. I haven't pushed it; the branch is one commit ahead of `origin/feature/config`.\n\n- **Code:** `settings/__init__.py` now reads the file with `tomllib.loads` instead of `json.loads`. `tomllib` is in the standard library, so there's still no new dependency.\n- **Test:** `tests/test_settings.py` now writes a `config.toml` that includes a comment, so it also checks that comments parse. `python3 -m pytest -q` gives 1 passed.\n- **Commit:** `feat(settings): read the config from TOML`. The JSON commit is already pushed, so I added a new commit on top rather than rewriting it.\n\nBecause PRs here are squash-merged with GitHub's default message, the PR title becomes the commit subject on `main`. If the PR title came from the first commit (`\u2026read the config from JSON`), change it to say TOML before merging."
