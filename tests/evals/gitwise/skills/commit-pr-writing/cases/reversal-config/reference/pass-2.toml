commits = ["feat(settings): read the config from TOML\n\n\"feat(settings): read the config from JSON\" chose JSON because it is in\nthe standard library, but JSON has no comments and ops need to annotate\nthe config. The config is now config.toml, read with tomllib, which is\nalso in the standard library (3.11+), so still no dependency is needed.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "The settings loader now reads `config.toml` with `tomllib`, and I committed it on `feature/config` as `feat(settings): read the config from TOML` (93bf93a). The test now writes a TOML file that includes a comment, and it passes.\n\n- **New commit, not an amend:** the branch was already pushed, so I added a commit instead of rewriting the JSON one. That avoids a force-push. Because the PR is squash-merged, the earlier commit message ends up in the squash message too. So the new commit message names \"feat(settings): read the config from JSON\" and says why TOML replaces it: JSON can't hold comments. `tomllib` is also in the standard library, so there's still no new dependency.\n- **Not pushed:** the branch is 1 commit ahead of `origin/feature/config`. Tell me if you want me to push it.\n- **Untracked `__pycache__/` folders:** running the tests created them, and there's no `.gitignore` in the repo. I left them uncommitted."
