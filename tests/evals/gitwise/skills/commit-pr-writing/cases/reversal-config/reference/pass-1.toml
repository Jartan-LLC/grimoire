commits = ["feat(settings): read the config from TOML\n\nThis replaces \"feat(settings): read the config from JSON\": JSON has no\ncomments, and ops need to annotate the config. Settings now load from\nconfig.toml.\n\ntomllib is in the standard library since Python 3.11, so this still\nneeds no dependency. It parses bytes, so the file is opened in binary\nmode.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I switched the config to TOML and committed it as `46a5375 feat(settings): read the config from TOML`. The test passes (`python3 -m pytest -q`: 1 passed).\n\n- **Code:** `settings/__init__.py` now reads the config with `tomllib.load`, which is in Python's standard library, so there's still no new dependency. `tomllib` only reads bytes, so the file is opened in binary mode.\n- **Test:** it now writes a `config.toml` that includes a `#` comment, so it also confirms comments parse.\n- **Commit:** because the branch is already pushed, I added a new commit instead of amending. The JSON commit stays in history, and the new message says what it replaces and why: ops need comments, which JSON doesn't allow.\n\nI haven't pushed; the branch is 1 commit ahead of `origin/feature/config`. Let me know if you want me to push it."
