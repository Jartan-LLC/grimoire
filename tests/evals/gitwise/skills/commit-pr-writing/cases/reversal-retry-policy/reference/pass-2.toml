commits = ["fix(hooks): back off 1, 2 and 4 seconds between delivery retries\n\nReplaces the immediate retries from \"feat(hooks): retry failed deliveries\nimmediately\": four back-to-back sends hammer a receiver that is already\nfailing, and a brief blip rarely clears within milliseconds anyway. Each\nof the three retries now waits 1, 2 and 4 seconds first, so a delivery\ngives up after about 7 seconds instead of at once.\n\ndeliver() takes the sleep function as a parameter, defaulting to\ntime.sleep, so tests can record the delays without waiting.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "Failed deliveries now wait 1, 2 and 4 seconds before their three retries instead of retrying at once. The tests pass (3 of 3), and I committed the change as `eb9f943` on `feature/webhooks`.\n\n- **The change:** `deliver()` in `hooks/__init__.py` takes a `sleep` parameter, which defaults to `time.sleep`. A delivery that keeps failing now stops after about 7 seconds.\n- **Tests:** two new tests pass in a stand-in for `sleep` that records the delays. One checks that a delivery that always fails waits `[1, 2, 4]`. The other checks that retrying stops once a send succeeds.\n- **Commit:** I added a new commit rather than amending, because the branch is already pushed. Its message refers to the earlier \"retry failed deliveries immediately\" commit and says why that approach was replaced.\n\nI haven't pushed, since you only asked for a commit, so the branch is one commit ahead of `origin/feature/webhooks`. Running the tests also created untracked `__pycache__/` folders, because the repo has no `.gitignore`. I left them out of the commit."
