commits = ["fix(hooks): back off 1, 2 and 4 seconds between delivery retries\n\n\"feat(hooks): retry failed deliveries immediately\" sent all four attempts\nback to back, which hammers a receiver that is already failing. Waiting\n1, 2 and 4 seconds before the three retries gives it time to recover\nwhile still getting a delivery through within about seven seconds.\n\n`sleep` is a parameter (defaulting to `time.sleep`) so tests can record\nthe delays without waiting. The delays are fixed, with no jitter.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "Failed deliveries now wait 1, 2 and 4 seconds before the three retries instead of retrying immediately. I committed this as `3fce211` on `feature/webhooks`. All 3 tests pass.\n\n- **Change:** in `hooks/__init__.py`, `deliver(send, sleep=time.sleep)` tries once, then retries three times with those waits. `sleep` defaults to `time.sleep`, so callers that don't pass it get the real waits.\n- **Tests:** two new tests pass in a fake `sleep` that just records the waits, so they finish instantly. One checks that a delivery that keeps failing is tried 4 times with waits of `[1, 2, 4]`. The other checks that retrying stops at the first success.\n- **Commit:** I added a new commit on top of the pushed one rather than rewriting it. Its message refers to \"feat(hooks): retry failed deliveries immediately\" by name and explains why that approach was replaced.\n\nI haven't pushed. Your branch is 1 commit ahead of `origin/feature/webhooks`; run `git push` when you're ready."
