commits = ["fix(hooks): back off between delivery retries\n\nRetrying a failed delivery immediately hammered receivers that were\nalready struggling. Wait 1, 2 and 4 seconds before the three retries\nso a receiver has time to recover.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "Failed deliveries now wait 1, 2 and 4 seconds before the three retries instead of retrying straight away. Both tests pass. The change is committed on `feature/webhooks` as `b2a283f fix(hooks): back off between delivery retries`. I haven't pushed it, so the branch is one commit ahead of `origin`.\n\n- **Code** (`hooks/__init__.py`): `deliver(send, sleep=time.sleep)` makes one attempt, then before each retry it calls `sleep` with the next delay from `RETRY_DELAYS = (1, 2, 4)`. A delivery that fails every time now takes about 7 seconds before giving up.\n- **Test** (`tests/test_hooks.py`): a new test passes `delays.append` as `sleep` and checks that the waits were `[1, 2, 4]`, so the suite doesn't actually sleep.\n\n**Before you merge:** PRs here are squash-merged with GitHub's default message, which pulls in each commit's message. The earlier pushed commit says \"Immediate retries get a webhook through a brief blip fastest\", and that line would end up on `main` next to this fix, which contradicts it. When you squash-merge, edit that line out of the message. I left the earlier commit alone because it's already pushed.\n\nThe project's commit-writing skill (`gitwise:commit-pr-writing`) couldn't be loaded, so I wrote the commit message to the Conventional Commits format in `AGENTS.md`."
