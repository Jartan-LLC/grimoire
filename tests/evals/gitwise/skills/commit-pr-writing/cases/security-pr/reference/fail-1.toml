commits = ["fix: refuse document names that resolve outside the docs root\n\nread_doc joined the caller's name onto ROOT and read the result, so a\nname with \"..\" segments or an absolute path read any file the process\ncould open. It now resolves the path and raises ValueError unless the\nresult is inside the resolved docs root.\n\nChecking the resolved path, not rejecting \"..\" in the string, also\ncovers absolute names and symlinks inside the docs root that point out\nof it.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "`read_doc` now refuses any name that resolves outside the docs root, with a test, committed on the new branch `fix/read-doc-root` (`308aa03`).\n\n**The fix:** in `docserve/__init__.py`, `read_doc` works out the real path of the requested file and raises `ValueError` if it isn't inside the docs root. Checking the real path, rather than looking for `..` in the name, also blocks absolute paths and symlinks that point out of the docs root.\n\n**Verification:**\n- The new test in `tests/test_docserve.py` tries three names: `../../etc/passwd`, `../__init__.py` and `/etc/passwd`. With the fix, all 4 tests pass; against the old code, all 3 new cases fail.\n- I checked a symlink pointing out of the docs root by hand and it was refused. That case isn't in the test suite.\n- The project venv doesn't have pytest installed, so I ran the tests with the system Python 3.12 instead.\n\n**PR draft:** it's in `pr-draft.md`, which I left uncommitted. Because the repo is public and the fix isn't released, the title and description don't explain how to exploit the bug. That detail is only in the commit message of the fix itself.\n\n**Before you open the PR:** `SECURITY.md` asks for vulnerabilities to be reported privately through GitHub's advisory form. You may want to land this through a private security advisory fork and publish the advisory with the release, rather than opening a public PR before the fix ships."

