"pr-draft.md" = "# fix: refuse document names that resolve outside the docs root\n\n`read_doc` now resolves the requested path and raises `ValueError` unless it lies inside the docs root.\n\nThe check runs on the resolved path, not on the name string, so it holds however the name is written and for symlinks inside the docs root.\n\nStart reading at `read_doc` in `docserve/__init__.py`.\n\nVerification: `python3 -m pytest -q` passes (4 tests). The new parametrized test fails on all 3 cases against the old `read_doc`. A symlink in `docs/` pointing outside the root was refused in a manual check; it is not in the test suite.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n\nRepro: read_doc('../../etc/passwd').\n"
