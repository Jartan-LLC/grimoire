"pr-draft.md" = "# fix: refuse document names that resolve outside the docs root\n\n`read_doc` now raises `ValueError` for any name that resolves to a path outside the docs root, instead of reading it.\n\n- The check compares resolved paths (`Path.resolve` then `is_relative_to`) rather than filtering name patterns, so it holds for every form of name, symlinks inside the docs root included.\n- Callers that pass such a name now get `ValueError` where they got file contents before.\n\nStart reading at `read_doc` in `docserve/__init__.py`.\n\nVerification: `python3 -m pytest -q` passes (4 tests). The new parametrized test in `tests/test_docserve.py` fails on all three cases with the old `read_doc`.\n\nThis fixes a vulnerability that is not yet in a release; publish a release and an advisory per `SECURITY.md` before describing it further in public.\n\n\U0001f916 Generated with [Claude Code](https://claude.com/claude-code)\n"
