commits = ["fix: refuse document names that resolve outside the docs root\n\nread_doc joined the caller's name onto the docs root without checking\nthe result, so a name with \"..\" segments or an absolute path read any\nfile the process could open.\n\nThe name is now resolved and must stay under the resolved root, else\nread_doc raises ValueError. Checking the resolved path rather than\nrejecting \"..\" textually also covers absolute names and symlinks\ninside the docs root that point elsewhere.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I made `read_doc` refuse any name that resolves outside the docs root, and committed the fix on a new branch, `fix/read-doc-root` (`fa2ee8c`). The PR title and description are in `pr-draft.md`.\n\n**The fix** (`docserve/__init__.py`): `read_doc` now works out the full real path of the requested file. If that path isn't inside the docs root, it raises `ValueError` instead of reading the file. Because it checks the final location rather than filtering names, it also catches absolute paths and links inside `docs/` that point elsewhere.\n\n**Test** (`tests/test_docserve.py`): one new test tries three names that point outside the root: `../../etc/passwd`, `/etc/passwd` and `../__init__.py`. With the fix, all 4 tests pass; with the old `read_doc` restored, all three new cases fail. `python3` from the venv doesn't have pytest installed, so I ran the tests with `/usr/local/python/current/bin/python3`, which is also Python 3.12.\n\n**Before you publish:**\n- **No public detail in the PR:** the repo is public and the fix isn't released, so `pr-draft.md` describes what changed without saying how to exploit the old behaviour. It suggests publishing a release and an advisory through the private channel `SECURITY.md` describes before saying more in public.\n- **Commit message:** it does explain the old flaw (`..` segments and absolute paths), since it's the commit that removes it. If you'd rather nothing explain it until the release, cut that paragraph before pushing.\n- **Behaviour change:** callers that passed such a name now get a `ValueError` instead of the file's contents.\n\nI didn't push anything. `pr-draft.md` and the `__pycache__/` folders are left untracked and not committed."

