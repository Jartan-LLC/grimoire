commits = ["feat(prices): persist the price cache to .cache/prices.json\n\n\"feat(prices): keep the price cache in memory\" kept prices in a\nmodule-level dict, which is lost on every restart, so each new process\nfetched every price again. The cache is now a JSON file at\n.cache/prices.json, relative to the working directory, and the directory\nis created on the first write.\n\nThe file is read on every lookup and rewritten on every miss, with no\nlocking, so two processes writing at once can lose an entry. That's\nacceptable for a cache, since a lost entry only means one more fetch.\n\nThe test points CACHE_PATH at a temporary directory so that runs don't\nshare cached prices. .cache/ is ignored by git.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "The price cache is now stored in `.cache/prices.json`, so prices survive a restart. I committed it as `d4de4fd`-amended, `feat(prices): persist the price cache to .cache/prices.json`, on `feature/price-cache`. I haven't pushed it; the branch is one commit ahead of `origin`.\n\n- **Code (`prices/__init__.py`):** each lookup reads the file. When a price is missing, it fetches it, creates `.cache/` if needed, and writes the file back. The path is relative to the directory the program is started from.\n- **Test:** it now points the cache at a temporary directory. Without that, the second run would find the price already cached on disk and fail.\n- **`.gitignore`:** new. It ignores `.cache/`, `__pycache__/` and `.pytest_cache/`. My first commit accidentally included bytecode files, so I amended it before pushing to remove them.\n\n**Checks:** the test passes and still passed on a second run. I also ran two separate Python processes: the first fetched and saved a price, and the second returned it from the file without calling `fetch`. The `python3` on PATH has no pytest, so I ran the tests with `/usr/local/python/current/bin/python3`, which is Python 3.12.\n\n**Concurrency:** two processes writing a new price at the same moment can overwrite each other's entry, because there is no file locking. A lost entry just means that price gets fetched again, so I left it. The commit message says this."
