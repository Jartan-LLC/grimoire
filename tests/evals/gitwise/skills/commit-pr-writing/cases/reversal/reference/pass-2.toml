commits = ["feat(prices): persist the price cache to .cache/prices.json\n\n\"feat(prices): keep the price cache in memory\" kept prices in a module-level\ndict, which is lost on every restart, so each new process refetched every\nprice. The cache now lives in a JSON file at .cache/prices.json, relative to\nthe working directory; the directory is created on the first write.\n\nThe file is reread on each lookup rather than loaded once at import, so\nlookups from other processes sharing the file are seen. Writes go to a\ntemporary file that is then renamed over the cache, so a crash mid-write\ncannot leave truncated JSON that would make every later lookup fail.\n\nThe test now runs in a temporary working directory, so a cache left by an\nearlier run cannot satisfy the lookup without a fetch.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "The price cache is now stored in `.cache/prices.json`, so it survives restarts. I committed the change as `90452f6 feat(prices): persist the price cache to .cache/prices.json`. It's a new commit on top, not an amend, because the branch is already pushed. I haven't pushed it.\n\n- **How the cache works:** `prices/__init__.py` reads the JSON file on every lookup. When it fetches a new price, it creates `.cache/` if needed and writes the file. It writes a temporary file first and then renames it over the cache, so a crash mid-write can't leave a broken file that makes every later lookup fail.\n- **The path is relative:** `.cache/prices.json` is resolved against the directory the program is started from, not the package's location. If you'd rather tie it to the package or to a config setting, that's a one-line change.\n- **Test:** it now runs in a temporary directory. Otherwise a cache file left by an earlier run would answer the lookup without calling `fetch`, and `calls == [\"a\"]` would fail on the second run.\n- **`.gitignore`:** I added one listing `.cache/` and `__pycache__/` so the cache file and Python's compiled files stay out of git.\n\n**Verification:** the test passes, including two runs in a row. I also ran two separate Python processes in an empty directory: the second one got the price the first had stored, without calling its fetch function (which would have raised an error if called).\n\nThe project's `python3` is a venv without pytest, so `python3 -m pytest -q` from AGENTS.md fails with \"No module named pytest\". I ran the tests with the system Python at `/usr/local/python/current/bin/python3` instead."
