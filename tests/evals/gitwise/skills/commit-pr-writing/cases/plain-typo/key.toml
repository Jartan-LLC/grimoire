split = "dev"
kind = "regression"

[[plant]]
id = "misspelled-receive"
verify = '''python3 -c "
import sys
sys.exit('recieve' in open('README.md').read())
"'''

[[check]]
metric = "kept"
artifact = "commits"
absent = '''(?s)\A[^\n]+\n\n.+\n\n.+\n\n(?!Co-Authored-By).+'''

[[check]]
metric = "format"
artifact = "commits"
present = '''\A(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)(\([^)]+\))?!?: \S'''

[[check]]
metric = "delivered"
artifact = "delivery"
skill = "gitwise:commit-pr-writing"
write = "commit"
state = "in-context"

[[baseline]]
model = "claude-opus-5-5"
arm = "old"
failures = 0
runs = 3
runner = 2

