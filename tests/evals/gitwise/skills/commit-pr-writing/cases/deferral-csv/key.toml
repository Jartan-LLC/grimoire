split = "screen"
kind = "regression"
hints = ["mention #77", "follow-up"]

[[fact]]
text = "#77"
where = "prompt"

[[check]]
metric = "kept"
artifact = "commits"
present = '''#77\b'''

[[check]]
metric = "format"
artifact = "commits"
present = '''\A(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)(\([^)]+\))?!?: \S'''

[[check]]
metric = "delivered"
artifact = "delivery"
skill = "gitwise:commit-pr-writing"
write = "commit"
state = "in-context"

