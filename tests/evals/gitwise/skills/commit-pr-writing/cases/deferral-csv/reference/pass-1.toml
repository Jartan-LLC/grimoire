commits = ["feat: add --json output to the report\n\nScripts that consume the report need it in a form they can parse\nwithout depending on the table's column widths. Each row becomes an\nobject with \"name\" and \"units\" keys.\n\nCSV output is deliberately left out: its column names aren't settled\nyet, which is what #77 is for.\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"]
final = "I added the `--json` flag and a test, and committed them on `main` as `22f0f56 feat: add --json output to the report`. I couldn't run `python3 -m pytest -q`, because neither pytest nor pip is installed in this venv.\n\n- **`report.py`:** with `--json`, the report prints as a JSON array with one object per row, such as `[{\"name\": \"north\", \"units\": 12}, {\"name\": \"south\", \"units\": 7}]`. Without the flag it prints the same table as before.\n- **`tests/test_report.py`:** the new `test_json` checks that the output reads back as exactly those two rows.\n- **Testing:** instead of pytest, I imported the test module and called both tests directly. Both passed. I also ran the report with and without `--json` and the output looked right.\n\nThere's no CSV output. The commit message says it was left out on purpose and points to #77.\n\nThe key names `name` and `units` are my choice. If #77 settles different column names, you may want the JSON keys to match.\n\nA hook asked me to load the `gitwise:github-conventions` skill, but it only showed up after I had committed. The commit follows the Conventional Commits format that AGENTS.md asks for."
