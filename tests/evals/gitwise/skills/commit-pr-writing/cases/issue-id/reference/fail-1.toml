final = "I added `sub(a, b)` and a test for it, and committed both as `0c80b14 feat: add sub(a, b)` on a new branch, `feature/issue-42`. The commit message says `Closes #42`. Nothing is pushed and there's no PR yet.\n\n- **Code:** `sub` in `calc/__init__.py` returns `a - b`, written the same way as `add`. The new `test_sub` in `tests/test_calc.py` checks that `sub(5, 3) == 2`.\n- **Tests:** both tests pass, but not with the command in AGENTS.md. `python3 -m pytest -q` fails because the project venv's `python3` doesn't have pytest installed. I ran the tests with `/usr/local/python/current/bin/python3 -m pytest -q` instead, which is also Python 3.12. To make the documented command work, install pytest into the venv."
