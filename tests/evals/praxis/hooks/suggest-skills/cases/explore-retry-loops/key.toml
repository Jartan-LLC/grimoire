split = "confirm"
kind = "regression"
hints = ["skill", "pythonica"]

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-resilience"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-patterns"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "spawned"
artifact = "brief:Explore"
present = '''\S'''

[[check]]
metric = "answer"
artifact = "final"
present = '''pull[.]py'''

[[check]]
metric = "answer"
artifact = "final"
present = '''push[.]py'''

[[fact]]
text = "tries == 5"
where = "fixture:syncer/push.py"

[[baseline]]
model = "claude-opus-5-5"
arm = "old"
failures = 0
runs = 3
runner = 2

[[baseline]]
model = "claude-opus-5-5"
arm = "none"
failures = 0
runs = 3
runner = 2
