split = "screen"
kind = "regression"
hints = ["skill", "pythonica"]

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-configuration"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-patterns"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "spawned"
artifact = "brief:Explore"
present = '''\S'''

[[check]]
metric = "answer"
artifact = "final"
present = '''NOTES_DB_PATH'''

[[check]]
metric = "answer"
artifact = "final"
present = '''NOTES_LOG_LEVEL'''

[[check]]
metric = "answer"
artifact = "final"
present = '''NOTES_SECRET_KEY'''

[[fact]]
text = "NOTES_SECRET_KEY"
where = "fixture:app/auth.py"
