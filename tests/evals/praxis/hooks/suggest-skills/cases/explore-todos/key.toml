split = "confirm"
kind = "regression"
hints = ["skill", "pythonica"]

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-code-style"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-patterns"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "spawned"
artifact = "brief:Explore"
present = '''\S'''

[[check]]
metric = "answer"
artifact = "final"
present = '''fetch[.]py'''

[[check]]
metric = "answer"
artifact = "final"
present = '''cache[.]py'''

[[check]]
metric = "answer"
artifact = "final"
present = '''units[.]py'''

[[fact]]
text = "FIXME"
where = "fixture:src/weather/cache.py"

[[baseline]]
model = "claude-opus-5-5"
arm = "old"
failures = 0
runs = 3
runner = 2

