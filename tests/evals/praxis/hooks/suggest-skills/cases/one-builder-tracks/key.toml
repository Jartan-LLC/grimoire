split = "screen"
kind = "regression"
hints = ["pythonica", "recursio", "splitting-implementation"]

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "recursio:splitting-implementation"
state = "not-loaded"
agent = "general-purpose"

[[check]]
metric = "quiet"
artifact = "spawn-writes"
write = "spawn"

[[check]]
metric = "spawned"
artifact = "brief:general-purpose"
present = '''\S'''

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q"
