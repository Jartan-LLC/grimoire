split = "screen"
kind = "regression"
hints = ["skill", "pythonica"]

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-testing"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-patterns"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "spawned"
artifact = "brief:Explore"
present = '''\S'''

[[check]]
metric = "answer"
artifact = "final"
present = '''test_full_refund'''

[[check]]
metric = "answer"
artifact = "final"
present = '''test_partial_refunds_add_up'''

[[check]]
metric = "answer"
artifact = "final"
present = '''test_over_refund_is_refused'''

[[fact]]
text = "test_over_refund_is_refused"
where = "fixture:tests/test_orders.py"
