split = "screen"
kind = "regression"
hints = ["skill", "pythonica"]

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-patterns"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-code-style"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-project-structure"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "pythonica:python-anti-patterns"
state = "not-loaded"
agent = "Explore"

[[check]]
metric = "spawned"
artifact = "brief:Explore"
present = '''\S'''

[[check]]
metric = "answer"
artifact = "final"
present = '''invoice[.]py'''

[[check]]
metric = "answer"
artifact = "final"
present = '''refund[.]py'''

[[check]]
metric = "answer"
artifact = "final"
present = '''import_csv[.]py'''

[[fact]]
text = "parse_amount(line)"
where = "fixture:billing/invoice.py"
