# Whether praxis's skill imperatives reach the agent that needs them. The subagent cases (#59,
# #56): a subagent handed Python to write or review loads the pythonica skill its task is
# squarely about; the prompt has the main thread start one subagent: a general-purpose one to
# write code, a praxis reviewer to review a branch, or Explore to search. The turn-change cases
# (#181): a turn that starts on work other than code, such as notes, a plan, a README or review
# replies, and moves on to Python loads the pythonica skill the Python work is about, which the
# reminder on an agent's first file of a new type exists for. Whether an agent the imperatives
# should leave alone is burdened by them is reported. Every case runs with every plugin,
# pythonica included, as users run them.
#
# `recall`: the agent the case is about, the subagent or else the main thread, loaded the
# case's skill (retry -> python-resilience, concurrency -> async-python-patterns, settings from
# the environment -> python-configuration, a test suite or a test review -> python-testing,
# cleanup -> python-resource-management, annotations -> python-type-safety, per-row errors ->
# python-error-handling, timing logs -> python-observability, packaging -> python-packaging,
# moving to uv -> uv-package-manager, a general review -> python-anti-patterns, an async review
# -> async-python-patterns, a slow loop -> python-performance-optimization). A delivery check
# with an `agent` counts the skill's text arriving inside that subagent, which Claude Code sends
# only once its Skill call returned, or a read of the skill's files there; a failed call never
# counts.
# Old reaches a subagent only through the brief, or through the compact re-arm if the subagent
# auto-compacts, and reaches the main thread only at the prompt, so recall measures the hooks.
# `quiet`, reported only: Explore searches in Python repositories, and main-thread tasks that
# read Python but change none of it (documenting a script's options, explaining a function),
# load none of the pythonica skills their words or files touch. "Not burdened" is no such load
# in the search subagent or the main thread (a screen reports tokens and cost per arm, so the
# cost of a needless load shows there). It gates nothing and cannot show harm either: a held-out
# split has too few `quiet` units to reach p < 0.05, so it could neither pass as a guard nor come
# out WORSE as a reported metric.
# Whether a subagent splits its work is recursio's to test, not this suite's.
#
# What the graders cannot see: a delivery check with an `agent` reads every spawn of that agent
# type as one, so a second general-purpose spawn's load counts for the first. `spawned` shows a
# `quiet` pass that came only because no subagent ran. tests/evals/README.md says how the suite
# is run.
target = "praxis:hooks/scripts/suggest-skills.js"
# The reviewer cases measure whether these reviewers load skills, which their Skill tool allows;
# no case dispatches doc-reviewer, frontend-reviewer or structure-reviewer.
covers = [
  "plugins/praxis/hooks/hooks.json",
  "plugins/praxis/hooks/scripts/suggest-skills.js",
  "plugins/praxis/hooks/scripts/suggest-skills-per-file-type.js",
  "plugins/praxis/hooks/scripts/lib/skill-context.js",
  "plugins/praxis/agents/general-reviewer.md",
  "plugins/praxis/agents/test-reviewer.md",
  "plugins/praxis/agents/backend-reviewer.md",
]
models = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
# Haiku is a watch model, as in recursio's splitting-implementation suite, where it never loaded
# the skill in the smoke runs.
watch = ["claude-haiku-5-5"]
# SubagentStart's additionalContext reaches the subagent on this version (the 2.1.319 CLI's
# hook help text and the Claude Code hooks docs).
claude_code = "2.1.319"
# One subagent writes a module and its tests, a reviewer reads a small branch, or the main
# thread does a docs or planning step and then a small code change.
budget_usd = 4.0

[[metric]]
id = "recall"
direction = "higher"
# Trigger cases: the agent the case is about, the subagent or else the main thread, loaded the
# pythonica skill its task is about.

[[metric]]
id = "quiet"
direction = "higher"
# Reported, Explore and read-only main-thread cases: no pythonica skill the task's words or files
# touch was loaded by Explore or the main thread.

[[metric]]
id = "works"
direction = "higher"
# Reported: the tests pass in the final tree, the subagent's own included.

[[metric]]
id = "answer"
direction = "higher"
# Reported, Explore and explanation cases: the final reply names what the task had to find.

[[metric]]
id = "done"
direction = "higher"
# Reported, documentation cases: the README documents everything the task asked for.

[[metric]]
id = "spawned"
direction = "higher"
# Reported, Explore cases: the main thread started the subagent the prompt asked for, so a
# `quiet` pass is not only for want of a subagent.

[[metric]]
id = "any-pythonica"
direction = "higher"
# Reported, general-review cases: the reviewer loaded any pythonica skill. A general review fits
# several of them, and `recall` accepts python-anti-patterns alone.

[pass_rule]
primary = "recall"
rule = "better"
min_effect = 0.5
min_samples = 3
