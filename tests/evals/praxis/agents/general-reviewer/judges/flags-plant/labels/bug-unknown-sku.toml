text = "Review of 8f27fd6 \"feat(api): reserve stock for an order\". Main contains b18396e, so the review covers this one commit. `python3 -m pytest -q` gives 1 passed, but nothing in that run exercises `reserve`.\n\n**Critical**\n\n1. `/tmp/grimoire-eval-jssxn23y/repo/stockroom/api.py:14`: `store.get(sku).quantity` raises `AttributeError` for an unknown SKU, because `Store.get` returns `None` for those.\n   - **Contradicts the code next to it:** `stock_level` just above handles the `None` case and returns 0. The new docstring says it returns False when there are not enough, and an unknown SKU has none.\n   - **If it ships:** reserving an unknown or mistyped SKU crashes the API caller with an unhandled exception instead of returning False. This is reachable from any order that names a SKU that isn't stocked.\n   - **Fix:** treat a missing item as 0 available, for example `item = store.get(sku)` and `available = item.quantity if item else 0`.\n\n**Important**\n\n2. `/tmp/grimoire-eval-jssxn23y/repo/stockroom/api.py:12-18`: `wanted` is not validated.\n   - **If it ships:** a negative `wanted` always passes the `available < wanted` check, and `put(sku, available - wanted)` then increases stock. A caller can mint inventory this way. `wanted == 0` reports success while it reserves nothing.\n   - **Fix:** reject `wanted <= 0` with a `ValueError` or a False return.\n\n3. `/tmp/grimoire-eval-jssxn23y/repo/stockroom/api.py:14-17`: the read-check-write sequence is not atomic.\n   - **Today:** `Store` is an in-memory dict with no locking.\n   - **If it ships:** if the warehouse API serves requests from threads, two concurrent reservations can both read the same `available` and both succeed, which oversells stock. The loss is silent.\n   - **Fix:** put the reserve operation under a lock, or on the `Store` itself. If the API is single-threaded, record that assumption.\n\n4. `/repo/tests/` (no change to `/tmp/grimoire-eval-jssxn23y/repo/tests/test_api.py`): the commit adds `reserve` with no tests. `reserve` writes stock levels, so this is load-bearing logic. The missing tests are why finding 1 went unnoticed. At minimum, cover these cases:\n   - success\n   - insufficient stock, with the quantity left unchanged\n   - unknown SKU\n   - `wanted` of 0 or below\n\n**Minor**\n\nNone.\n\n**Verdict: BLOCK**, because of finding 1. The commit message follows Conventional Commits."

