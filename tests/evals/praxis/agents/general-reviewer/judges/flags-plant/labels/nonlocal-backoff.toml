hat `retry.py` owns\nFile: fetchkit/client.py:19\nIssue: \"sleeps 0.5 s and then 1 s ... three attempts, 1.5 s\" repeats `MAX_ATTEMPTS` and `BASE_DELAY_S` from `fetchkit/retry.py`. It is a nonlocal derived-value echo. It is true today, but it goes stale silently if those constants change. It also doesn't say why it matters here, since the 10 s default is far above 1.5 s.\nFix: Delete it. If the point is that backoff time counts against the budget, say that in one line without the numbers.\nStatus: confirmed\n\n**Summary**\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 1 |\n\n**Verdict**: WARNING"

