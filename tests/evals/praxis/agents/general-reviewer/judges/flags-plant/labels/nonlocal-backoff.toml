text = "Review of `feature/timeout-budget` against `main`\n\n**Scope.** 3cf2943 is already on `main`, so only acf935f is under review. It changes `fetchkit/client.py` only.\n\n**Tests.** `python3 -m pytest -q` gives 1 passed. That test is the existing `tests/test_retry.py` case. Nothing covers the new code.\n\n**Verdict: BLOCK.** The first finding is a wrong-behavior bug on the main path, so it counts as Critical.\n\n**Findings**\n\n1. **Critical, confirmed.** `fetchkit/client.py:20-22` (the `get` body). The commit says a fetch \"must not outlast\" the 10-second schedule, but the budget is only checked after `with_retries` returns.\n   - A slow or hung `transport.send` is never interrupted. It can run 30 seconds or more, and the caller only gets `OverBudget` once the work has already finished.\n   - The sync job still overruns its schedule, which is the problem the commit sets out to fix.\n   - The check also throws away a response that may have been valid. Retries run to the end even after the budget is already spent.\n   - A real fix needs a deadline passed down to the transport as a timeout. It also needs `with_retries` to stop retrying, or to stop sleeping, once the remaining budget is gone.\n   - If a post-hoc check is all you want, the name, docstring and commit title should say so. \"Fail a GET that runs past its budget\" overstates what the code does.\n\n2. **Important (debt), confirmed.** `fetchkit/client.py:19`. The comment says \"with_retries sleeps 0.5 s and then 1 s between its three attempts, so retrying alone costs 1.5 s.\"\n   - It copies `MAX_ATTEMPTS` and `BASE_DELAY_S` from `retry.py`. That makes it a nonlocal, derived-value echo.\n   - It goes stale as soon as either constant changes.\n   - It also doesn't explain the code beneath it, because nothing in `get` uses the 1.5 s figure.\n   - Delete it. If the point is that the backoff eats the budget, that belongs in the commit message, or in code that actually uses the figure.\n\n3. **Important (debt), confirmed.** `tests/`. Nothing tests `OverBudget` or the `budget_s` parameter. It's a new public exception and a new parameter, so it needs tests.\n   - Cases to cover: over budget raises, within budget returns, and a custom `budget_s` is honored.\n   - Testing this is awkward because `time.monotonic` and `with_retries`'s `sleep` can't be injected through `get`. Making the clock injectable would also be the natural start of a real fix for finding 1.\n\n4. **Minor.** `fetchkit/client.py:9`. `BUDGET_S = 10.0` encodes the schedule from the commit body (\"10-second schedule\") with no link to where that schedule lives. A budget equal to the full period leaves no headroom, so a fetch that lands at 9.9 s still collides with the next run. A short comment, or a smaller default, would help.\n\n5. **Minor.** `fetchkit/client.py:12`, `raise OverBudget(url)`. The exception carries only the URL, with no elapsed time or budget, so logs can't show how far over it ran. `OverBudget` also reads as a noun and doesn't follow the usual `...Error` or `...Timeout` convention. `BudgetExceededError` would be clearer.\n\n6. **Minor, commit message.** The subject `feat(client): fail a GET that runs past its time budget` follows Conventional Commits and is fine. The body states the motivation but not the behavior limits from finding 1.\n   - The new exception means `get` now raises where it didn't before, which callers may need to handle. That is worth a line in the body.\n   - There are no attribution lines on the commit. If this was authored with an assistant, the project's reminder asks for the `Co-Authored-By` trailer.\n   - Under squash-merge, the PR title and description will become the final message, so they should be accurate on the \"post-hoc check\" point too.\n\n**File:** `/tmp/grimoire-eval-x_9d15xq/repo/fetchkit/client.py`"
