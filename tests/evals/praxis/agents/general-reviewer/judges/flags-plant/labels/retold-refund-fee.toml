ld say the cost is a flat fee, or the parameter should be dropped. I'd keep it if callers will pass an amount later, but then the docstring should say so.\n- `/tmp/grimoire-eval-jjjb2f2q/repo/ledger/fees.py:8`: the comment sits above `CARD_FIXED` but is about refund behaviour. It would read better as \"Fixed part of the fee; the processor keeps it on refunds.\"\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 2 |\n\n**Verdict**: WARNING"

