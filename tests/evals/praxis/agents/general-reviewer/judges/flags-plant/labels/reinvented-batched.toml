text = "**Verdict: WARNING.** There are no Critical findings and two Important ones.\n\n**Test run:** `python3 -m pytest -q` gives `1 passed`. That one test is in `tests/test_fees.py`. Nothing in the suite touches `ledger/batches.py`.\n\nI read `ledger/batches.py` (the only file in the diff, 22 new lines). The chunking logic is correct. Full batches are emitted at exactly 50, the remainder is emitted if non-empty, and empty input gives `[]`.\n\n## Important\n\n1. **No tests for the new module (debt).** `ledger/batches.py:1-22` has no test file. The boundary cases that off-by-one bugs hide in are all unchecked:\n   - 0 ids, 49, 50, 51 and 100 ids.\n   - A generator input, since the type is `Iterable`.\n\n   If someone later changes `==` to `>`, or moves the `batch = []` reset, the suite stays green. That would send oversized batches to the mail provider or drop the trailing partial batch. AGENTS.md says to run the tests, and this logic is load-bearing for the provider limit.\n\n2. **Hand-rolled chunking duplicates the stdlib (`ledger/batches.py:8-18`).** The project targets Python 3.12, and `itertools.batched(items, size)` has been available since 3.12. It yields tuples and handles the short last chunk the same way. `_chunks` re-implements it and carries its own maintenance and test burden. `batches()` could be `list(itertools.batched(invoice_ids, BATCH_SIZE))`. This is Important rather than Minor only because it is real code with no tests. If `pyproject.toml` allows Python older than 3.12, the justification is different, and I did not check that.\n\n## Minor\n\n3. **The commit message overstates the change (commit 21f842e).** `feat(invoices): send invoices in batches of 50` only adds a splitter. Nothing in the diff sends anything, and nothing calls `batches()`. The PR will be squash-merged with the default message, so the history will claim sending behavior that doesn't exist. A message like `feat(invoices): add batching helper for the mail provider limit` would be more accurate. Alternatively, the sending code may be planned for a later commit.\n\n4. **`BATCH_SIZE = 50` has no source (`ledger/batches.py:5`).** The module docstring says \"the batches the mail provider accepts\", but it doesn't name the provider limit or cite where it comes from. This is a suspicion rather than a verified defect: if 50 comes from a provider doc, a one-line reference would stop the number being changed blindly. The `batches` docstring (\"The invoice ids in batches of BATCH_SIZE\") only restates the code.\n\n5. **`_chunks` is private and its only caller passes a fixed size.** The `size` parameter has no second use. It would go away if `itertools.batched` replaced it (finding 2)."

