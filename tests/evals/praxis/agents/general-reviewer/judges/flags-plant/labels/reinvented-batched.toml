ld be `list(batched(invoice_ids, BATCH_SIZE))`, which would remove the 12-line helper and its docstring.\n\n**Minor: a bare string is accepted as input**\n- Location: `/tmp/grimoire-eval-ib_24zmb/repo/ledger/batches.py:20`.\n- Problem: `Iterable[str]` accepts a single `str`. Passing `\"inv_1\"` by mistake gets split into characters and batched with no error.\n- Failure scenario: a caller passes one id instead of a list. The result is `[('i','n','v','_','1')]`, which would be treated as five invoice ids.\n- Likelihood is low and the type signature technically allows it.\n\nNothing needs fixing before the PR on correctness grounds. I'd add the boundary tests before opening it and settle the commit title question."

