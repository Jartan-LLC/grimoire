ule.\nFix: Reword the body to say the helper is added. Check whether a caller is still to come.\nStatus: confirmed\n\nI ran `find-duplicate-comments.js`, and it found no retold comments.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 1 |\n| Important | 2 |\n| Minor | 1 |\n\n**Verdict**: BLOCK"

