e what ships.\n\nThe duplicate-comment check ran and found nothing. The diff adds no real comments.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 1 |\n| Important | 2 |\n| Minor | 1 |\n\n**Verdict**: BLOCK. Fix the slice before opening the PR."

