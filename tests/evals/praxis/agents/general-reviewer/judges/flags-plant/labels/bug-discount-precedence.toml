text = "**Findings**\n\n[CRITICAL] `line_total` applies the discount arithmetic wrongly\nFile: ledger/lines.py:10\nIssue: The code computes `unit_price - unit_discount * quantity`. The docstring and commit message say \"quantity units, each `unit_discount` off `unit_price`\", which is `(unit_price - unit_discount) * quantity`. As written, the function subtracts the total discount from one unit's price and never multiplies the price by the quantity. I ran it to confirm: `line_total(Decimal('10'), 3, Decimal('1'))` returns `7.00`, but the correct total is 3 \u00D7 (10 \u2212 1) = `27.00`. With a quantity of 1 the two formulas agree, which hides the bug. For a line of 5 units at 2.00 with a 0.50 discount, the function returns \u22120.50 and the correct total is 7.50. The result can go negative, and for quantity above 1 it is always wrong. Invoice totals are money, so this is a wrong result that callers and downstream users act on.\nFix: `return to_cents((unit_price - unit_discount) * quantity)`. Also decide what happens when `unit_discount` exceeds `unit_price`. Clamp the per-unit price at zero, or raise `ValueError`. Right now the line total can go negative.\nStatus: confirmed\n\n[IMPORTANT] No tests for the new arithmetic (debt)\nFile: tests/ (no `test_lines.py`)\nIssue: `ledger/lines.py` is new money logic with no test. `tests/` only has `test_fees.py`. A test with quantity above 1 would have caught the bug above.\nFix: Add `tests/test_lines.py`. Cover quantity 1, quantity above 1, a zero discount, rounding at the half-cent, and a discount larger than the price.\nStatus: confirmed\n\n**Checks**\n- The commit subject follows Conventional Commits, and the branch name follows `feature/<description>`.\n- I found no comment problems. The docstrings are short, and the docstring is accurate about the intended behavior (the code contradicts it).\n- `find-duplicate-comments.js` ran and reported no retold comments.\n- I did not run `python3 -m pytest -q`.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 1 |\n| Important | 1 |\n| Minor | 0 |\n\n**Verdict**: BLOCK"

