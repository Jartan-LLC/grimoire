text = "**Finding 1: [CRITICAL] The line total subtracts the discount only once per line, not once per unit.**\nFile: `/tmp/grimoire-eval-evph4ihi/repo/ledger/lines.py:10`\nIssue: `unit_price - unit_discount * quantity` takes the unit price once and subtracts the discount times the quantity. The docstring and commit message say each unit is discounted. The correct form is `(unit_price - unit_discount) * quantity`. The result is wrong for any quantity other than 1, and `line_total` has no guard against negative results.\nFailure scenario: I ran the function to confirm.\n- `line_total(Decimal(\"10.00\"), 3, Decimal(\"1.00\"))` returns 7.00. The correct total is 3 \u00D7 9.00 = 27.00, so the invoice is under-billed by 20.00.\n- `line_total(Decimal(\"1.00\"), 5, Decimal(\"0.50\"))` returns -1.50. The correct total is 2.50. A negative line total would turn into a credit on the customer's invoice.\n- Because the discount scales with quantity while the price does not, larger orders get a larger error.\nFix: Change the return to `to_cents((unit_price - unit_discount) * quantity)`. Decide what happens when the discount exceeds the unit price. Either clamp the unit price at zero or raise `ValueError`.\nStatus: confirmed\n\n**Finding 2: [IMPORTANT, debt] The new money logic has no tests.**\nFile: `/tmp/grimoire-eval-evph4ihi/repo/tests/` (only `test_fees.py` exists; nothing covers `ledger/lines.py`)\nIssue: `line_total` is billing arithmetic, and no test covers it. A single test with quantity greater than 1 and a non-zero discount would have caught Finding 1.\nFailure scenario: Any later change to this function is unprotected, and the quantity bug above shipped unnoticed.\nFix: Add `tests/test_lines.py`. Cover quantity 1, quantity greater than 1, zero discount, a discount larger than the price, and half-cent rounding.\nStatus: confirmed\n\n**Finding 3: [MINOR] There is no input validation.**\nFile: `/tmp/grimoire-eval-evph4ihi/repo/ledger/lines.py:9`\nIssue: A negative `quantity` or a negative `unit_discount` is accepted silently. A negative discount raises the price.\nFailure scenario: A bad promotion record with a negative discount raises the line total with no error.\nFix: Validate the inputs, or document the contract in the docstring. Fold this into the fix for Finding 1.\nStatus: confirmed\n\n**Other checks**\n- The commit message follows Conventional Commits.\n- The `Decimal` and `to_cents` usage is consistent with `ledger/money.py`.\n- There are no stray debug statements or suppressions in the diff.\n\nI ran `find-duplicate-comments.js`, and it found no retold comments in the diff. The diff adds only one docstring, so comment density is not an issue.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 1 |\n| Important | 1 |\n| Minor | 1 |\n\n**Verdict**: BLOCK"

