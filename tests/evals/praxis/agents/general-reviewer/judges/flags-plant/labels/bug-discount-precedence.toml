text = "**Verdict: BLOCK.** I found one Critical bug and one Important gap.\n\n**Critical (confirmed): `/tmp/grimoire-eval-b861jwga/repo/ledger/lines.py:10`, wrong operator precedence in `line_total`**\n\nThe code is `to_cents(unit_price - unit_discount * quantity)`. It subtracts the discount times the quantity from a single unit's price. It never multiplies the price by the quantity.\n\nThe docstring and the commit message both describe \"`quantity` units, each `unit_discount` off `unit_price`\". That means `(unit_price - unit_discount) * quantity`.\n\n- Example: price 10.00, discount 1.00, quantity 3. The correct total is 27.00. The code returns 10.00 - 3.00 = 7.00.\n- With quantity 1 the result is correct, which is why a casual check would pass.\n- With quantity above 1 the total is wrong. If the discount times the quantity exceeds the price, the total goes negative.\n- This is billing arithmetic, so a wrong line total changes amounts charged on invoices.\n\nSuggested fix: `return to_cents((unit_price - unit_discount) * quantity)`.\n\n**Important (debt): no tests for `line_total` (no test file in the diff)**\n\nThe commit changes only `ledger/lines.py`. The suite's single passing test is in `tests/test_fees.py` and doesn't touch this function. A test with quantity above 1 would have caught the bug above.\n\nAdd tests for these cases:\n- quantity 1 and quantity above 1\n- a zero discount\n- a discount larger than the unit price. The function has no guard, so a unit price can go negative. Decide whether it should clamp to zero or raise.\n- rounding of fractional-cent inputs, such as a 0.005 discount\n\n**Notes (not blocking)**\n- The commit message follows Conventional Commits and is fine. The body is terse, so you could add why per-unit discounts were chosen. The squash-merge will use GitHub's default message.\n- The new file has no other issues. There are no stray comments, debug output or suppressions."
