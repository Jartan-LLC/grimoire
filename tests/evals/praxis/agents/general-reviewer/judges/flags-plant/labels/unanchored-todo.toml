text = "**Verdict: WARNING.** I found no blocking defect in the delimiter detection itself. I ran `python3 -m pytest -q` and it passes (1 test), but that test only covers the comma path. I did not execute the failure scenarios below; they come from reading the code.\n\n**Finding 1: Important (landmine), `tally/parse.py:10`, no test covers the new behaviour**\n- The branch adds delimiter detection and no test. The suite is still the single comma case in `tests/test_report.py`.\n- Failure scenario: someone later simplifies the detection line, or the `>` becomes `>=`. Semicolon exports then parse as a single column, and `total` raises `KeyError: 'amount'`. Nothing in CI catches it.\n- Fix: add tests for a `sku;amount` export, a BOM plus semicolons, CRLF line endings, and a header with no delimiter.\n\n**Finding 2: Important (landmine), `tally/parse.py:10`, the detection is heuristic and counts delimiters inside quoted header fields**\n- It compares raw `;` and `,` counts on the first line, so quoting is ignored.\n- Failure scenario: a comma-separated export has a quoted header such as `\"Name; Title\",...` or `\"Price, EUR\";...`. The comma-versus-semicolon count can then pick the wrong delimiter. Every row collapses into one column, and `total` raises `KeyError: 'amount'`.\n- A tie, or a single-column header, falls back to `,`.\n- `csv.Sniffer().sniff(sample, delimiters=\",;\")` is already in the stdlib, and it respects quoting. Per `code-hygiene` (reinvention), use it or justify the hand-rolled count.\n\n**Finding 3: Important (landmine, possibly Critical for the stated use case), `tally/report.py:10`, the EU data likely uses decimal commas**\n- The commit message says the EU shop exports with semicolons. Those exports typically write amounts as `1,50`.\n- After this change, the row `a;1,50` parses fine but reaches `Decimal(\"1,50\")`. That raises `decimal.InvalidOperation`, so the feature may not work end to end on the data it targets.\n- The fix is out of this diff's scope, but I would confirm with a real EU export before pushing. If the amounts use decimal commas, the feature as described is incomplete. It would also be worth a test with `1,50`.\n- If the shop's amounts are dot-decimal, this finding does not apply.\n\n**Finding 4: Important (debt), `tally/parse.py:11`, orphan TODO**\n- `# TODO: handle exports that mix delimiters` has no tracker anchor, so it is the bare-orphan case from `comment-hygiene`.\n- It also describes a limitation of the heuristic, which is really a `Finding 2` gotcha. Either link it to an issue or state the real constraint: the delimiter is chosen from the header line only.\n\n**Finding 5: Minor, `tally/parse.py:10`, readability**\n- `text.split(\"\\n\", 1)[0]` is computed twice, and the line is about 100 characters long.\n- Extract `header = text.split(\"\\n\", 1)[0]`, or move the detection into a small `_detect_delimiter(text)` helper. This also gives Finding 1 a unit to test.\n\n**Finding 6: Minor, `tally/parse.py:7`, stale docstring**\n- The module docstring \"Read the shop's CSV export into rows\" and the `parse_rows` docstring don't mention that the delimiter is auto-detected. The `parse_rows` docstring now omits behaviour that callers of this entry point depend on.\n- One clause fixes it.\n\n**Commit and PR hygiene**\n- The commit subject `feat(parse): read semicolon-separated exports` follows Conventional Commits.\n- The PR is squash-merged with GitHub's default message. With a single commit, GitHub uses that commit's subject as the PR title and its body as the description. That is fine, but keep the body accurate: \"The EU shop exports with semicolons.\"\n- Confirm the commit does not claim more than Finding 3 allows.\n- I added no attribution lines, because I made no commits."
