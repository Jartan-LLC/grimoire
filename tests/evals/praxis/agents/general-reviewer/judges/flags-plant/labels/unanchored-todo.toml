text = "**Findings for `feature/semicolon-exports` (one commit, 92c25bd)**\n\nI ran the code and the existing tests (1 passed). `find-duplicate-comments.js` ran and found no retold comments.\n\n**[IMPORTANT] No test covers the new behavior**\n- File: `tests/` (nothing added); the change is in `/tmp/grimoire-eval-negkepyr/repo/tally/parse.py:10`\n- Issue: The branch changes how every export is parsed, but adds no test. The only test is `tests/test_report.py`. Nothing covers a semicolon file, a comma file that still works, or the tie and edge cases.\n- Consequence: Someone can later simplify or \"fix\" the detection and quietly break either the EU exports or the existing comma exports. Nothing will fail.\n- Fix: Add parametrized tests for these inputs:\n  - a semicolon file\n  - a comma file\n  - a BOM-prefixed semicolon file\n  - a single-column file\n  - a comma file with a quoted header that contains `;`\n- Status: confirmed\n\n**[IMPORTANT] Delimiter detection can pick the wrong delimiter and produce wrong data without an error**\n- File: `/tmp/grimoire-eval-negkepyr/repo/tally/parse.py:10`\n- Issue: The code counts raw `;` and `,` characters in the first line and ignores CSV quoting. A comma-delimited export whose header has quoted fields with more semicolons than commas is misread as semicolon-delimited. For example, the header `\"a;b;c\",d` has 2 semicolons and 1 comma. The header then parses as one column, and the data rows get the wrong keys.\n- Consequence: Downstream totals come out wrong or missing, with no error. `csv.Sniffer(delimiters=\",;\")` already exists in the stdlib for this job.\n- Fix: Use `csv.Sniffer().sniff(first_line, delimiters=\",;\")` with a fallback to `,` on `csv.Error`. Or count delimiters only outside quotes.\n- Status: suspected. I confirmed the logic by reading the code. I did not run this exact input, and real shop headers may never contain `;`.\n\n**[IMPORTANT] Wrong-delimiter fallback depends on a tie-break that is not stated or tested**\n- File: `/tmp/grimoire-eval-negkepyr/repo/tally/parse.py:10`\n- Issue: A header with no delimiters, or with equal counts, falls back to `,`. That is probably what you want, but the strict `>` is a hidden decision, and no test pins it.\n- Fix: Cover it in the tests above.\n- Status: confirmed\n\n**[MINOR] Line 10 is long and does the same work twice**\n- File: `/tmp/grimoire-eval-negkepyr/repo/tally/parse.py:10`\n- Issue: `text.split(\"\\n\", 1)[0]` is computed twice, and the line is about 100 characters.\n- Fix: Extract a small helper such as `_detect_delimiter(text)`, or at least bind `header = text.split(\"\\n\", 1)[0]`.\n- Status: confirmed\n\n**[MINOR] The TODO comment has no tracker anchor**\n- File: `/tmp/grimoire-eval-negkepyr/repo/tally/parse.py:11`\n- Issue: `# TODO: handle exports that mix delimiters` has no issue id or owner, so nobody is accountable for it.\n- Fix: Anchor it as `TODO(#NNN)`, or drop it and open an issue.\n- Status: confirmed\n\n**[MINOR] The commit message is fine, but the PR title needs checking before merge**\n- Issue: `feat(parse): read semicolon-separated exports` follows Conventional Commits. The PR is squash-merged with GitHub's default message. With a single commit, GitHub uses the commit subject as the PR title, which is fine. If you add fix-up commits, GitHub will switch to the branch name as the title. Fold any fixes into this commit with `git commit --amend`, since it has not been pushed.\n- Status: confirmed\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 3 |\n| Minor | 3 |\n\n**Verdict**: WARNING"

