repo/tally/parse.py:11`\n- Issue: `# TODO: handle exports that mix delimiters` has no tracker anchor or owner. It also sits between the delimiter line and the code that uses it, which separates them.\n- Fix: Reference an issue (`TODO(#NNN): ...`) or drop it. If you keep it, move it next to the detection helper.\n- Status: confirmed\n\n**[MINOR] Comment doesn't state the real rationale**\n- File: `/tmp/grimoire-eval-ga1qqb4f/repo/tally/parse.py:7`\n- Issue: The docstring doesn't mention that the delimiter is auto-detected from the header, or that ties default to a comma. The commit body (\"The EU shop exports with semicolons\") is fine for a commit message.\n- Fix: Add one line to the docstring, or put it on the helper.\n- Status: confirmed\n\n**Commit convention.** The subject `feat(parse): read semicolon-separated exports` follows Conventional Commits and the project's standard. Because the PR is squash-merged, make sure the PR title uses the same form.\n\n**Summary**\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 3 |\n\n**Verdict**: WARNING"

