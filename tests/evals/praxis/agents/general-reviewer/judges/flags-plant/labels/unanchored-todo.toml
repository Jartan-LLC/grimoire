text = "**Test run:** `python3 -m pytest -q` gives 1 passed. That one test, `tests/test_report.py`, only covers a comma file.\n\n**Verdict: BLOCK.** I found one Critical issue, two Important ones and two Minor ones.\n\n## Critical\n\n**1. `tally/parse.py:10` and `tally/report.py:10`: semicolon exports still can't be totaled, and the failure is a crash.**\n- **Problem:** The EU shop's semicolon exports almost certainly use a decimal comma, such as `1,50`. `total()` calls `Decimal(row[column])` directly, and `Decimal` rejects `1,50`.\n- **Scenario:** `total(\"sku;amount\\na;1,50\\n\")` raises `decimal.InvalidOperation: ConversionSyntax`. I ran it. The feature's stated purpose, reading the EU exports, doesn't work end to end.\n- **Suggested fix:** Normalize the decimal separator in `report.py` when the file is semicolon-delimited. That means either having the parser return the detected dialect, or having `total` handle `,` as the decimal mark. If the EU exports in fact use `.` decimals, say so in the commit message and add a test that proves it.\n- **Confidence:** the crash is confirmed. That EU exports use decimal commas is an inference, so please confirm it against a real export.\n\n## Important\n\n**2. `tally/parse.py:10`: no test covers the new behavior (debt).**\n- **Problem:** The branch adds delimiter detection but no test. It has no semicolon case, no tie case, no quoted-header case and no CRLF case.\n- **Suggested fix:** Add tests in `tests/` for at least these cases:\n  - a plain semicolon file;\n  - a comma file with semicolons inside quoted values;\n  - a header containing a quoted delimiter;\n  - a single-column file;\n  - a UTF-8 BOM followed by a semicolon header.\n\n**3. `tally/parse.py:10`: the heuristic counts raw characters in the header line, ignoring quoting.**\n- **Problem:** The count ignores CSV quoting, so a quoted header that contains the other delimiter can flip the result.\n- **Scenario:** `'\"a;b\";c\\n1;2\\n'` has 2 semicolons and 0 commas, so `;` is chosen and it happens to work. But `'\"a,b,c\";d\\n\u2026'` has 2 commas and 1 semicolon, so `,` is chosen and the file is mis-parsed. Comma files with quoted `;` in header names, such as `\"Qty; units\",sku`, still parse correctly only because commas outnumber semicolons.\n- **Suggested fix:** Use `csv.Sniffer().sniff(first_line, delimiters=\",;\").delimiter`, with a fallback to `,` on `csv.Error`. Alternatively, keep the counting but strip quoted spans first.\n\n## Minor\n\n**4. `tally/parse.py:10`: the delimiter line is hard to read, and it splits the text twice.**\n- **Problem:** It's a single line of about 100 characters that calls `text.split(\"\\n\", 1)[0]` twice.\n- **Suggested fix:** Pull it into a small helper such as `_detect_delimiter(text)`. Use `text.partition(\"\\n\")[0]` or `splitlines()[0]`, and handle empty input.\n\n**5. `tally/parse.py:11`: the TODO is orphaned.**\n- **Problem:** `# TODO: handle exports that mix delimiters` has no tracker reference.\n- **Suggested fix:** Link an issue, as in `TODO(#NNN)`, or drop it. The comment also describes a limitation that the detection logic doesn't state.\n\n## Commit\n\nThe subject `feat(parse): read semicolon-separated exports` follows Conventional Commits, and nothing in the change is breaking, so no `!` is needed. Since the branch is unpushed, fold the fixes into this commit with `git commit --amend`."

