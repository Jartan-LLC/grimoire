text = "I reviewed `main...HEAD`, which is one commit (bea1bb0) changing `tally/parse.py`. f247765 \"chore: start the fixture\" is already on `main`, so it isn't part of this branch. I changed no files.\n\n**Tests:** `python3 -m pytest -q` gives 1 passed. That one test is `tests/test_report.py`, which only covers comma input. Nothing exercises the new semicolon path.\n\n**Duplicate comments:** `find-duplicate-comments.js` ran and found no retold comments in the diff.\n\n**Findings**\n\n[IMPORTANT] No test for the new semicolon feature\nFile: `tests/test_report.py` (no test added); the change is at `tally/parse.py:10`\nIssue: The commit adds delimiter detection with no test. The only test uses a comma export, so semicolon input and the detection rule (including ties and quoted fields) are unchecked.\nConsequence: A regression in the detection would pass CI unnoticed. It could silently mis-split rows and produce wrong totals.\nFix: Add tests for a semicolon export, a comma export and a header-only or tie case.\nStatus: confirmed\n\n[IMPORTANT] The delimiter guess can pick the wrong delimiter and give wrong totals without any error\nFile: `tally/parse.py:10`\nIssue: The delimiter is chosen by counting raw `;` and `,` in the header line. The count ignores quoting, so a quoted header such as `\"a;b;c\",amount` is read as semicolon-separated. In a semicolon file with a header like `sku;amount;note, misc`, a stray comma in a header name is also counted. A tie, including an empty header, falls back to `,`.\nConsequence: `DictReader` then returns rows with the wrong keys. `total` may fail, or it may sum the wrong column, and tally gives no sign that anything went wrong. Money totals are affected.\nFix: Use `csv.Sniffer().sniff(text[:N], delimiters=\",;\")`, or check the header against the expected column names.\nStatus: suspected. Verify by running `parse_rows` on a quoted or mixed-delimiter header. I did not run that case.\n\n[MINOR] The delimiter line is hard to read and repeats work\nFile: `tally/parse.py:10`\nIssue: It is one line of about 100 characters. It calls `text.split(\"\\n\", 1)[0]` twice. It also splits only on `\\n`, so a file using `\\r` line endings is treated as one long header line.\nConsequence: The line is hard to read and easy to get wrong when edited. Old-Mac `\\r`-only exports are detected on the whole text.\nFix: Compute `header = text.split(\"\\n\", 1)[0]` once, or use `text.splitlines()[0]`. Move the delimiter choice into a small named helper such as `_detect_delimiter`.\nStatus: confirmed\n\n[MINOR] Orphan TODO\nFile: `tally/parse.py:11`\nIssue: `# TODO: handle exports that mix delimiters` has no tracker reference or owner.\nConsequence: It will go stale and it doesn't say what is owed. Per the project's comment standard it should be anchored to an issue, or deleted if the gap is accepted.\nFix: Use `# TODO(#<issue>): ...`, or open an issue and drop the comment.\nStatus: confirmed\n\nThe commit message `feat(parse): read semicolon-separated exports` follows Conventional Commits. There are no secrets, debug output or suppressions.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 2 |\n\n**Verdict**: WARNING"

