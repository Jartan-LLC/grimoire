text = "Base used: `main` (merge-base 9d125d0). The branch has one commit, 609b024. `python3 -m pytest -q` gives 1 passed. `find-duplicate-comments.js` ran and found no retold comments.\n\n**[Important] No tests for the new delimiter detection**\nFile: tally/parse.py:10\nIssue: The only test is the existing comma-CSV test in `tests/test_report.py`. Nothing exercises semicolon input, so the feature the commit adds is unverified. The detection heuristic has edge cases (see the next finding), and none of them are pinned down.\nFix: Add tests in `tests/` for a semicolon export, a comma export, and a quoted header containing the other delimiter.\nStatus: confirmed\n\n**[Important] The delimiter heuristic can pick the wrong delimiter, and the result is silently wrong**\nFile: tally/parse.py:10\nIssue: The delimiter is chosen by counting raw `;` and `,` characters in the header line. It ignores CSV quoting and doesn't use `csv.Sniffer`. I ran `parse_rows('\"a,b,c\";d\\n1;2\\n')`. It returned `[{'a,b,c;d': '1;2'}]`, so the header is a single column and the delimiter was wrongly taken as `,`. A quoted header with more commas than semicolons gets mis-parsed this way. `total()` would then probably fail on a missing `amount` column, or give wrong totals. Real shop headers rarely contain commas, so this is an edge case, not the common path.\nFix: Use `csv.Sniffer().sniff(header_line, delimiters=\",;\")`, with a fallback to `,`. Or count delimiters only outside quotes.\nStatus: confirmed\n\n**[Important] Header splitting breaks on `\\r`-only line endings, and the line is split twice**\nFile: tally/parse.py:10\nIssue: `text.split(\"\\n\", 1)[0]` is evaluated twice in a long one-liner. With old-Mac `\\r`-only endings, \"the first line\" is the whole file. The counts then cover the data rows too, so decimal commas in the amounts (such as `1,5`) can outvote the `;` separators. `\\r\\n` files work. That `\\r`-only case is rare, so I did not try to reproduce it.\nFix: Compute `header = text.partition(\"\\n\")[0]` once, or use `text.splitlines()[0]` (guarded for empty input). Keep the expression off one 100+ character line.\nStatus: suspected -- verify that shop exports never use `\\r`-only line endings\n\n**[Minor] Orphan TODO**\nFile: tally/parse.py:11\nIssue: `# TODO: handle exports that mix delimiters` has no tracker anchor or owner. It also sits between the delimiter line and the `DictReader` call, away from the heuristic it is about.\nFix: Link it to an issue, e.g. `TODO(#NNN)`, or drop it. Put it beside line 10 if you keep it.\nStatus: confirmed\n\n**[Minor] Unhandled empty input**\nFile: tally/parse.py:10\nIssue: This is not a regression. Empty text gives a header of `\"\"`, so the delimiter falls back to `,` and the result is an empty list.\nStatus: confirmed\n\nThe commit message `feat(parse): read semicolon-separated exports` follows Conventional Commits. The commit is unpushed, so it can be amended to fold in tests.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 3 |\n| Minor | 2 |\n\n**Verdict**: WARNING"

