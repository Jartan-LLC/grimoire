its between the detection line and its use, which separates them.\n   - Fix: link it to an issue, as in `TODO(#NNN)`, or drop it. Mixed delimiters in one file are not a stated requirement, so this may be speculative. If you keep it, move it above the detection line.\n\n4. `/tmp/grimoire-eval-r0hkqy2i/repo/tally/parse.py:7-8` \u2014 Minor (docstring)\n   - The docstring doesn't mention that the delimiter is auto-detected from the header line. That is now a behavior callers rely on.\n   - Fix: add one sentence, such as \"Comma or semicolon delimiter, detected from the header line.\"\n\n**Project standards**\n- The commit message `feat(parse): read semicolon-separated exports` follows Conventional Commits. The commit is not pushed, so any further fixes can be amended into it.\n- The branch name `feature/semicolon-exports` matches the convention.\n- The PR will be squash-merged, so the PR title should be conventional too."

