text = "**Verdict: BLOCK.** `python3 -m pytest -q` passes (1 passed), but that test is in `tests/test_fees.py`. Nothing tests the new payout code.\n\n## Critical\n\n**Finding 1: `iban_is_valid` is a stub that always returns True** (`ledger/payouts.py:10-12`)\n- The docstring says it checks the ISO 13616 checksum, but the body is `return True`. The commit title says \"verified bank account\", and `PayoutRefused` can never be raised.\n- `payout()` is the only caller and is a public function. Every IBAN is accepted, including empty strings, garbage, and IBANs with bad checksums.\n- Callers will trust the result as verified. Money would go to invalid or mistyped accounts, and the failure is silent.\n- Fix: implement mod-97 validation, which includes normalizing spaces and case, checking the country-specific length, and checking that the characters are alphanumeric. Alternatively, raise `NotImplementedError` until it exists, or don't ship the function.\n\n## Important\n\n**Finding 2: No tests for the new module** (`tests/`)\n- `iban_is_valid` and `payout` have no tests. A test with an invalid IBAN would have caught Finding 1 immediately.\n- The module handles money movement, so this is load-bearing logic.\n- Add tests for a valid IBAN, a bad checksum, bad length and malformed input, and refusal behaviour.\n\n**Finding 3: `payout()` has no balance guards** (`ledger/payouts.py:15-19`)\n- A zero or negative `balance` is returned as \"the amount paid\". A negative balance would be paid out as a negative amount, which is a debit, or at best a nonsensical result.\n- Nothing is debited and there is no currency or quantization handling. I checked `ledger/money.py` only by file listing, not contents, so I can't say whether a rounding helper exists that this should use.\n- Add a positive-balance check, and use the project's money helpers if any exist.\n\n## Minor\n\n**Finding 4: The exception leaks the full IBAN** (`ledger/payouts.py:18`)\n- `PayoutRefused(iban)` puts the full account number in the exception message. It will end up in logs and tracebacks.\n- This is bank-account PII. It is low severity today because the branch is currently unreachable (see Finding 1), but it will matter once validation is real. Consider masking it.\n\n**Finding 5: Docstring grammar** (`ledger/payouts.py:16`)\n- \"Pay out the whole balance to `iban`; the amount paid.\" is a fragment. Write something like \"Returns the amount paid.\""

