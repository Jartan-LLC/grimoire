text = "**Verdict: BLOCK.** I ran `python3 -m pytest -q` and it passes (1 test). That test is `tests/test_fees.py`, and nothing exercises `ledger/payouts.py`, so the green run says nothing about this change. I modified no files.\n\n**Critical**\n\n1. `ledger/payouts.py:10-12`: `iban_is_valid` is a stub that always returns `True`, but its docstring claims it checks the ISO 13616 checksum.\n   - Because of this, the refusal guard at lines 17-18 can never fire, and `PayoutRefused` is unreachable.\n   - Failure scenario: `payout(Decimal(\"500.00\"), \"not-an-iban\")` returns `Decimal(\"500.00\")`, meaning the payout is approved. Any caller that treats a returned amount as \"paid\" will release money to a malformed or typo'd account.\n   - This contradicts the commit subject, \"pay out to a verified bank account\". The function has a public, importable API and no TODO or `NotImplementedError`, so it looks finished.\n   - Fix: implement the check (strip spaces, uppercase, move the first four characters to the end, map letters to numbers, require `int % 97 == 1`, plus a per-country length check). Alternatively, raise `NotImplementedError` until it is implemented. Don't ship the canned `True`.\n\n**Important**\n\n2. `ledger/payouts.py:15-19` (and the whole new module): there are no tests for the new code.\n   - There is no test for a valid IBAN, an invalid IBAN raising `PayoutRefused`, or the returned amount. A single \"invalid IBAN is refused\" test would have caught finding 1.\n   - Failure scenario: a later change to the amount logic or the validator regresses silently, because nothing covers it.\n   - Add `tests/test_payouts.py`.\n\n3. `ledger/payouts.py:15-19`: `payout` does not validate `balance`.\n   - It returns the balance unchanged, so a zero or negative balance yields a \"payout\" of that amount.\n   - Failure scenario: `payout(Decimal(\"-20.00\"), valid_iban)` returns `-20.00`. A caller that debits the seller by the returned amount would credit them instead.\n   - Decide the contract: refuse `balance <= 0`, or document that the caller must check.\n   - I rated this Important rather than Critical because the function only returns a number and nothing moves money in this diff.\n\n**Minor**\n\n4. `ledger/payouts.py:16`: the docstring \"Pay out the whole balance to `iban`; the amount paid.\" is terse and the semicolon is awkward. The function also pays nothing; it only returns the amount. Reword it to say it returns the amount to pay.\n\n5. `ledger/payouts.py:18`: `PayoutRefused(iban)` puts the raw IBAN in the exception message. IBANs are account identifiers, so they may end up in logs. Use a reason string, or mask the IBAN.\n\n**Fine**\n- The commit message follows Conventional Commits (`feat(payouts): ...`).\n- The code is Python 3.12 compatible and `Decimal` is the right type for money.\n- There are no stray debug prints or suppression directives.\n\nFor the PR, GitHub's default squash message will use the PR title. Title it `feat(payouts): ...` as well, and don't open it until the IBAN validation (finding 1) is real."

