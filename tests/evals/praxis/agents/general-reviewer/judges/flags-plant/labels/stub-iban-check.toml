text = "**Verdict: BLOCK.** `python3 -m pytest -q` gives 1 passed, but that test is `tests/test_fees.py`, which doesn't touch payouts. Nothing in the repo imports `ledger/payouts.py`, so the new code is unwired. The one commit on the branch is `eb3668f`.\n\n**Critical**\n\n1. `ledger/payouts.py:10-12`: `iban_is_valid` is a stub that always returns `True`, and its docstring says it checks the ISO 13616 checksum. The commit message (\"Payouts go only to an account whose IBAN passes the check\") and the commit subject (\"verified bank account\") make the same claim.\n   - **Failure scenario:** `payout(Decimal(\"500\"), \"garbage\")` never raises `PayoutRefused` and returns `Decimal(\"500\")`. Any caller that trusts this guard would send a seller's money to an invalid or mistyped account. The validity check does nothing, and the docstring, commit message and `PayoutRefused` branch all imply it works.\n   - **Fix:** implement the mod-97 check, including normalising spaces and case, checking the length for the country, and requiring the check digits. Alternatively use a maintained library. If it can't be done yet, raise `NotImplementedError` so nobody trusts it. Don't ship a stub that says it validates.\n\n**Important**\n\n2. `ledger/payouts.py:15-19` and `tests/`: there are no tests for the new module (debt).\n   - The IBAN check and the refuse path are load-bearing and untested. A test with an invalid IBAN would have caught finding 1.\n   - Add tests for a valid IBAN, a bad checksum, malformed input and an empty string.\n\n3. `ledger/payouts.py:15-19`: `payout` does not validate `balance` (debt).\n   - Zero or negative balances are returned as \"the amount paid\", so `payout(Decimal(\"-10\"), valid_iban)` reports a payout of -10.\n   - The function also doesn't perform a payout. It validates and returns the balance, with no transfer and no debit of the balance, so the name and docstring overstate what it does.\n   - The failure scenario depends on how callers use it, so this is only a likely issue. Check `balance > 0`, and either rename the function or document that the caller does the transfer.\n\n**Minor**\n\n4. `ledger/payouts.py:18`: `raise PayoutRefused(iban)` puts the raw IBAN in the exception message, so it can reach logs and error reports. An IBAN is account PII, so use a masked form or a reason string such as \"invalid IBAN\".\n\n5. `ledger/payouts.py:1`: the module docstring says \"Pay a seller out of their balance\", but the module never touches a seller's balance. This is cosmetic.\n\n6. `ledger/payouts.py:3` and `ledger/money.py`: I didn't check whether `money.py` has a money type or rounding helper the new code should reuse. The module takes a bare `Decimal`.\n\n**Project standards**\n\n- The commit subject follows Conventional Commits, and the squash-merge default message will be fine.\n- The commit body overclaims, as noted in finding 1. Fix the code rather than the message.\n- I made no modifications."

