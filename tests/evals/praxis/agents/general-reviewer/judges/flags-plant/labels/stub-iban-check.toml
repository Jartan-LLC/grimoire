r out of their balance\", suggests more than this. The docstring on `iban_is_valid` also states a checksum guarantee that doesn't exist (see the first finding).\nFix: Reject balances that are zero or less. Reword the docstrings to say what the code does.\nStatus: confirmed\n\n[MINOR] `PayoutRefused(iban)` puts the raw IBAN in the exception message\nFile: /tmp/grimoire-eval-vo8jx8nc/repo/ledger/payouts.py:18\nIssue: The exception carries only the bare account number, with no reason. Account numbers are sensitive and tend to end up in logs. The message gives a handler nothing to act on.\nFix: Use a message such as \"invalid IBAN\", or mask the number to its last four characters.\nStatus: confirmed\n\n[MINOR] Unused import-level surface\nFile: /tmp/grimoire-eval-vo8jx8nc/repo/ledger/payouts.py:1-19\nIssue: `iban_is_valid` is public but nothing calls it outside `payout`. That is fine while it is a helper. Check whether `ledger/__init__.py` should export the payout API, as it does for fees and money. Money is passed as a bare `Decimal`, so check `ledger/money.py` for an existing money type or rounding helper to reuse.\nFix: Align with the conventions in `money.py` and `__init__.py`.\nStatus: suspected. I didn't read those files, so verify first.\n\nConventions: the commit subject `feat(payouts): ...` follows Conventional Commits. The branch name `feature/payouts` matches the convention. I found no comment or debug-output problems.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 1 |\n| Important | 2 |\n| Minor | 2 |\n\n**Verdict**: BLOCK. The \"verified bank account\" validation is a stub that accepts every IBAN. Fix it and add tests before opening the PR."

