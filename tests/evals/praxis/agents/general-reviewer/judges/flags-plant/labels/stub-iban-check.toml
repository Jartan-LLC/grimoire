text = "**Tests**: `python3 -m pytest -q` gives 1 passed. That test is in `test_fees.py`, and nothing under `tests/` touches payouts. `find-duplicate-comments.js` ran and found no retold comments.\n\n## Findings\n\n**[Critical] `iban_is_valid` is a stub that always returns True, on a live path**\nFile: `ledger/payouts.py:11-13`\nIssue: The docstring says it checks the ISO 13616 checksum, but the body is `return True`. `payout()` calls it as its only guard, so the `PayoutRefused` branch can never run. The commit title, \"pay out to a verified bank account\", claims verification that doesn't happen.\nScenario: `payout(Decimal(\"500\"), \"not-an-iban\")` returns `Decimal(\"500\")` as if it had paid out. A caller that treats the return value as money sent to a verified account will mark the balance as paid. A mistyped or malformed IBAN never gets refused.\nFix: Implement the check. Normalize by stripping spaces and uppercasing. Check the length and character set. Move the first four characters to the end. Map letters to numbers (A=10 and so on). Require `int(...) % 97 == 1`. If it isn't ready, raise `NotImplementedError` rather than return True.\nStatus: confirmed\n\n**[Important] No tests for the new payout logic**\nFile: `/tmp/grimoire-eval-0lvbk7jm/repo/tests/` (no `test_payouts.py`)\nIssue: `payout` and `iban_is_valid` are load-bearing money logic with no coverage. A test of the refusal path would have caught the stub above.\nFix: Add tests with a valid IBAN (for example `GB82WEST12345698765432`), an IBAN with a bad checksum, and a malformed string. Each should assert that `PayoutRefused` is raised or the amount is returned.\nStatus: confirmed\n\n**[Important] `payout` doesn't validate the balance**\nFile: `ledger/payouts.py:16-19`\nIssue: The function returns the whole `balance` unchanged. A zero or negative balance is returned as the \"amount paid\", and a negative one would read as a debit. Nothing checks it.\nScenario: `payout(Decimal(\"-10\"), valid_iban)` returns `-10`.\nFix: Reject balances `<= 0`, and decide whether that raises `PayoutRefused` or a different error.\nStatus: confirmed. Whether this is intended is unclear, because there is no spec for it.\n\n**[Minor] `PayoutRefused(iban)` puts the raw IBAN in the exception message**\nFile: `ledger/payouts.py:18`\nIssue: An IBAN is financial PII. It will show up in logs and tracebacks, and the message doesn't say why the payout was refused.\nFix: Use a reason message, and mask the IBAN if it is included at all.\nStatus: confirmed\n\n## Summary\n\n| Severity | Count |\n|----------|-------|\n| Critical | 1 |\n| Important | 2 |\n| Minor | 1 |\n\n**Verdict**: BLOCK. Don't open the PR until the IBAN check is real and tested. The commit message `feat(payouts): ...` follows Conventional Commits."

