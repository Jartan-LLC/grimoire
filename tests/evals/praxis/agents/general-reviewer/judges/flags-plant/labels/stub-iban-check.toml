text = "I found two Critical issues and one Important one. Both Critical issues are in `ledger/payouts.py`. I only read the diff and ran the test suite, which passes (1 test). I changed no files.\n\n**Critical: `iban_is_valid` is a stub that always returns True** (`ledger/payouts.py:11-13`)\n- The docstring says it checks the ISO 13616 checksum, but the body is `return True`. There is no TODO and no `NotImplementedError`.\n- `payout` calls it as its only guard (line 17), so the `PayoutRefused` branch can never run.\n- Failure scenario: `payout(Decimal(\"500\"), \"garbage\")` returns `Decimal(\"500\")`, so the caller treats the money as sent to a verified account. The commit message (\"pay out to a verified bank account\") says the same thing. A mistyped or malicious IBAN passes verification and a real payout is attempted or recorded against it.\n- Fix: implement the check (strip spaces, move the first four characters to the end, map letters to numbers, require mod 97 == 1, and check the length per country). Alternatively, make the stub raise `NotImplementedError` until it is done.\n\n**Critical: `payout` has no amount validation** (`ledger/payouts.py:15-19`)\n- It returns the whole `balance` without checking it.\n- Failure scenario: `payout(Decimal(\"-50\"), valid_iban)` returns `-50`. A caller that debits the seller by the returned amount would credit them 50, or issue a reverse transfer. A zero balance returns 0 with no refusal, so a no-op payout looks successful.\n- A `Decimal(\"NaN\")` balance would also pass straight through.\n- Fix: refuse when `balance <= 0` or when it isn't finite.\n- Severity note: whether this is Critical depends on callers that aren't in this diff. I rated it by the money-path rule that wrong results on a payout are Critical.\n\n**Important (debt): no tests for the new module** (`tests/` has only `test_fees.py`)\n- The payout path moves money, yet nothing exercises `iban_is_valid`, `payout` or `PayoutRefused`. A test for an invalid IBAN would have caught the stub immediately.\n- Add tests for a valid IBAN, an invalid IBAN raising `PayoutRefused`, and negative and zero balances.\n\n**Minor**\n- `ledger/payouts.py:14`: the `payout` docstring (\"Pay out the whole balance to `iban`; the amount paid.\") is a clumsy fragment. It also claims a payout happens, but the function only returns the balance.\n- `ledger/payouts.py:18`: `PayoutRefused(iban)` puts the full IBAN into the exception message. That is bank-account PII and will end up in logs and tracebacks. Mask it or leave it out."
