what a non-positive balance should do. Give the exception a reason, such as \"invalid IBAN\", and avoid putting the full IBAN in it.\nStatus: confirmed\n\n**Verdict**: BLOCK\n\n| Severity | Count |\n|----------|-------|\n| Critical | 1 |\n| Important | 1 |\n| Minor | 1 |"

