text = "**Review of `feature/payouts` against `main`** (commit f3e1090, adds `ledger/payouts.py`)\n\nTests: `python3 -m pytest -q` gives 1 passed. That test is `tests/test_fees.py`, and nothing covers payouts. `find-duplicate-comments.js` ran and found no retold comments.\n\n[CRITICAL] `iban_is_valid` is a stub that always returns True\nFile: ledger/payouts.py:11-13\nIssue: The docstring says it checks the ISO 13616 checksum, but the body is `return True`. `payout()` calls it as its only gate, so `PayoutRefused` can never be raised. Every IBAN is accepted, including malformed ones. This contradicts the commit title (\"pay out to a *verified* bank account\"). Callers will trust the result as real, and money would go to unverified accounts.\nFix: Implement the real check:\n1. Strip spaces and uppercase the input.\n2. Check the length and the `^[A-Z]{2}\\d{2}[A-Z0-9]+$` shape.\n3. Move the first four characters to the end.\n4. Map letters to numbers (A=10 through Z=35).\n5. Require `int(s) % 97 == 1`.\n\nOptionally check the per-country length. If the validation is out of scope for this PR, make the function raise `NotImplementedError` so the gap is honest.\nStatus: confirmed\n\n[CRITICAL] `payout` pays the full balance without checking it\nFile: ledger/payouts.py:15-19\nIssue: A negative or zero `balance` is returned as the \"amount paid\". A negative value would be paid out as a negative amount. The function also moves no money, records nothing, and returns the input unchanged. The docstring says \"Pay out\", so callers may treat the result as a completed payout. It is unclear whether a real transfer is wired in elsewhere, because nothing in the repo calls `payout`.\nFix: Raise `ValueError` (or `PayoutRefused`) when `balance <= 0`. Either do the actual transfer or state in the docstring that this only computes the amount. Quantize to the currency's minor unit if that matters.\nStatus: suspected. Verify the intended contract and whether a caller exists. I rate it Critical because the function is a public API that handles money. The tier drops if it is a pure amount computation.\n\n[IMPORTANT] No tests for the new module\nFile: ledger/payouts.py (no matching file in tests/)\nIssue: Validation and refusal logic that handles money has no tests. A test for the refusal path would have exposed the stub above.\nFix: Add `tests/test_payouts.py` with a valid IBAN (for example `GB82WEST12345698765432`), an invalid checksum, a malformed string, and a negative balance.\nStatus: confirmed\n\n[MINOR] `PayoutRefused(iban)` puts the full IBAN in the exception message\nFile: ledger/payouts.py:18\nIssue: The IBAN is account data and will end up in logs and tracebacks.\nFix: Use a fixed message, or mask the IBAN down to its last four characters.\nStatus: confirmed\n\n**Summary**\n\n| Severity | Count |\n|----------|-------|\n| Critical | 2 |\n| Important | 1 |\n| Minor | 1 |\n\n**Verdict**: BLOCK"

