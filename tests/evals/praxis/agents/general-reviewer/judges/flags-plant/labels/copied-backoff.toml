text = "**Findings**\n\n[IMPORTANT] Duplicated retry/backoff loop and constants (debt)\nFile: fetchkit/poll.py:8-20\nIssue: `poll` copies the loop from `fetchkit/retry.py` almost line for line. That covers `MAX_ATTEMPTS = 3`, `BASE_DELAY_S = 0.5`, the `range(1, MAX_ATTEMPTS)` loop, the `BASE_DELAY_S * 2 ** (attempt - 1)` backoff and the injectable `sleep`. A change to the attempt count or backoff has to be made in two places, and the two will drift. The module-level constants have the same names but separate values.\nFix: Put the loop in one place. For example, add a generic helper in `retry.py` that takes a \"should retry\" predicate, such as `retry_until(call, done, sleep)`. Have `with_retries` and `poll` both call it with their own predicate (`status < 500` and `body == \"done\"`). At minimum, import the constants from `fetchkit.retry` instead of redefining them.\nStatus: confirmed\n\n[IMPORTANT] No tests for the new polling logic\nFile: fetchkit/poll.py (tests/ has only test_retry.py)\nIssue: `poll` has no tests, although it has branches that are easy to get wrong. These are done on the first response, done on a later attempt, never done, and the number of sleeps and their delays. The injectable `sleep` exists to make this testable, but nothing uses it. `tests/test_retry.py` shows the pattern to follow.\nFix: Add `tests/test_poll.py`. Monkeypatch `transport.send` and pass a recording `sleep`. Assert the return value and the sleep sequence `[0.5, 1.0]` for a job that never finishes.\nStatus: confirmed\n\n[MINOR] `poll` returns False on timeout or on a persistent 5xx, and the docstring doesn't say so\nFile: fetchkit/poll.py:13-20\nIssue: `poll` only checks `response.body == \"done\"`. It ignores `response.status`. A non-2xx response with a body of \"done\" counts as done, and a persistent error looks the same as \"not finished yet\". `get` already retries 5xx, so the retries multiply: each poll attempt can make up to 3 requests, for up to 9 in total. The docstring says \"within the attempts allowed\" without giving the number or the compounding. The user-facing behavior is a total wait of roughly 1.5s of poll backoff on top of the inner retries, which is probably too short for a job that finishes asynchronously. That seems to be a design question for the author.\nFix: Check `response.ok and response.body == \"done\"`. Reconsider whether a poll should be limited to 3 attempts at 0.5s base delay. If it should, document the limits.\nStatus: suspected, confirm the intended polling window with the author.\n\n[MINOR] The loop shape duplicates the final check\nFile: fetchkit/poll.py:15-20\nIssue: The `== \"done\"` test appears twice, once inside the loop and once after it. Because the loop fetches again after the last sleep, the final check is the only place the last response is examined, which is easy to misread.\nFix: Fold this into the shared helper from the first finding, or restructure it as `for attempt in range(MAX_ATTEMPTS): ...; if attempt < MAX_ATTEMPTS - 1: sleep(...)`.\nStatus: confirmed\n\n**Checked and clean**\n- The commit message follows Conventional Commits (`feat(poll): ...`).\n- There is no debug output and there are no suppressions.\n- The comments and docstrings are accurate.\n- `find-duplicate-comments.js` ran and found no retold comments.\n\n**Summary**\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 2 |\n\n**Verdict**: WARNING"

