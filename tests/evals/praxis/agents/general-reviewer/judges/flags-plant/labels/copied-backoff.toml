text = "Verdict: WARNING. I found no Critical issues. The polling loop itself is correct: with MAX_ATTEMPTS=3 it makes 3 GETs, and the sleeps happen only between them. I ran `python3 -m pytest -q` and got 1 passed. That test is in `tests/test_retry.py`, so it doesn't cover `poll`.\n\n**Important (debt): no tests for `poll`**\n- `/tmp/grimoire-eval-wdqstcyt/repo/fetchkit/poll.py:12-20` has no test file. `sleep` is injectable, but nothing calls `poll`.\n- The code has an off-by-one-prone loop, with `range(1, MAX_ATTEMPTS)` and a separate final check. Nothing pins any of these cases:\n  - done on the first try\n  - done on the last try\n  - never done, with the returned value and the sleep sequence (0.5, 1.0)\n- A later edit to the loop could silently change the attempt count or return value, and the test suite would still pass.\n\n**Important (debt): duplicated constants and loop shape from `retry.py`**\n- `poll.py:8-9` redefines `MAX_ATTEMPTS = 3` and `BASE_DELAY_S = 0.5`. `poll.py:14-20` copies the backoff loop from `retry.py:8-20`.\n- The two sets of constants are independent. If someone raises the retry limit or changes the backoff in `retry.py`, polling won't change. Both modules also export the same names, which invites a wrong import.\n- Also, `get()` already retries up to 3 times on 5xx. One `poll` call can therefore make up to 9 requests, and its sleeps are not bounded by `poll`'s own constants. If the status endpoint is down, a sync job could stall about 3.5s per poll attempt on top of `poll`'s own sleeps.\n- Consider a shared backoff helper, or at least `poll`-specific names.\n\n**Minor: poll can't tell \"failed\" from \"not done yet\"**\n- `poll.py:16-20` treats any body other than `\"done\"` the same way. A 404, a 5xx that survived retries, or a body like `\"failed\"` is retried with delays. The function then returns `False`, the same as a timeout.\n- A caller can't tell a failed job from a slow one. If the status protocol includes a failure state, this is worth handling. That's a design question, so I'm keeping it Minor.\n\n**Minor: exact-match body check**\n- `poll.py:17` and `poll.py:20` compare `response.body == \"done\"` exactly. A trailing newline or whitespace, or a JSON body, would never match. The function would then report \"not done\" after the full retries, even though the job finished. This depends on the endpoint contract, which I couldn't see. Normalizing, or naming a `DONE` constant, would make the contract explicit.\n\n**Minor: repeated `done` check**\n- `poll.py:17` and `poll.py:20` check `done` twice. A `for`/`else` or a restructured loop would drop the repetition. This is style only.\n\n**Conventions**\n- The commit subject `feat(poll): poll a URL until it reports done` follows Conventional Commits. There is no breaking change.\n- PRs are squash-merged with GitHub's default message. For a single-commit PR that message is the commit subject, so keep the PR title in the same format."

