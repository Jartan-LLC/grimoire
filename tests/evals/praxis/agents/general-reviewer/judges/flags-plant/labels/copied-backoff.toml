text = "I ran `find-duplicate-comments.js`, and it found no retold comments.\n\n**[Important] Duplicated retry loop and constants**\nFile: fetchkit/poll.py:8-20\nIssue: `poll` copies `with_retries` from `fetchkit/retry.py`. It repeats `MAX_ATTEMPTS = 3`, `BASE_DELAY_S = 0.5`, the `range(1, MAX_ATTEMPTS)` loop, the `BASE_DELAY_S * 2 ** (attempt - 1)` backoff and the injectable `sleep`. Only the stop condition differs (`body == \"done\"` instead of `status < 500`).\nFailure scenario: someone changes the backoff or attempt count in `retry.py` and `poll.py` keeps the old values. The same constant names then mean different things in the two modules.\nFix: import the shared constants from `retry`, or generalize the loop into a helper that takes a \"finished\" predicate, for example `retry_until(call, done, sleep)`. Have both `with_retries` and `poll` use it.\nStatus: confirmed\n\n**[Important] Polling window is too short, and the docstring hides that**\nFile: fetchkit/poll.py:10-11, 15\nIssue: polling reuses the retry budget of 3 attempts with 0.5s and 1s sleeps. That is about 1.5s in total, and `poll` returns `False` after that. A job that takes longer than that to finish is reported as \"not done\". Callers can't tell that apart from a job that failed. Each `get()` also runs its own `with_retries`, so a persistent 5xx adds nested retries on top. The docstring \"within the attempts allowed\" doesn't say what the limits are.\nFailure scenario: a sync job that finishes after 5s is reported as not done on the first `poll` call.\nFix: give polling its own attempt count and interval, and make them parameters (`attempts`, `interval`). State the limits in the docstring. Consider returning a tri-state or raising on timeout.\nStatus: confirmed for the 3-attempt cap. Suspected for the real job durations, so verify them with the sync jobs.\n\n**[Important] New module has no tests**\nFile: fetchkit/poll.py\nIssue: `tests/` only covers retry. `poll` has no tests for done on the first