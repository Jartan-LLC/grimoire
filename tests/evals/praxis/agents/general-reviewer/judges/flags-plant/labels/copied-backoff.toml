text = "**Findings, ranked by severity**\n\n**[Important] (debt) Backoff loop and constants copied from `retry.py`**\n- File: `fetchkit/poll.py:8-20`\n- Issue: `MAX_ATTEMPTS = 3`, `BASE_DELAY_S = 0.5`, the `range(1, MAX_ATTEMPTS)` loop shape, the `sleep` injection and the `BASE_DELAY_S * 2 ** (attempt - 1)` formula are copied from `fetchkit/retry.py:8-22`. `with_retries` is already the owner of this logic.\n- Consequence: The two copies are independent, so changing one (for example jitter, a cap, or different delays) leaves the other behind. A reader also cannot tell whether the matching values are deliberate.\n- Fix: Generalize `with_retries` to take a \"retry while\" predicate (status >= 500, or body != \"done\"). Alternatively, have `poll` import the shared constants and a shared delay helper.\n- Status: confirmed\n\n**[Important] (debt) No tests for the new feature**\n- File: `fetchkit/poll.py` (nothing in `tests/`; the suite is still 1 test, in `tests/test_retry.py`)\n- Issue: `poll` has a hand-built attempt and sleep sequence and an injectable `sleep`, but nothing exercises it.\n- Consequence: The off-by-one-prone loop (3 gets, 2 sleeps, no sleep after the last get) is unprotected. Anyone refactoring toward the shared retry code has no safety net.\n- Fix: Add tests that replace `transport.send` and pass a fake `sleep`. Cover done on the first get, done on the last get, never done (returns False with sleeps of 0.5 and 1.0), and a 5xx followed by done.\n- Status: confirmed\n\n**[Important] (debt) The polling window is about 1.5 seconds**\n- File: `fetchkit/poll.py:8-9, 14-20`\n- Issue: The commit message says export jobs \"finish asynchronously\", but the loop makes only 3 polls with sleeps of 0.5 s and 1 s. Those numbers are the retry-on-5xx settings, not a polling cadence.\n- Consequence: Any job that takes longer than about 1.5 s makes `poll` return `False`. Callers cannot tell \"still running\" from \"failed\". The sync job would report spurious failures or skip exports that are only slow.\n- Fix: Give polling its own attempt count and interval, or take them as parameters, and confirm they suit real export durations.\n- Status: suspected. Verify typical export duration against the sync job.\n\n**[Minor] Response status is ignored**\n- File: `fetchkit/poll.py:16, 20`\n- Issue: Only `response.body == \"done\"` is checked. A non-2xx response, for example a 5xx that persists after `get`'s retries or a 404, is treated the same as \"not done yet\" and polled again.\n- Consequence: A permanently failing URL silently returns `False` after the delay budget, the same as a slow job.\n- Fix: Check `response.ok` and fail fast, or raise on a non-2xx response.\n- Status: confirmed\n\n**Process**\n- The comment-hygiene duplicate check ran and found no retold comments.\n- The commit subject follows Conventional Commits, so there is nothing to fix there.\n- The branch has a single commit, so the squash-merge message will be that commit's message.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 3 |\n| Minor | 1 |\n\n**Verdict**: WARNING"

