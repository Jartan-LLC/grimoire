e `feat(api): return when an item was last updated` follows Conventional Commits. Its body explains why the change was made.\n- `datetime | None` is valid on Python 3.12, and the `datetime` import is used.\n- `item.updated` exists on `Item` (`models.py:14`), so the attribute access is safe.\n- The `None` check mirrors `stock_level`'s handling of an unknown SKU. Returning `None` here, rather than `0` as `stock_level` does, is the right choice because there is no sensible default timestamp.\n- The change touches only the one file and adds no debug output, suppression directives or dead code.\n- The branch name `feature/updated-at` matches the branch convention.\n- The other commit, 440535c, is on main already.\n- The PR title and squash message should reuse the commit subject."

