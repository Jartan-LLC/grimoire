text = "I reviewed `feature/longer-retries` against `main`. The branch has one commit, 006244a, which changes `fetchkit/retry.py` only. The tests pass (`python3 -m pytest -q`: 1 passed). `find-duplicate-comments.js` ran and found no retold comments. I didn't modify any files.\n\n**[Important] The new comment contradicts the code**\n- File: `fetchkit/retry.py:15`\n- Issue: The comment `# Give up after three attempts, so a dead host fails fast.` was added in the same commit that sets `MAX_ATTEMPTS = 5`. The loop makes 5 calls, and the commit message says \"five attempts\".\n- Consequence: A future editor will trust the comment and assume the limit is 3. They may \"fix\" the constant back to 3 or tune the backoff against the wrong number. The comment also repeats the count the constant already states, so it would go stale again on the next change.\n- Fix: Delete it. If you want to keep the \"fails fast\" reasoning, drop the number from it, for example: `# Bounded so a dead host fails fast.` That still doesn't add much over the constant.\n- Status: confirmed\n\n**[Important] The retry-count change has no test**\n- File: `tests/test_retry.py` (the only test is a first-try success)\n- Issue: Nothing exercises the retry loop. The behaviour this commit changes is untested: the number of calls, the backoff delays, and the 5xx-then-success path.\n- Consequence: If the loop bound drifts (an off-by-one, a revert to 3, a wrong delay), the suite stays green. The comment above shows the count is already easy to get wrong.\n- Fix: Add two tests using the injectable `sleep`. First, an always-500 call should be made exactly 5 times and return the last 500 response, with sleeps of `[0.5, 1.0, 2.0, 4.0]`. Second, a call that returns 500 and then 200 should stop retrying.\n- Status: confirmed\n\n**[Minor] The longer retry time is a behaviour change that callers may not expect**\n- File: `fetchkit/retry.py:8`\n- Issue: Backoff is unchanged, so the worst case is now 0.5 + 1 + 2 + 4 = 7.5s of sleeping, up from 1.5s. The `fetchkit/client.py` caller and the sync jobs get no way to configure this. The commit message gives a reason but doesn't mention the added latency.\n- Consequence: A sync job against a dead host now blocks about 5 times longer before failing. That is probably acceptable but worth knowing. The commit type `feat` is fine under Conventional Commits.\n- Fix: Optional. Mention the 7.5s worst case in the PR description. The PR will be squash-merged with GitHub's default message, which takes its title from the commit when there is one commit.\n- Status: confirmed\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 1 |\n\n**Verdict**: WARNING. Fix the contradicting comment before you push. I'd also add the retry test, since it is cheap."

