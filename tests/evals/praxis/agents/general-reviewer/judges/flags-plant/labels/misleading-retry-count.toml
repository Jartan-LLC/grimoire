rst-case wait growing from 1.5s to 7.5s per request, which matters for sync jobs.\nFix: Optionally add that figure to the body.\nStatus: confirmed\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 1 |\n\n**Verdict**: WARNING. Fix the stale comment and add a test for the retry cap before pushing."

