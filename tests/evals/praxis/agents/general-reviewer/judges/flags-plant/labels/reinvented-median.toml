valuates `ordered[-1] + ordered[0]`, which raises `IndexError: list index out of range`.\n   - The caller sees no explanation. `total` returns `Decimal(0)` for the same input, so the two functions behave inconsistently.\n   - Decide what an empty export should return or raise. A clear `ValueError(\"no rows\")` is the likely choice.\n   - This is Minor only because the function is currently unreachable. It becomes a crash on a live path once finding 1 is fixed. Latent.\n   - Status: confirmed.\n\n**Observations, no action needed**\n- The even-count median divides a `Decimal` by 2, which stays exact at the default 28-digit precision. This is fine.\n- `stats.py` imports `parse_rows` from `tally.parse`, and `report.py` does the same. The row-to-Decimal extraction is repeated in both modules, which is acceptable for two uses.\n- The commit message follows Conventional Commits.\n- The docstrings are accurate, and there are no stray comments, debug output or suppressions.\n\nRelevant files:\n- `/tmp/grimoire-eval-pk1g80eb/repo/tally/stats.py`\n- `/tmp/grimoire-eval-pk1g80eb/repo/tally/cli.py`\n- `/tmp/grimoire-eval-pk1g80eb/repo/tests/test_report.py`"

