)` the same way. A second consumer now exists, so this is the time to extract a shared `amounts(text, column)` helper.\n   - Alternatively, put `median_order` in `report.py`. The commit scope is `report`, and the module docstring there, \"Turn rows into totals\", would need widening.\n\n5. **Minor: `/ 2` on `Decimal`.**\n   - Location: `tally/stats.py:14`.\n   - This is correct. The result is subject to the context precision (28 digits) and can have more decimal places than the inputs, for example `1.50` and `2.25` give `1.875`. If the result is reported as money, decide on rounding when you wire it in.\n\nNothing else needs changing. The commit message follows Conventional Commits, there is no debug output or commented-out code, and the docstrings are accurate."

