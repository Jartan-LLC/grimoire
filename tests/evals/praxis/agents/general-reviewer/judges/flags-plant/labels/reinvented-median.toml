text = "I found three problems in `tally/stats.py`, the only file the branch changes. I ran `find-duplicate-comments.js` and it found no retold comments. The commit subject follows Conventional Commits, and there is no debug output or commented-out code.\n\n**[IMPORTANT] The feature is unreachable and the commit message overclaims**\nFile: `tally/stats.py:19`, `tally/cli.py:15`\nIssue: `feat(report): report the median order value` suggests the report shows the median. `median_order` has no caller: `cli.py` still prints only `total(...)`, and `report.py` is unchanged. A user of the tool sees no change. The commit body says Finance compares the median with the mean, but there is no mean either.\nFix: Wire `median_order` into the CLI or report output, or retitle the commit to something like `feat(stats): add median_order`. Use the second option only if the wiring is deliberately left for a follow-up.\nStatus: confirmed\n\n**[IMPORTANT] No tests for new logic**\nFile: `tests/test_report.py` (nothing added for `tally/stats.py`)\nIssue: `_median` has an odd/even branch and an index calculation, and none of it is tested. The existing test file covers only `total`.\nFix: Add `tests/test_stats.py` covering an odd count, an even count (mean of the middle two) and unsorted input. Add the empty-export case once its behavior is decided.\nStatus: confirmed\n\n**[IMPORTANT] Empty export crashes with an unhelpful error**\nFile: `tally/stats.py:11-14`\nIssue: With zero rows, `middle` is 0 and the count is even. The code then reads `ordered[-1]` and `ordered[0]` on an empty list. I ran `median_order(\"amount\\n\")` and it raised `IndexError: list index out of range`. A header-only export is a realistic input, and `total` handles it by returning 0. Nothing documents or tests this behavior. Because `median_order` has no caller yet, the crash is not live today. It will be once the function is wired in.\nFix: Raise a clear `ValueError(\"no rows\")`, or return `None` or `Decimal(0)` to match `total`. Pick one, document it in the docstring and test it. `statistics.median` in the standard library already does this with `StatisticsError`. It also handles `Decimal` values, so you could replace `_median` with it.\nStatus: confirmed\n\n**[MINOR] Reimplements `statistics.median`**\nFile: `tally/stats.py:8-14`\nIssue: `statistics.median` returns the middle value for an odd count and the mean of the two middle values for an even count. It works with `Decimal`, though for an even count it divides by 2 in the value's own type. That is `Decimal`, so precision is the same as here.\nFix: Call `statistics.median` directly and drop the helper.\nStatus: confirmed\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 3 |\n| Minor | 1 |\n\n**Verdict**: WARNING"

