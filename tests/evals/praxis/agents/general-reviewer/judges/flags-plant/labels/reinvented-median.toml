text = "Review of `feature/median-order`: 1 commit not on `main` (7267ccd). It adds `tally/stats.py`, 19 lines. I ran the tests (1 passed) and `find-duplicate-comments.js`, which found nothing retold.\n\n**[IMPORTANT] The median feature is unreachable and untested, so the commit does not deliver what its message says.**\nFile: `/tmp/grimoire-eval-du34spmc/repo/tally/stats.py:19`\nIssue: The commit is titled `feat(report): report the median order value`. But `median_order` has no caller. `tally/cli.py` still prints only `total(...)`, and `tally/report.py` is untouched. The scope `report` also names a module this commit doesn't touch. No test covers `_median` or `median_order`; the only test is `test_total_sums_the_amount_column`.\nFailure scenario: A user runs `tally export.csv` and sees only the total. Finance gets no median, so the stated purpose (comparing median with mean) isn't met. A later edit to `_median` could break the even-count averaging or the empty-input behavior, and nothing would catch it.\nFix: Wire `median_order` into the CLI or report output, and add tests for odd count, even count, and unsorted input. Otherwise retitle the commit to say it only adds a helper.\nStatus: confirmed. The wiring is pending-live rather than provably dead, so I tiered it Important instead of Critical.\n\n**[IMPORTANT] An empty export raises an unhandled `IndexError`.**\nFile: `/tmp/grimoire-eval-du34spmc/repo/tally/stats.py:12-15`\nIssue: With zero rows, `ordered` is empty, so `len % 2` is 0 and the code evaluates `ordered[-1] + ordered[0]`. That raises `IndexError: list index out of range`, which is a confusing error for a normal case. `total` returns 0 for the same input, so the two functions disagree.\nFailure scenario: `median_order(\"sku,amount\\n\")`, a header-only export for a quiet day, crashes with a traceback once the function is wired into the CLI.\nFix: Raise an explicit `ValueError(\"no rows\")`, or decide what the CLI should show for an empty export. Alternatively use `statistics.median`, which raises `StatisticsError` on empty input.\nStatus: confirmed by reading the code. I did not execute it. The path is edge and becomes live once the function is wired in, hence Important.\n\n**[MINOR] `_median` reimplements `statistics.median`.**\nFile: `/tmp/grimoire-eval-du34spmc/repo/tally/stats.py:9-16`\nIssue: The stdlib already has this. It supports `Decimal`, returns the mean of the two middle values for an even count, and raises a clear error on empty input. The hand-rolled version adds code to maintain, and no reason for it is stated.\nFix: Use `statistics.median` and drop `_median`.\nStatus: confirmed.\n\n**[MINOR] Even-count median can return a non-terminating or oddly rounded value.**\nFile: `/tmp/grimoire-eval-du34spmc/repo/tally/stats.py:16`\nIssue: `/ 2` on `Decimal` is exact in most cases, but the result keeps the context precision. For money values this is probably fine. The result can have more decimal places than the inputs, for example 1.50 and 2.25 give 1.875.\nFailure scenario: A report would show 1.875 as an order value.\nFix: If currency output is intended, quantize the result.\nStatus: suspected. Verify what precision finance expects.\n\nComments and docstrings are accurate and not excessive. The commit message follows Conventional Commits.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 2 |\n\n`find-duplicate-comments.js` ran and found no retold comments.\n\n**Verdict**: WARNING"

