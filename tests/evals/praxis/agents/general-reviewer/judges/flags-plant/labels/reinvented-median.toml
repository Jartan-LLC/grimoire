om reading the code, and I did not run it)\n\n[MINOR] Duplicated row extraction\nFile: tally/stats.py:19\nIssue: `[Decimal(row[column]) for row in parse_rows(text)]` repeats the logic in `report.total`. This is the second use, so it is borderline. A third statistic would justify a shared `amounts(text, column)` helper.\nFix: Optional. Extract the helper when a third use appears.\nStatus: confirmed\n\n**Verdict**: WARNING"

