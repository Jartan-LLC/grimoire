dex out of range`. I reproduced it with `median_order(\"amount\\n\")`. `total` returns `Decimal(0)` for the same input, so the two behave inconsistently. Once the CLI is wired up, a header-only export would fail with a traceback.\nFailure scenario: A shop exports a day with no orders. `tally` crashes instead of reporting nothing.\nFix: Handle the empty case explicitly, either by raising `ValueError(\"no rows\")` or by returning a defined value. Test it.\nStatus: confirmed\n\n[MINOR] `_median` is private but sits in the public `stats` module\nFile: `/tmp/grimoire-eval-flm_m2yt/repo/tally/stats.py:8`\nIssue: The stdlib `statistics.median` already does this. It returns the mean of the two middle values, and `Decimal` works with it, though an even count yields `Decimal`. Hand-rolling it re-implements something that already exists, and it needs the empty-input handling above on top.\nFix: Use `statistics.median`, which raises `StatisticsError` on empty input, and handle that case. Check the `Decimal` result for even counts before relying on it.\nStatus: confirmed that the stdlib covers this. Verify the `Decimal` behaviour before switching.\n\n**Summary**\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 3 |\n| Minor | 1 |\n\n**Verdict**: WARNING"

