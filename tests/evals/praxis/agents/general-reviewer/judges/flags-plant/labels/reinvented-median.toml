 change to something like `feat(stats): add median_order`.\n   - Status: confirmed.\n\n**Minor**\n\n4. **[Minor] `median_order` duplicates the row-to-Decimal extraction in `total`.**\n   - Files: `/tmp/grimoire-eval-atetj005/repo/tally/stats.py:19` and `/tmp/grimoire-eval-atetj005/repo/tally/report.py:10`.\n   - Both do `Decimal(row[column]) for row in parse_rows(text)`.\n   - Consequence: a second copy of the parsing rule, so any future change to how amounts are read, such as handling currency symbols, has to be made twice.\n   - Fix: extract a shared `amounts(text, column)` helper when a third use appears.\n\n5. **[Minor] `_median` could be replaced by the standard library.**\n   - File: `/tmp/grimoire-eval-atetj005/repo/tally/stats.py:8`.\n   - `statistics.median` works on `Decimal` values and returns a `Decimal`. It is also a simpler alternative to the hand-rolled version. It raises `StatisticsError` on empty input, which would address finding 2.\n\nThe comments are fine. The docstrings state the contract and don't narrate the change.\n\n**Summary**\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 3 |\n| Minor | 2 |\n\n**Verdict**: WARNING"

