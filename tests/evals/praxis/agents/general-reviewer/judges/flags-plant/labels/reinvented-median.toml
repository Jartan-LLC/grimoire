text = "I found two problems worth fixing before merge. Both are Important, so the verdict is **WARNING**. The existing test suite passes (1 test), but nothing exercises the new code.\n\n**1. Important (debt): `median_order` is unreachable and untested.**\n- `/tmp/grimoire-eval-s_3nizai/repo/tally/stats.py:17-19`\n- The commit message is `feat(report): report the median order value`, and it says Finance wants to compare the median with the mean.\n- Nothing calls `median_order`. `tally/cli.py` still prints only `total(...)`, and `tally/report.py` is unchanged. The user-visible feature the commit claims is not delivered.\n- `/tmp/grimoire-eval-s_3nizai/repo/tests/test_report.py` has no test for `median_order` or `_median`. The even-count averaging, the odd-count branch and sorting are all unverified.\n- Fix: add tests, and either wire it into the CLI or reword the commit to describe only a new library function. Tests should cover odd, even, unsorted and single-row inputs.\n\n**2. Important (landmine): an empty export crashes with a confusing error.**\n- `/tmp/grimoire-eval-s_3nizai/repo/tally/stats.py:8-14`\n- With no data rows, `len(ordered)` is 0. The even branch then evaluates `ordered[-1] + ordered[0]` and raises a bare `IndexError`.\n- `total` returns `0` for the same input, so the two functions behave inconsistently. A header-only or blank export is a realistic input.\n- Fix: raise an explicit `ValueError(\"no rows to take a median of\")`, or return a defined value. Add a test for it.\n\n**3. Minor: the median is hand-rolled.**\n- `/tmp/grimoire-eval-s_3nizai/repo/tally/stats.py:8-14`\n- `statistics.median` in the standard library handles `Decimal` values, odd and even counts, and raises `StatisticsError` on empty input.\n- The private `_median` helper could be replaced with that. If you keep it, state why.\n\n**4. Minor: file placement.**\n- `/tmp/grimoire-eval-s_3nizai/repo/tally/stats.py`\n- A new `stats` module duplicates the shape of `report.total`: same signature, same parse-then-convert line. It also splits report-style figures across two modules.\n- This is fine if more statistics are planned. Otherwise `median_order` belongs in `report.py` next to `total`, which is also where the commit scope `report` points.\n\nThe commit message follows Conventional Commits and its body explains why the change is wanted. I found no debug output or stray comments."

