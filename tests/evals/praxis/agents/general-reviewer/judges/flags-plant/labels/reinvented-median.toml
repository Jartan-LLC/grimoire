text = "Review of `feature/median-order` (1 commit, 6f1b6b3, adds `tally/stats.py`). The existing test suite passes (1 test). Verdict: **WARNING**.\n\n**Important (debt)**\n\n1. `/tmp/grimoire-eval-ox3xr_9p/repo/tally/stats.py:17` \u2013 `median_order` is unreachable and untested.\n   - The commit message says \"report the median order value\", and the scope is `report`. But nothing calls the function. `tally/cli.py` still prints only `total`, and `tally/report.py` is untouched. A grep finds no other references.\n   - The feature Finance asked for is therefore not delivered. Users of the `tally` command see no change.\n   - `tests/test_report.py` has no test for `median_order` or `_median`. The even/odd branch and the index arithmetic carry the logic and are untested.\n   - Fix: wire it into the CLI (or a report function) and add tests for odd count, even count, and unsorted input.\n   - If this is deliberately a first step, the commit should say so. As written, `feat(report)` over-claims.\n\n2. `/tmp/grimoire-eval-ox3xr_9p/repo/tally/stats.py:17-19` \u2013 there is no handling for an empty export.\n   - With zero data rows, `_median([])` computes `ordered[-1] + ordered[0]` on an empty list and raises a bare `IndexError`.\n   - A header-only CSV is a realistic input. The error gives no hint that the export was empty.\n   - Raise a clear `ValueError`, or define the empty result explicitly, and test it.\n\n**Minor**\n\n3. `/tmp/grimoire-eval-ox3xr_9p/repo/tally/stats.py:19` \u2013 the `Decimal(row[column]) for row in parse_rows(text)` extraction duplicates `report.total` (`report.py:9`).\n   - A second consumer is the point where this should be extracted into a shared helper, for example a `column_values(text, column)` function.\n   - Any future change, such as handling currency symbols or blank cells, would otherwise need two edits.\n   - This is tolerable for now.\n\n4. `/tmp/grimoire-eval-ox3xr_9p/repo/tally/stats.py:1,17` \u2013 the module is named `stats` and the function `median_order`, while the existing sibling is `report.total`.\n   - The commit scope says \"report\", but the code lives in a new module.\n   - Consider putting it in `report.py` next to `total`, or explain why a new module is warranted.\n   - The `_median` helper is also redundant with stdlib `statistics.median`, which supports `Decimal` and handles the even-count case.\n   - Using `statistics.median` would remove the hand-rolled helper entirely. It would also remove the need for the first test case. The empty-input error would become `StatisticsError`.\n\n5. `/tmp/grimoire-eval-ox3xr_9p/repo/tally/stats.py:15` \u2013 the `/ 2` on `Decimal` is correct, but the result is subject to the default 28-digit context.\n   - This is fine in practice and noted only for completeness.\n\nThe commit message follows Conventional Commits, and the docstrings are accurate. There are no debug prints, dead code, or suppressions."
