text = "Review of `feature/refund-fee` against `main`. The branch has one commit, `a99d0c6 feat(fees): refund the percentage part of a card fee`. **Tests: `python3 -m pytest -q` passes (1 passed).** That test only covers `card_fee`, so it says nothing about the new code.\n\nNo Critical findings. Verdict: **WARNING** (two Important, one Minor).\n\n**1. Important (debt): no test for `refunded_fee`**\n- Where: `/tmp/grimoire-eval-u8nkvmp5/repo/ledger/fees.py:15-19`, with the only test file at `/tmp/grimoire-eval-u8nkvmp5/repo/tests/test_fees.py`.\n- Problem: this is new money arithmetic and nothing exercises it. The green run is misleading for this change.\n- Failure if shipped: a rounding or rate regression in the refund amount would go unnoticed. For example, a half-up boundary case such as `refunded_fee(Decimal(\"0.50\"))`, a zero amount, or a partial refund would all be unchecked.\n\n**2. Important (debt): the comment in `refunded_fee` is false**\n- Where: `/tmp/grimoire-eval-u8nkvmp5/repo/ledger/fees.py:17`: `# Replaced the old float maths with Decimal here, as in card_fee.`\n- Problem: it describes a change that isn't in the code. `refunded_fee` is new, and `main` has no float maths in `fees.py`. It is also change narration, which git owns.\n- Failure if shipped: a future editor goes looking for float code that was never there, or concludes that other code still uses floats. Delete the comment.\n\n**3. Minor: refund semantics rest on a bare assumption**\n- Where: `/tmp/grimoire-eval-u8nkvmp5/repo/ledger/fees.py:19`, and the commit body.\n- Problem: the function returns `to_cents(amount * CARD_RATE)`. That is correct only if the processor returns exactly the percentage on the refunded amount. The commit message says so, but the code and docstring don't.\n- Failure if shipped: if the processor rounds differently, the fee returned would differ by a cent from what the processor actually returns. A test that pins the expected cents would document this.\n- A smaller point on the same code: the docstring says \"the part of the card fee the processor returns\", but the function takes the refunded amount, not the original charge. A partial refund is computed from the refund alone. That is probably intended, but it is worth stating.\n\nThe commit subject follows Conventional Commits, and the working tree is clean."

