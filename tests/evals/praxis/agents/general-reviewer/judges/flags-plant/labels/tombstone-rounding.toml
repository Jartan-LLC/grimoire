This is inherent to per-call rounding.\nScenario: Whether the processor actually returns these amounts is unconfirmed. It only matters if reconciliation sums partial refunds.\nFix: Confirm the processor's rounding rule and document or test it. No code change is required if it matches.\nStatus: suspected -- verify the processor's refund rounding behavior.\n\n**Verdict**: WARNING\n\nResolve the two Important items before pushing. Neither needs a logic change: delete the comment and add tests. Since the commit isn't pushed, fold both fixes into f902266 with `git commit --amend`. The commit subject follows Conventional Commits.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 1 |"

