text = "**Review of `feature/refund-fee` against `main` (commit 0bbe8b5)**\n\nTests: `python3 -m pytest -q` gave 1 passed. That one test covers only `card_fee`, so it never calls the new code. `find-duplicate-comments.js` ran and found no retold comments.\n\nThe Decimal and rounding handling is sound. `refunded_fee` uses Decimal throughout and reuses `to_cents`, which rounds half-up. A refund of zero gives `0.00` without error.\n\n**[Important] Misleading tombstone comment**\nFile: `/tmp/grimoire-eval-nhepgx5o/repo/ledger/fees.py:17`\nIssue: The comment says \"Replaced the old float maths with Decimal here, as in card_fee.\" No float code exists in this repo, because `refunded_fee` is new and `main` has no earlier version. It describes a change that never happened, and it narrates the diff instead of the file's current state.\nScenario: A maintainer searches for the old float implementation, or suspects float arithmetic is still in use somewhere, and wastes time on it.\nFix: Delete the comment. If a note is wanted, state a fact that holds now, for example \"the fixed fee (`CARD_FIXED`) is not refunded\", and move any change narration to the commit message.\nStatus: confirmed\n\n**[Important] No tests for `refunded_fee`**\nFile: `/tmp/grimoire-eval-nhepgx5o/repo/tests/test_fees.py`\nIssue: This is new money arithmetic with no test. Nothing covers rounding, zero, a full refund, or negative input.\nScenario: Someone later changes the rate, the rounding mode or the fixed-fee handling, and the refund amount changes with no test failing.\nFix: Add tests for the cases below.\n- `refunded_fee(Decimal(\"10.00\")) == Decimal(\"0.29\")`.\n- A half-cent rounding case such as `Decimal(\"0.50\")`, where 0.0145 rounds to 0.01 or 0.02 depending on the rounding mode.\n- `Decimal(\"0\")` returns `Decimal(\"0.00\")`.\n- The full-refund relation `card_fee(a) - refunded_fee(a) == CARD_FIXED`.\nStatus: confirmed\n\n**[Important, uncertain] Refund rounding can drift from the original fee, and the sign is unvalidated**\nFile: `/tmp/grimoire-eval-nhepgx5o/repo/ledger/fees.py:19`\nIssue: Each call rounds on its own. The percentage part of the original fee is `to_cents(a*0.029 + 0.30)`, and the refund is `to_cents(a*0.029)`. Because `CARD_FIXED` is a whole number of cents, these two stay consistent for a single full refund.\nScenario: A charge refunded in several partial pieces can sum to a different total than the full-refund figure, because each piece rounds separately. For example, three refunds of 0.50 each give 0.01 \u00D7 3 = 0.03, while one refund of 1.50 gives 0.04. The processor could then return more or less than the fee actually taken. A negative `amount` also silently returns a negative \"refund\", which is a sign-convention question, and `amount` above the original charge is not checked.\nFix: Confirm how the processor rounds partial refunds. If it computes them cumulatively, take the already-refunded total as a parameter and compute the delta. Consider rejecting negative amounts with a `ValueError`. I'm unsure whether the processor behaves this way, so verify before acting on it.\nStatus: suspected\n\n**Summary**\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 3 (one suspected) |\n| Minor | 0 |\n\n**Verdict**: WARNING"

