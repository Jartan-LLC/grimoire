text = "## Review of `feature/refund-fee` (4712b3c)\n\n**Commit message:**\n```\nfeat(fees): refund the percentage part of a card fee\n\nThe processor returns its percentage on a refund but keeps the fixed part.\n```\nThe message follows Conventional Commits. A new function is correctly typed `feat`, and the scope is fine. The body states the rule the code implements.\n\n`find-duplicate-comments.js` ran and found no retold comments. `python3 -m pytest -q` passes (1 test), but that test does not cover the new function.\n\n### Critical\nNone.\n\n### Important\n\n**1. Misleading tombstone comment**\nFile: `/tmp/grimoire-eval-ysyq7rwj/repo/ledger/fees.py:18`\nIssue: The comment says \"Replaced the old float maths with Decimal here, as in card_fee.\" There is no old float code. `refunded_fee` is new, and `git diff main...HEAD` shows only an addition. The comment narrates a change that never happened, which is both a tombstone and false.\nFailure scenario: A maintainer searches history or the module for the \"old float maths\", or assumes a float-based path still exists elsewhere (for example in a caller or a migration). They waste time on it, or reintroduce float handling to \"match\" it.\nFix: Delete the comment. If a comment is wanted, state the rule that the code can't show: the processor refunds only the percentage part and keeps the fixed `CARD_FIXED`. That rule is already in the commit message.\nStatus: confirmed. Tier: Important, because it is a comment that misleads and describes as present something that is gone.\n\n**2. No test for the new function**\nFile: `/tmp/grimoire-eval-ysyq7rwj/repo/tests/test_fees.py` (no change in the diff)\nIssue: `refunded_fee` is money arithmetic and has no test. The rounding and the \"fixed part is kept\" rule are unverified.\nFailure scenario: Someone later \"simplifies\" the function to `card_fee(amount) - CARD_FIXED`. That gives a different result near rounding boundaries, because it rounds once after adding the fixed fee, and nothing fails. A refund then goes out a cent off.\nFix: Add cases such as `refunded_fee(Decimal(\"100.00\")) == Decimal(\"2.90\")`, a half-cent rounding case, and `refunded_fee(Decimal(\"0\")) == Decimal(\"0.00\")`.\nStatus: confirmed. Tier: Important (missing test on load-bearing money logic).\n\n### Minor\n\n**3. Partial refunds may not sum to the full refund (design question)**\nFile: `/tmp/grimoire-eval-ysyq7rwj/repo/ledger/fees.py:19`\nIssue: Each call rounds half-up independently. For example, three partial refunds of 0.50 each give 3 \u00D7 `to_cents(0.0145)` = 3 \u00D7 0.01 = 0.03, while one 1.50 refund gives `to_cents(0.0435)` = 0.04. The returned fee and the fee originally charged can therefore disagree by cents.\nFailure scenario: An order is refunded in several partial refunds, and the fee returned by the processor differs from the sum the ledger records.\nFix: Confirm that the processor rounds per refund. If it does, add a test that pins this behavior. If it doesn't, compute the refund as a share of the originally charged fee.\nStatus: suspected. Verify the processor's rounding rules, so I have not raised it above Minor.\n\n### Summary\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 1 |\n\n**Verdict**: WARNING"

