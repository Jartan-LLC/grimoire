efunds a charge in many small pieces and returns less fee than it would have for a single refund.\n   - Fix: confirm the intended rounding rule with the owner. Document it, or compute the refund from the cumulative amount.\n   - Status: suspected. I didn't check `to_cents`'s rounding mode or the business rule.\n\nThe commit message follows Conventional Commits.\n\n**Summary**\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 1 |\n\n**Verdict**: WARNING"

