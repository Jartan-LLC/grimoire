rten it and point to the owner, for example `# Item.updated is tz-aware UTC (see models.Item)`. Alternatively, drop it.\nStatus: confirmed\n\n**[MINOR] `STALE_AFTER` is a public module constant with no consumer outside `stale_skus`**\nFile: `stockroom/api.py:8`\nIssue: The constant is hard-wired. A caller cannot choose a different threshold.\nConsequence: None today. This is an acceptable named constant.\nStatus: confirmed\n\n**Checked and fine**\n- The `now - item.updated > STALE_AFTER` comparison is correct, because both sides are tz-aware UTC.\n- The walrus filter handles unknown SKUs by skipping them.\n- Input order is preserved.\n- The `datetime.UTC` import works on Python 3.12.\n- The commit message follows Conventional Commits.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 2 |\n\n**Verdict**: WARNING"

