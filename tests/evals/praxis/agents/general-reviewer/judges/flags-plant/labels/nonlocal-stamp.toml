is tz-aware UTC (see models.Item)\". Or make `Item.updated` carry the guarantee.\nStatus: confirmed\n\n[MINOR] Parameter and function names\nFile: `stockroom/api.py:15`\nIssue: `sku_list` repeats its type in the name. `skus` is simpler. Also, `stale_skus` takes no clock parameter, so tests have to patch `datetime`.\nFix: Rename to `skus`. Optionally take `now: datetime | None = None`.\nStatus: confirmed\n\nThe commit message follows Conventional Commits. `STALE_AFTER` is a named constant, so the 24h value has no magic number. Nothing is left in as debug output or commented-out code.\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 2 |\n| Minor | 2 |\n\n**Verdict**: WARNING"

