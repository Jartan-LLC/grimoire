hanged quantity. `\"a\"` never appears as stale, even though its level has not changed in days.\nFix: reword to \"not updated for STALE_AFTER\" (this matches the commit message), or track real changes in the store.\nStatus: confirmed\n\n**Summary**\n\n| Severity | Count |\n|----------|-------|\n| Critical | 0 |\n| Important | 1 |\n| Minor | 2 |\n\n`find-duplicate-comments.js` ran and found nothing.\n\n**Verdict**: WARNING"

