# Whether praxis:general-reviewer reports a problem planted in a branch, at the tier its rules
# give, and keeps quiet on a clean change. The rules the cases plant come from the fixes that
# shaped the agent: misleading, stale, retold and nonlocal comments (#88, #126), tombstones
# (#21), and the code-hygiene items its focus list names, beside plain correctness bugs, its
# main job. tests/evals/README.md says how the suite is run.
# What it can see: on its baselines, cutting the agent's body breaks the report's format but
# changes few findings, which come from the preloaded skills, so a change that weakens
# detection shows on only a few cases (#144). Not calibrated yet: no A/A screens or positive
# control have run on it, and it has no confirm split, so at tier 4 a change it covers needs
# confirm cases first. Read a screen as a sign, not a gate.
target = "praxis:general-reviewer"
# Cases moved off a held-out split, each with its reason in a comment.
BURNED = []
# A change to a skill the agent preloads reaches the suite only as an indirect check: its `none`
# arm removes the agent, not the skill, so its power report does not measure a skill change.
covers = ["plugins/praxis/agents/general-reviewer.md"]
# The agent runs on the model its frontmatter pins (Sonnet); `models` sets the main thread that
# dispatches it and relays its report.
models = ["claude-opus-5-5"]
budget_usd = 3.0

[[metric]]
id = "found"
direction = "higher"
margin = 0.2
# The flags-plant judge: whether the report raises the planted problem at the rating its case
# accepts. It gates while judges/flags-plant/stamp.toml is current; a change to the judge, its
# labels or a stamped case's reference makes the stamp stale and the lint fail:
# tests/evals/README.md, "Calibrating a judge", step 6.

[[metric]]
id = "found_regex"
direction = "higher"
# Reported only: a label at the planted problem's tier or above, then a term naming that problem
# in the same finding. Kept beside the judged `found` until one screen compares the two (#137).

[[metric]]
id = "quiet"
direction = "higher"
# Reported only, from the clean controls: no Critical or Important finding. Too few units to guard.

[[metric]]
id = "format"
direction = "higher"
margin = 0.2

# One yes/no question per planted case, with the case's reference. tests/evals/README.md, Judges.
[[judge]]
id = "flags-plant"
question = "Does the report raise, as a finding of its own, the problem the reference describes, at a rating the reference accepts?"
# Calibration: the cases whose items are held out (split by case, from the #137 research), never
# moved out by hand, since the stamp does not record this list (README, "Calibrating a judge");
held_out = [
  "nonlocal-parse",
  "reinvented-batched",
  "retold-utc",
  "nonlocal-backoff",
  "bug-page-slice",
  "bug-unknown-sku",
  "gone-fallback",
  "stub-iban-check",
  "tombstone-rounding",
  "broken-import",
]
# the rule families, by the skill whose rule the plant breaks (comment-hygiene, code-hygiene,
# correctness), within which a report of one case is a "no" for another's reference;
siblings = [
  [
    "nonlocal-parse",
    "nonlocal-backoff",
    "nonlocal-stamp",
    "retold-utc",
    "retold-refund-fee",
    "gone-fallback",
    "misleading-retry-count",
    "tombstone-rounding",
    "unanchored-todo",
  ],
  [
    "reinvented-batched",
    "reinvented-median",
    "copied-backoff",
    "blanket-suppression",
    "leftover-debug",
    "stub-iban-check",
  ],
  [
    "bug-page-slice",
    "bug-unknown-sku",
    "bug-500-not-retried",
    "bug-discount-precedence",
    "broken-import",
  ],
]
# the ratings a silver "yes" needs, unless a case's check sets its own; the metric it would replace.
yes_ratings = ["Critical", "Important"]
compare = "found_regex"

[pass_rule]
primary = "found"
rule = "no-regression"
guards = ["format"]
min_effect = 0.4  # read only under a `better` rule
min_samples = 3
