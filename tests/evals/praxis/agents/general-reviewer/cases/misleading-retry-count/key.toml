[[check]]
metric = "found_regex"
artifact = "report:praxis:general-reviewer"
present = '''(?ims)(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important)\b(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b).){0,1500}?(?:\bthree\b|contradict|stale|out of date)'''

[[check]]
metric = "found"
artifact = "report:praxis:general-reviewer"
judge = "flags-plant"
reference = """
fetchkit/retry.py raises MAX_ATTEMPTS to 5 and adds the comment `# Give up after three attempts,
so a dead host fails fast.`, which the code contradicts. Only a finding about that wrong comment
counts. Count it only when the report rates it Important or Critical.
"""

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)verdict\W{0,6}(approve|warning|block)\b'''

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)^\|\s*critical\s*\|\s*\d+'''

