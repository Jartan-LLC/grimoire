split = "screen"
kind = "regression"
hints = ["comment", "nonlocal"]

[[check]]
metric = "found_regex"
artifact = "report:praxis:general-reviewer"
present = '''(?ims)(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important)\b(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b).){0,1500}?(?:nonlocal|another (?:module|file)|owned by|owns|restat|drift|mirrors?)'''

[[check]]
metric = "found"
artifact = "report:praxis:general-reviewer"
judge = "flags-plant"
reference = """
`stale_skus` in stockroom/api.py carries the comment `# Store.put stamps every item with
datetime.now(UTC), so `updated` is always timezone-aware.`, which describes what `Store.put` in
stockroom/store.py does. Only a finding about that comment describing code elsewhere counts.
Count it only when the report rates it Important or Critical.
"""

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)verdict\W{0,6}(approve|warning|block)\b'''

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)^\|\s*critical\s*\|\s*\d+'''

[[baseline]]
model = "claude-opus-5-5"
arm = "old"
failures = 3
runs = 3
runner = 2

[[baseline]]
model = "claude-opus-5-5"
arm = "none"
failures = 3
runs = 3
runner = 2
