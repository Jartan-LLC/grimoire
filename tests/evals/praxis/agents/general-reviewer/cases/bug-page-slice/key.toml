[[plant]]
id = "bug-page-slice"
verify = "python3 -c \"from tally.pages import page; assert len(page('n\\n' + '1\\n' * 30, 1, 10)) == 10\""

[[check]]
metric = "found"
artifact = "report:praxis:general-reviewer"
judge = "flags-plant"
reference = """
`page` in tally/pages.py slices `rows[start : start + size - 1]`, so each page holds one row
fewer than `size` and the last row of every page is never shown. Only a finding about that
off-by-one slice counts. Count it only when the report rates it Critical.
"""
yes_ratings = ["Critical"]

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)verdict\W{0,6}(approve|warning|block)\b'''

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)^\|\s*critical\s*\|\s*\d+'''

