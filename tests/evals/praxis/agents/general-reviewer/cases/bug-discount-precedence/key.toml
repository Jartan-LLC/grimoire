`line_total` in ledger/lines.py computes `unit_price - unit_discount * quantity`: it charges for
one unit and subtracts the discount of every unit, where the docstring wants `(unit_price -
unit_discount) * quantity`. Only a finding about that wrong line total counts. Count it only
when the report rates it Critical.
"""
