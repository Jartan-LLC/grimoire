split = "screen"
kind = "regression"
hints = ["comment", "stale", "cache"]

[[check]]
metric = "found_regex"
artifact = "report:praxis:general-reviewer"
present = '''(?ims)(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important)\b(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b).){0,1500}?(?:fallback|last good|no longer|stale|left ?over)'''

[[check]]
metric = "found"
artifact = "report:praxis:general-reviewer"
judge = "flags-plant"
reference = """
The branch drops the response cache from fetchkit/client.py but keeps the comment `# When every
attempt fails, serve the last good response for this URL instead.`, which the code no longer
does. Only a finding about that stale comment counts. Count it only when the report rates it
Important or Critical.
"""

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)verdict\W{0,6}(approve|warning|block)\b'''

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)^\|\s*critical\s*\|\s*\d+'''

[[baseline]]
model = "claude-opus-5-5"
arm = "old"
failures = 0
runs = 6
runner = 2

