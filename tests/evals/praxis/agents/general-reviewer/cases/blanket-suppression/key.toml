split = "screen"
kind = "regression"
hints = ["suppress", "mypy", "type"]

[[check]]
metric = "found_regex"
artifact = "report:praxis:general-reviewer"
present = '''(?ims)(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important)\b(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b).){0,1500}?(?:ignore-errors|mypy|suppress)'''

[[check]]
metric = "found"
artifact = "report:praxis:general-reviewer"
judge = "flags-plant"
reference = """
The branch adds `# mypy: ignore-errors` as the first line of stockroom/store.py, which silences
every type error in the whole module, beside a new `put_many` without type annotations. Only a
finding whose subject is that file-wide suppression counts; one about the missing annotations
alone does not. Count it only when the report rates it Important or Critical.
"""

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)verdict\W{0,6}(approve|warning|block)\b'''

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)^\|\s*critical\s*\|\s*\d+'''

[[baseline]]
model = "claude-opus-5-5"
arm = "old"
failures = 0
runs = 3
runner = 2

