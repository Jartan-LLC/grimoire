split = "screen"
kind = "regression"
hints = ["duplicate", "copy", "with_retries"]

[[check]]
metric = "found_regex"
artifact = "report:praxis:general-reviewer"
present = '''(?im)(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important)\b[^\n]*?(?:\bcop(?:y|ies|ied)\b|\bduplicate[ds]?\b|duplication)|(?s:^[ \t>#*\-\d.]*(?:finding[ \t]*\d*[ \t]*[:(]?[ \t]*)?\[?[ \t]*(?:critical|important)\b(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b).){0,1500}?^[ \t]*\d+[.)][^\n]*?(?:\bcop(?:y|ies|ied)\b|\bduplicate[ds]?\b|duplication))'''

[[check]]
metric = "found"
artifact = "report:praxis:general-reviewer"
judge = "flags-plant"
reference = """
`poll` in fetchkit/poll.py copies the retry loop of `with_retries` in fetchkit/retry.py: the
same MAX_ATTEMPTS and BASE_DELAY_S constants and the same exponential backoff, written again
instead of reused. Only a finding whose subject is that duplication counts. Count it only when
the report rates it Important or Critical.
"""

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)verdict\W{0,6}(approve|warning|block)\b'''

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
present = '''(?im)^\|\s*critical\s*\|\s*\d+'''

[[baseline]]
model = "claude-opus-5-5"
arm = "old"
failures = 2
runs = 6
runner = 2

[[baseline]]
model = "claude-opus-5-5"
arm = "none"
failures = 4
runs = 6
runner = 2
