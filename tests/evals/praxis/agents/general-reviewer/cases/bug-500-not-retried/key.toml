[[plant]]
id = "bug-500-not-retried"
verify = "python3 -c \"from fetchkit.retry import with_retries; from fetchkit.transport import Response; r=iter([Response(500, ''), Response(200, 'ok')]); assert with_retries(lambda: next(r), sleep=lambda s: None).ok\""

[[check]]
metric = "found"
artifact = "report:praxis:general-reviewer"
judge = "flags-plant"
reference = """
`_transient` in fetchkit/retry.py tests `response.status > 500`, so a 500 response is no longer
retried, though the docstring promises a retry for every 5xx. Only a finding about 500 falling
outside that comparison counts. Count it only when the report rates it Critical.
"""
yes_ratings = ["Critical"]

[[check]]
metric = "format"
artifact = "report:praxis:general-reviewer"
