# Whether praxis:doc-reviewer rates, in a doc for people, a case the program handles on its own as
# plain-writing says (#182): one in the main path is Bloat, rated Important, and one left out is no
# finding. Lean cases pair a lean doc with code whose fix commits handled rare cases (rebuilt from
# claude-sync #49, enchantments #103, grimoire #97 and #170 and scaffold #275, or invented on the
# same pattern); bloat cases give the doc as those fix commits grew it. Guards: the reviewer still
# catches the wrong fact planted in each lean and bloat doc and a wrong default, a dead link and a
# wrong flag in the cost cases, and leaves alone a troubleshooting part at the end and the
# prerequisite and recovery lines of lean-backup, lean-merge and lean-dotlink. Must hold: it still
# raises a missing data-loss warning. The gain is graded by a blind panel (under [pass_rule]).
# tests/evals/README.md says how the suite is run. No baselines yet: until `make eval-run ...
# RECORD=1` draws them, every case is committed as a regression case.
target = "praxis:doc-reviewer"
# Cases moved off a held-out split, each with its reason in a comment.
BURNED = [
  # An Opus screen for PR 200 spent these, and its regex checks misgraded some of their samples.
  "bloat-envcheck",
  "bloat-logrot",
  "bloat-pdfjoin",
  "bloat-release",
  "bloat-walkaway",
  "cost-deadlink",
  "harm-mirror",
  "lean-cronlite",
  "lean-gitstat",
  "lean-imgshrink",
  "lean-limits",
  "lean-merge",
  "lean-ratchet-sync",
  "lean-watch",
  "troubleshoot-ok",
]
# The agent preloads plain-writing, which holds the rule; `none` cuts the agent's body only, so a
# positive control for the rule is a copy of plain-writing without it, screened as `new`.
covers = [
  "plugins/praxis/agents/doc-reviewer.md",
  "plugins/praxis/skills/docs-patterns/references/readme.md",
]
# The agent runs on the model its frontmatter pins (Sonnet); `models` sets the main thread that
# dispatches it and relays its report.
models = ["claude-opus-5-5"]
budget_usd = 3.0

[[metric]]
id = "rare"
direction = "higher"
# Reported only: whether the report keeps to the rule is the blind panel's question, not this
# regex's. Lean cases: no finding that names the doc (by path, by file name, a README as "README",
# or as "the docs") asks to add a rare case ("leaves out", "add a line", "add the", "should also
# say", "include one", "note in"), so a finding on a commit or the code that only sits near a
# rare-case word and an ask word does not count, nor does an ask to add code, a check or tests, or
# one whose fix line asks only for a pointer to the full list or for a partial list to say it is
# partial. Bloat cases: a Critical or Important finding rates the rare passage as Bloat or asks to
# cut it, with a Bloat word or a cut aimed at doc text ("drop the claim", "cut the bullet", "delete
# all three") within 250 characters of a rare-case word, or a fix line that cuts after one, the cut
# anywhere on that line unless negated, or a cut whose object names the rare case ("drop the
# zero-padding detail"), so a finding on the passage's accuracy alone does not count, and one whose
# fix offers a cut as one option does. A rare-case word names the rare case only, never text the
# main path shares ("EXIF" where every file loses its EXIF, "unknown" in "an unknown option"), and
# a space in one also matches a hyphen ("dev-container"). No lean check counts a case that makes a
# sentence the change wrote false ("every JPEG" with a 100 MB skip, "local time" with a UTC
# fallback): asking to fix that sentence is right, though not required. Nor does one count a line
# that explains output the reader sees (an `unknown` row), an ask the owner ruled borderline. In
# every check, a finding's text runs to the next rating, heading, table row, verdict line, bold
# numbered item (`**2.`) or line that is only a bold label (`**Commit messages**`, not a field such
# as `**Suggested text:**`); a bold line that ends in its rating (`**4. RELEASING.md:12 -
# Important**`) starts its finding at its first `**`, and a bold numbered item under a heading that
# names a rating takes that rating. So a note inside a finding that says a rare case was left out
# on purpose counts as asking to add it; a note under its own heading does not.

[[metric]]
id = "kept"
direction = "higher"
margin = 0.2
# The wrong fact planted in each lean and bloat doc, and the cost cases' wrong default, dead link
# and wrong flag, raised at Important or above; no Critical or Important finding that rates a
# troubleshooting part at the end as Bloat or asks to cut it, so one that asks to verify or move it
# passes; in lean-backup, lean-merge and lean-dotlink, no finding that rates the doc's prerequisite
# or recovery as Bloat or asks to cut it, at any rating, as `rare` counts an ask to add at any
# rating, because a fix round applies a Minor finding too. Each pattern is the planted error's own
# wording, and a stated value is not read from a line number, so a Bloat finding that does not
# raise the error fails; a failing reference per case holds one. A word for the prerequisite or
# recovery names only that line, never the planted error (`.bak`) or a rare case (an existing
# `<file>.orig` that is never overwritten).

[[metric]]
id = "harm"
direction = "higher"
must_hold = true
# A missing data-loss warning raised at Critical or Important: a finding whose text holds a warning
# word ("warn", "undone", "irreversible", "data loss", "permanently" and a few more). A Bloat
# finding that does not raise the warning fails; a failing reference per case holds one. The
# regex is only a first filter, as in plain-writing's suite: a reader checks every `new` sample of
# these cases, pass or fail, because a finding that says the flag deletes data in other words fails
# it, and an Important finding on another subject that holds a warning word passes it. A missing
# warning the regex passed counts as a must-hold failure, so the run is HURT; a raised warning the
# regex failed marks the case broken.

[[metric]]
id = "format"
direction = "higher"
margin = 0.2

[pass_rule]
# The regex rule holds the guards only: `kept` (the primary, as the rule needs one) and `format`
# are tested for non-inferiority, and `harm` holds on its own. The gain is graded by a blind panel
# of three agents, who see neither the arm nor the model, each labelling every report right,
# over-cuts, under-cuts or misses-error against panel-specs.md, two of three deciding. A change to
# doc-reviewer goes ahead when the screen and confirm SHIP and, on each gate model, new has more
# right reports than old, with no significance bar beyond "more", and loses no planted error or
# harm warning old raises; its PR reports the panel's labels per model and arm. panel-specs.md
# covers the screen and confirm cases and the dev cases in `BURNED`: a held-out case added later
# gets its spec written the same way before grading, from its prompt, fixture, build.py and the
# rule, never from its key or a sample.
primary = "kept"
rule = "no-regression"
guards = ["format"]
min_samples = 3
