# A candidate target case: committed as a regression case until an old baseline fails it
# (tests/evals/README.md, "Choosing cases" step 2), then retagged kind = "target".
# A README whose fix commits' rare cases sit in its usage section (invented on bloat-pdfjoin's pattern).
split = "screen"
kind = "regression"
hints = []

[[plant]]
id = "wrong-fact"
verify = "python3 -c \"import pathlib,sys; sys.exit('`deu`' in pathlib.Path('README.md').read_text())\""

