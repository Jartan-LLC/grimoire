# Rare recovery in a troubleshooting part at the end is where it belongs: no Critical or Important
# finding rates it Bloat or asks to cut it. A cut or a passage the finding places in the script, a
# comment or the commit message does not count, nor does a cut of "it" on a fix line that names
# one of them first.
split = "screen"
kind = "regression"
hints = []

