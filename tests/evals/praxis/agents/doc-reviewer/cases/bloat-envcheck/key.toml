present = '''(?ims)(?:(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important)\b|^[ \t]*#{1,6}[ \t][^\n]*?\b(?:critical|important)\b[^\n]*\n(?:(?!^[ \t]*#{1,6}[ \t])[\s\S])*?^[ \t]*\*\*\d+\.)(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b|^[ \t]*(?:#{1,6}[ \t]|\||\**verdict|\*\*\d+\.)).){0,1500}?(?:(?:\bbloat\w*|\bunnecessary\b|\bnot needed\b|\bneedless\b|\bredundant\b|\bsuperfluous\b|\bneeds no line\b|\b(?:can|could|should) go\b|\b(?:cut|remove|drop|delete|trim)\s+(?:(?:the|this|that|these|those|both|all)\s+(?:[\w`'\"-]+\s+){0,3}?(?:sentences?|lines?|clauses?|passages?|paragraphs?|claims?|details?|text|part|section|mentions?)\b))(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b|^[ \t]*(?:#{1,6}[ \t]|\||\**verdict|\*\*\d+\.)).){0,250}(?:byte order mark|\bBOM\b|CRLF|defined twice|containing spaces)|(?:byte order mark|\bBOM\b|CRLF|defined twice|containing spaces)(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b|^[ \t]*(?:#{1,6}[ \t]|\||\**verdict|\*\*\d+\.)).){0,250}(?:\bbloat\w*|\bunnecessary\b|\bnot needed\b|\bneedless\b|\bredundant\b|\bsuperfluous\b|\bneeds no line\b|\b(?:can|could|should) go\b|\b(?:cut|remove|drop|delete|trim)\s+(?:(?:the|this|that|these|those|both|all)\s+(?:[\w`'\"-]+\s+){0,3}?(?:sentences?|lines?|clauses?|passages?|paragraphs?|claims?|details?|text|part|section|mentions?)\b))|(?:byte order mark|\bBOM\b|CRLF|defined twice|containing spaces)(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b|^[ \t]*(?:#{1,6}[ \t]|\||\**verdict|\*\*\d+\.)).){0,1500}?fix\W{0,6}(?:cut|remove|drop|delete)\s+(?:(?:it|them|both)\b|(?:the|this|that|these|those|both)\s+(?:[\w`'\"-]+\s+)?(?:sentences?|lines?|clauses?|passages?|paragraphs?)\b)|\b(?:cut|remove|drop|delete|trim)\s+(?:the|this|that|these|those|both|all)\s+[^\n.]{0,40}?(?:byte order mark|\bBOM\b|CRLF|defined twice|containing spaces))'''

