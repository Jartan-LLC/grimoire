# Rare recovery in a troubleshooting part at the end is where it belongs: no Critical or Important
# finding rates it Bloat or asks to cut it. The script's header comment repeats that part word for
# word, so a cut aimed at the script's copy does not count: a cut or a passage the finding places
# in the script, its header or a comment ("cut the ENOSPC lines from the script header"), or a
# cut of "it" on a fix line that names one of them first.
split = "dev"
kind = "regression"
hints = []

[[check]]
metric = "kept"
