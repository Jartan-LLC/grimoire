# A candidate target case: committed as a regression case until an old baseline fails it
# (tests/evals/README.md, "Choosing cases" step 2), then retagged kind = "target".
# A README that names a command's main limits and points to the command for the rest (invented on lean-limits' pattern, from grimoire #170): asking it to add the rare limits is the failure.
split = "screen"
kind = "regression"
hints = []

[[plant]]
id = "wrong-fact"
verify = "python3 -c \"import pathlib,sys; sys.exit('at most 25 issues' in pathlib.Path('README.md').read_text())\""

