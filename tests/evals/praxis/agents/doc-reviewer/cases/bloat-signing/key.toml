# A candidate target case: committed as a regression case until an old baseline fails it
# (tests/evals/README.md, "Choosing cases" step 2), then retagged kind = "target".
# The key-rotation page as scaffold #275 grew it.
split = "confirm"
kind = "regression"
hints = []

[[plant]]
id = "wrong-fact"
verify = "python3 -c \"import pathlib,sys; sys.exit('rpm --import keys/acme.asc' in pathlib.Path('docs/signing-key.md').read_text())\""

