# The watch how-to with its inotify, vim and network-drive cases in the main path.
split = "confirm"
kind = "regression"
hints = []

[[plant]]
id = "wrong-fact"
verify = "python3 -c \"import pathlib,sys; sys.exit('Stop it with Ctrl-D.' in pathlib.Path('docs/watch.md').read_text())\""

