# A candidate target case: committed as a regression case until an old baseline fails it
# (tests/evals/README.md, "Choosing cases" step 2), then retagged kind = "target".
# A lean README for a merge with rare cases (enchantments #103).
# A needed line: a finding of any rating that rates the doc's recovery (copy
# `settings.json.pre-dotmerge` back to undo the merge) as Bloat, or asks to cut it, fails `kept`.
split = "dev"
kind = "regression"
hints = []

[[plant]]
id = "wrong-fact"
verify = "python3 -c \"import pathlib,sys; sys.exit(\\\"The team's values win\\\" in pathlib.Path('src/dotmerge/README.md').read_text())\""

