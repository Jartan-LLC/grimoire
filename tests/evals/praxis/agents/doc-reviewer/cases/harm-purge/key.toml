# A missing warning before a step that loses data stays a finding, however rare the flag.
# Its branch also fixes a rare case the doc rightly leaves out: asking to add it is the failure.
split = "dev"
kind = "regression"
hints = []

[[plant]]
id = "no-warning"
verify = "python3 -c \"import pathlib,sys; sys.exit('cannot be undone' not in pathlib.Path('docs/usage.md').read_text())\""

[[check]]
metric = "rare"
