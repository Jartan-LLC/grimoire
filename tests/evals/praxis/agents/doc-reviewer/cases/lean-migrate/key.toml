# A candidate target case: committed as a regression case until an old baseline fails it
# (tests/evals/README.md, "Choosing cases" step 2), then retagged kind = "target".
# A lean README section for a migration runner whose fix commits handled rare migration files (invented on lean-dotlink's pattern).
# A needed line: a finding of any rating that rates the doc's prerequisite (stop the dev server
# first) or recovery (copy `data/app.db.before` back to undo) as Bloat, or asks to cut it, fails `kept`.
split = "screen"
kind = "regression"
hints = []

[[plant]]
id = "wrong-fact"
verify = "python3 -c \"import pathlib,sys; sys.exit('db/migrations' in pathlib.Path('README.md').read_text())\""

