# A candidate target case: committed as a regression case until an old baseline fails it
# (tests/evals/README.md, "Choosing cases" step 2), then retagged kind = "target".
# The same doc with the rare cases its fix commits handled in the main path.
split = "confirm"
kind = "regression"
hints = []

[[plant]]
id = "wrong-fact"
verify = "python3 -c \"import pathlib,sys; sys.exit('`--since 2026-01-01`' in pathlib.Path('docs/authors.md').read_text())\""

[[check]]
metric = "rare"
artifact = "report:praxis:doc-reviewer"
present = '''(?ims)(?:(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important)\b|^[ \t]*#{1,6}[ \t][^\n]*?\b(?:critical|important)\b[^\n]*\n(?:(?!^[ \t]*#{1,6}[ \t])[\s\S])*?^[ \t]*\*\*\d+\.)(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b|^[ \t]*(?:#{1,6}[ \t]|\||\**verdict|\*\*\d+\.)).){0,1500}?(?:mailmap|only in case|case.insensitive|shallow|unknown|no author email)'''

[[check]]
metric = "format"
artifact = "report:praxis:doc-reviewer"
present = '''(?im)verdict\W{0,6}(approve|warning|block)\b'''

[[check]]
metric = "format"
artifact = "report:praxis:doc-reviewer"
present = '''(?im)^\|\s*critical\s*\|\s*\d+'''

[[check]]
metric = "kept"
artifact = "report:praxis:doc-reviewer"
present = '''(?ims)(?:(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important)\b|^[ \t]*#{1,6}[ \t][^\n]*?\b(?:critical|important)\b[^\n]*\n(?:(?!^[ \t]*#{1,6}[ \t])[\s\S])*?^[ \t]*\*\*\d+\.)(?:(?!(?:\[|\*\*|\(|[:\u2013\u2014][ \t]*|[ \t]-[ \t]+|^[ \t>#*\-\d.]*)[ \t]*\[?[ \t]*(?:critical|important|minor)\b|^[ \t]*(?:#{1,6}[ \t]|\||\**verdict|\*\*\d+\.)).){0,1500}?(?:--since|--after)'''
