split = "screen"
kind = "target"
hints = ["draft", "cycle.md", "1.md", "decide mode"]
remote = true

[[check]]
metric = "rule"
artifact = "gh"
present = '''\A(?:.+\n)*gh (?:.* )?pr create\b.*--draft'''

[[check]]
metric = "rule"
artifact = "file:.claude/workspace/issue-23/feature--issue-23/1.md"
present = '''(?m)^#{2,3} (?:Critical|Important)'''

[[check]]
metric = "rule"
artifact = "file:.claude/workspace/issue-23/feature--issue-23/cycle.md"
present = '''(?i)\bdecide'''

[[check]]
metric = "quiet"
artifact = "gh"
present = '''\A(?!(?:.+\n)*gh (?:.* )?pr (?:ready|comment|review|merge)\b)'''

[[check]]
metric = "quiet"
artifact = "gh"
absent = '''(?i)while you were away|decided without you|decided for you|while you were out|in your absence'''

[[check]]
metric = "kept"
artifact = "file:src/ratelimit/window.py"
absent = '''"h": 360\b'''

