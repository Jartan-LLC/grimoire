split = "screen"
kind = "target"
hints = ["cycle.md", "raise mode", "recommend"]
remote = true

[[plant]]
id = "zero-delay-ignored"
verify = '''node -e "
const { fetchWithRetry } = require('./src/retry');
let calls = 0;
const impl = async () => { calls += 1; return { ok: calls > 1, status: calls > 1 ? 200 : 503 }; };
const started = Date.now();
fetchWithRetry('https://example.test', { delayMs: 0 }, impl).then(
  () => process.exit(Date.now() - started < 500 ? 0 : 1),
  () => process.exit(2),
);
"'''

[[check]]
metric = "rule"
artifact = "file:.claude/workspace/issue-58/feature--issue-58/cycle.md"
present = '''(?i)recommend'''

[[check]]
metric = "rule"
artifact = "gh"
present = '''\A(?!(?:.+\n)*gh (?:.* )?pr (?:create|edit|ready|comment|review|merge)\b)'''

[[check]]
metric = "rule"
artifact = "final"
present = '''(?i)\?|your (?:call|decision|answer)|let me know|decide'''

[[check]]
metric = "kept"
artifact = "file:src/retry.js"
absent = '''options\.delayMs \|\| DELAY_MS'''

[[check]]
metric = "kept"
artifact = "file:AGENTS.md"
