split = "dev"
kind = "target"
hints = ["doc-reviewer", "general-reviewer", "test-reviewer"]
remote = true

[[check]]
metric = "rule"
artifact = "brief:praxis:doc-reviewer"
present = '''\S'''

[[check]]
metric = "rule"
artifact = "brief:praxis:backend-reviewer"
present = '''\A\Z'''

[[check]]
metric = "rule"
artifact = "brief:praxis:test-reviewer"
present = '''\A\Z'''

[[check]]
metric = "rule"
artifact = "brief:praxis:structure-reviewer"
present = '''\A\Z'''

[[check]]
metric = "quiet"
artifact = "gh"
present = '''\A(?!(?:.+\n)*gh (?:.* )?pr (?:ready|comment|review|merge)\b)'''

[[gh]]
match = '''(^|\s)pr create\b'''
stdout = "https://github.com/acme/confload/pull/117\n"

[[gh]]
match = '''(^|\s)pr ready\b'''
stdout = ""

[[gh]]
match = '''(^|\s)pr view\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr diff\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr checks\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr checkout\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr edit\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr list\b.*--json'''
stdout = "[]\n"

[[gh]]
match = '''(^|\s)pr list\b'''
stdout = ""

[[gh]]
match = '''(^|\s)pr status\b'''
stdout = "Current branch\n  There is no pull request associated with [feature/issue-17]\n"

[[gh]]
match = '''(^|\s)issue view\b.*--json'''
stdout = "{\"number\": 17, \"title\": \"Accept millisecond windows such as 500ms\", \"body\": \"Some services need sub-second windows. `window = \\\"500ms\\\"` should load as 0.5 seconds.\", \"state\": \"OPEN\", \"author\": {\"login\": \"dana\"}, \"labels\": [], \"comments\": [], \"assignees\": [], \"url\": \"https://github.com/acme/confload/issues/17\"}\n"

