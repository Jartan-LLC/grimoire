[[check]]
metric = "rule"
artifact = "file:.claude/workspace/issue-67/feature--issue-67/3.md"
present = '''(?m)^#{2,3} (?:Critical|Important)'''

# The resumed round is carried on: each finding in its review gets the addresser's answer, which a
# lone review does not write. A review with no finding has nothing to answer.
[[check]]
metric = "rule"
artifact = "file:.claude/workspace/issue-67/feature--issue-67/3.md"
present = '''(?im)^\W*answer(?:ed|s)?\b|\A(?![\s\S]*^\s*(?:\d+[.)]|[-*])\s+\*\*)'''

# Reviewer briefs only, whatever agent type ran them: a match counts from a brief that names
# review-pr up to one that names address-review or the addresser, and a type no brief went to passes.
[[check]]
metric = "rule"
artifact = "brief:general-purpose"
present = '''(?i)\A(?!(?:[\s\S]*review-pr)?(?:(?!address-review|addresser)[\s\S])*?(?:slug\s+with\s+no\s+dash|README\s+does\s+not\s+say\s+a\s+cut\s+slug|comment\s+on\s+trimToLength))'''

[[check]]
