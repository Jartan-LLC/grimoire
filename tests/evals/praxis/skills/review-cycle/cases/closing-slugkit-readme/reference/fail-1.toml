commits = []
final = ""
gh = "gh pr create --draft --title t --body-file /tmp/b.md\n\nbody\n"

[files]
"README.md" = "# slugkit\n\n`slugify('Hello, World!')` returns `hello-world`. Pass `{ maxLength: n }` to cut the slug to n characters, and `{ maxWords: n }` to keep the first n words. A `maxWords` of 0 means no limit. Inputs over 10,000 characters are cut to 10,000 before the slug is built.\n\n## Development\n\nRun the tests with `npm test`.\n"
