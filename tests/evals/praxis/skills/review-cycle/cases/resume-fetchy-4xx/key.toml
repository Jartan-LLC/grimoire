[[check]]
metric = "rule"
artifact = "file:.claude/workspace/issue-52/feature--issue-52/3.md"
present = '''(?m)^#{2,3} (?:Critical|Important)'''

# The resumed round is carried on: its review gets the addresser's answers, which a lone review
# does not write.
[[check]]
metric = "rule"
artifact = "file:.claude/workspace/issue-52/feature--issue-52/3.md"
present = '''(?im)^\W*answer(?:ed|s)?\b'''

# Reviewer briefs only, whatever agent type ran them: a match counts from a brief that names
# review-pr up to one that names address-review or the addresser, and a type no brief went to passes.

[[check]]
metric = "rule"
artifact = "brief:general-purpose"
present = '''(?i)\A(?!(?:[\s\S]*review-pr)?(?:(?!address-review|addresser)[\s\S])*?(?:A\s+network\s+error\s+is\s+no\s+longer\s+retried|The\s+README\s+does\s+not\s+say\s+client\s+errors|test\s+names\s+do\s+not\s+say))'''

