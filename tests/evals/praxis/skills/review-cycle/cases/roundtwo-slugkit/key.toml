# Either finding of the first review: by its title, or in other words within a sentence that names
# the earlier review or round. A brief that only says the earlier findings were fixed passes.
[[check]]
metric = "rule"
artifact = "brief:praxis:general-reviewer"
absent = '''(?i)Capital\s+letters\s+are\s+dropped|README\s+does\s+not\s+mention\s+the\s+lowercase\s+option|(?:\bround[\s-]*(?:1|one)\b|\b(?:first|earlier|previous|prior|last|1st)\s+(?:review|round))[^.;\n]{0,120}?(?:capital|upper-?case|A-Z|\[\^a-z0-9\]|README)'''

[[check]]
metric = "rule"
artifact = "brief:praxis:doc-reviewer"
absent = '''(?i)Capital\s+letters\s+are\s+dropped|README\s+does\s+not\s+mention\s+the\s+lowercase\s+option|(?:\bround[\s-]*(?:1|one)\b|\b(?:first|earlier|previous|prior|last|1st)\s+(?:review|round))[^.;\n]{0,120}?(?:capital|upper-?case|A-Z|\[\^a-z0-9\]|README)'''

