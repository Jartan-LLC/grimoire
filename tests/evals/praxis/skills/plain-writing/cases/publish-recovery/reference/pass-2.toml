"RELEASING.md" = "# Releasing\n\n1. Bump `version` in `pyproject.toml` and add a `CHANGELOG.md` entry.\n2. Merge the PR.\n3. Tag the merge commit `v<version>` and push the tag.\n4. Run `make publish`. PyPI never accepts the same version twice.\n\n## Troubleshooting\n\nIf an upload is broken, yank it and release the next patch.\n"
