"README.md" = "# remind\n\nSchedule desktop reminders.\n\n## Usage\n\n`remind at 14:30 \"stand-up\"` shows a reminder at 14:30 today, or tomorrow if 14:30 has passed.\n\nA reminder set inside the hour skipped when daylight saving time starts fires at the first valid\nminute after it.\n"
