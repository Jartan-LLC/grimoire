"docs/releasing.md" = "# Releasing\n\nRun `scripts/release.sh <version>` from `main`. It tags the version and pushes the tag. Add `--dry-run` to print the tag it would make without making it.\n\n## Troubleshooting\n\nIf the push fails with HTTP 403 after a workflow file changed, run `gh auth refresh -s workflow`\nand run the script again.\n"
