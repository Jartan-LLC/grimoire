"docs/signing-key.md" = "# Rotating the signing key\n\n1. Run `scripts/rotate-key.sh`. It makes a new key and writes its public half to `keys/`.\n2. Commit `keys/`, which holds only the public half. The private key must stay secret: anyone with\n   it can sign packages as you.\n3. Users import the new key with `rpm --import keys/RPM-GPG-KEY-acme`.\n"
