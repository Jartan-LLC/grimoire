"docs/usage.md" = "# Usage\n\n## snap take\n\n`snap take` saves a snapshot of the current directory.\n\n## snap list\n\n`snap list` lists snapshots, newest first.\n\n## snap prune\n\n`snap prune --keep N` keeps the newest `N` snapshots; `snap prune --all` deletes them all.\n\n## Troubleshooting\n\n`snap prune --all` cannot be undone: a deleted snapshot is gone for good. List them first:\n\n```bash\nsnap list\n\n# then delete them all\nsnap prune --all\n```\n"
