[files]
"docs/usage.md" = "# Usage\n\n## snap take\n\n`snap take` saves a snapshot of the current directory.\n\n## snap list\n\n`snap list` lists snapshots, newest first.\n\n## snap prune\n\n`snap prune --keep N` deletes all but the newest `N` snapshots.\n\n`snap prune --all` deletes every snapshot, the latest included. This cannot be undone.\n"
