# Over-planning control at the light size: a well-specified function, no rollout.
# It ran in the scratch smoke of #193 (old = praxis 2.4.0, new = a draft of the planning skill), so
# its results are known: it stays on dev.
split = "dev"
kind = "regression"
hints = []

# What a right-sized plan must hold (the smoke graded only `lean` here).
[[check]]
metric = "gap"
artifact = "file:.claude/workspace/issue-12/plan.md"
present = '''(?s)\A(?=.*test_utils)(?=.*pytest)'''

# The smoke's over-planning check.
[[check]]
metric = "lean"
artifact = "file:.claude/workspace/issue-12/plan.md"
present = '''(?s)\A(?!.*(?i:rollout|roll-?back|\bundo\b|\bdeploy|\bcost\b|ceiling|\brevert))\s*(?:\S+\s+){0,450}\S*\s*\Z'''

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"

