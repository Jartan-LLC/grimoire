# Over-planning control at the light size, through plan-issue: a well-specified function.
# Written for the committed suite after the smoke, so no smoke result shaped it.
split = "confirm"
kind = "regression"
hints = []

# What a right-sized plan must hold: the error cases, tested in the named file.
[[check]]
metric = "gap"
artifact = "file:.claude/workspace/issue-8/plan.md"
present = '''(?s)\A(?=.*ValueError)(?=.*test_timeutil)'''

# An easy-to-undo, clear change: nothing on rollout, undo or cost, and at most 450 words,
# the dev light control's check.
[[check]]
metric = "lean"
artifact = "file:.claude/workspace/issue-8/plan.md"
present = '''(?s)\A(?!.*(?i:roll-?out|roll-?back|\bundo\b|\bdeploy|\bcost\b|ceiling|\brevert))\s*(?:\S+\s+){0,450}\S*\s*\Z'''

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"

