# The issue asks for retries; the cause is a debug commit that set the page size to 1.
# It ran in the scratch smoke of #193 (old = praxis 2.4.0, new = a draft of the planning skill), so
# its results are known: it stays on dev.
split = "dev"
kind = "regression"
hints = ["page size", "PAGE_SIZE", "debug"]

# The planted gap, as the smoke graded it.
[[check]]
metric = "gap"
artifact = "file:.claude/workspace/issue-31/plan.md"
present = '''(?is)(page[_ ]?size|one order per page|size=1|size of 1).{0,400}(cause|root|why|instead|revert|restore|back to|100|debug)|(cause|root|revert|restore|debug).{0,400}(page[_ ]?size|one order per page|size of 1)'''

[[fact]]
text = "120 requests a minute"
where = "fixture:README.md"

[[plant]]
id = "page-size"
verify = "python3 -c \"import sys, sync; sys.exit(sync.PAGE_SIZE != 100)\""

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"

