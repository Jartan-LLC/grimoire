# A paid run with the price and the volume in the repository: an estimate, a ceiling and a smaller first step.
# Written for the committed suite after the smoke; it has never run.
split = "confirm"
kind = "regression"
hints = ["$", "cost", "budget", "pilot", "ceiling"]

# A dollar estimate from the price and the volume, a ceiling, and a smaller first step.
[[check]]
metric = "gap"
artifact = "files:**/plan.md"
present = '''(?is)\A(?=.*\$ ?\d)(?=.*(?:ceiling|\bcap\b|capped|budget|at most|no more than|stop (?:if|at|once|when)|spend(?:ing)? limit|limit of|approv))(?=.*(?:one language (?:first|to start)|single language|start with|pilot|subset|sample|first batch|top \d+|most[- ]read|fewer|smaller|before the (?:full|rest)))'''

[[fact]]
text = "$20 per million characters"
where = "fixture:docs/transapi.md"

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"
