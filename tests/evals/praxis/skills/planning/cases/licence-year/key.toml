# Over-planning control at the trivial size: one line in one file.
# Written for the committed suite after the smoke; it has never run.
split = "screen"
kind = "regression"
hints = []

# What a right-sized plan must hold: the file and the new year.
[[check]]
metric = "gap"
artifact = "files:**/plan.md"
present = '''(?s)LICENSE.{0,300}2026|2026.{0,300}LICENSE'''

# A trivial change: a few lines and no question.
[[check]]
metric = "lean"
artifact = "files:**/plan.md"
present = '''(?s)\A(?!.*\?)\s*(?:\S+\s+){0,160}\S*\s*\Z'''

# An easy-to-undo, clear change: nothing on rollout or undo.
[[check]]
metric = "lean"
artifact = "files:**/plan.md"
absent = '''(?i)\b(?:roll-?outs?|roll(?:ed|ing)?[ -]?backs?|undo(?:ne|ing)?|revert(?:s|ed|ing)?)\b'''

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"
