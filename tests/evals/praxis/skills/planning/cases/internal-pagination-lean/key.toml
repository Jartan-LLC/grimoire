# Over-planning control at the standard size: an agreed spec settles every decision.
# It ran in the scratch smoke of #193 (old = praxis 2.4.0, new = a draft of the planning skill), so
# its results are known: it stays on dev.
split = "dev"
kind = "regression"
hints = []

# What a right-sized plan must hold (the smoke graded only `lean` here).
[[check]]
metric = "gap"
artifact = "files:**/plan.md"
present = '''(?s)\A(?=.*next_cursor)(?=.*admin_cli)'''

# The smoke's over-planning check.
[[check]]
metric = "lean"
artifact = "files:**/plan.md"
present = '''(?is)\A(?!.*(roll-?out|roll-?back|\bundo\b|\bcost\b|ceiling|\brevert|canary|feature[- ]flag))\s*(?:\S+\s+){0,650}\S*\s*\Z'''

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"
