# A column rename on a live database three services read: the positive control for rollout.
# It ran in the scratch smoke of #193 (old = praxis 2.4.0, new = this branch's skill), so its results are known:
# it stays on dev.
split = "dev"
kind = "regression"
hints = ["expand", "contract", "dual-write", "backfill", "trigger"]

# The planted gap, as the smoke graded it.
[[check]]
metric = "gap"
artifact = "files:**/plan.md"
present = '''(?is)\A(?=.*(ADD COLUMN|add (an? |the )?(new )?`?email_address`? column|new column|expand|dual[- ]?writ|both columns|trigger))(?=.*(DROP COLUMN|drop (the )?(old )?`?(users\.)?email`? column|contract|remove (the )?old column))(?=.*(roll ?back|revert|undo))'''

[[fact]]
text = "Three services share the `app` PostgreSQL 15 database"
where = "fixture:README.md"

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"
