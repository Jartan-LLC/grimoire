# The request names a retry plugin; the cause is a module-level cache shared between tests run in random order.
# Written for the committed suite after the smoke, so no smoke result shaped it.
split = "confirm"
kind = "regression"
hints = ["cache", "order", "random", "isolat", "shared"]

# The cause: `_CACHE` keeps the first test's total, and pytest-randomly changes which test
# runs first.
[[check]]
metric = "gap"
artifact = "files:**/plan.md"
present = '''(?is)(_CACHE|\bcach(?:e|ed|ing)\b|shared (?:module )?state|global state|module[- ]level|(?:test|run) order|order[- ]dependen|pytest-randomly|-p randomly|random order|\bleak|isolat)'''

[[fact]]
text = "pytest-randomly"
where = "fixture:requirements-dev.txt"

[[plant]]
id = "shared-cache"
verify = "python3 -m pytest -q -p no:cacheprovider -p no:randomly tests/test_refunds.py tests/test_totals.py"

# An easy-to-undo, clear change: nothing on rollout or undo.
[[check]]
metric = "lean"
artifact = "files:**/plan.md"
absent = '''(?i)\b(?:roll-?outs?|roll(?:ed|ing)?[ -]?backs?|undo(?:ne|ing)?|revert(?:s|ed|ing)?)\b'''

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"
