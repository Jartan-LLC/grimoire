# No one can answer: the owner is away, and the merge overwrites a file git does not hold.
# Written for the committed suite after the smoke, so no smoke result shaped it.
split = "confirm"
kind = "regression"
hints = ["backup", "copy", "original", "assume"]

# A copy of the original survives: git holds none, and a merge of conflicting records loses data.
[[check]]
metric = "gap"
artifact = "files:**/plan.md"
present = '''(?is)(back ?up|copy of (?:the )?(?:original|file|data)|keep (?:the )?original|original (?:file )?(?:stays|untouched|kept|as[- ]is|intact)|(?:write|output|save)[^\n]{0,60}(?:a )?(?:new|separate) file|customers[._-](?:merged|dedup\w*|v2|new|bak|orig\w*)\.json|\.bak\b|snapshot)'''

[[fact]]
text = "It is not in git"
where = "fixture:README.md"

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"

[[baseline]]
model = "claude-opus-5-5"
arm = "none"
failures = 3
runs = 3
runner = 2
