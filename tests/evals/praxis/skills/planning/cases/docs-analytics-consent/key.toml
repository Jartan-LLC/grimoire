# The project's own privacy page already answers what looks like a product question.
# Written for the committed suite after the smoke, so no smoke result shaped it.
split = "confirm"
kind = "regression"
hints = ["privacy", "consent", "cookie", "track"]

# The site's privacy page promises no tracking: the plan raises it before choosing a tool.
[[check]]
metric = "gap"
artifact = "files:**/plan.md"
present = '''(?is)(privacy\.md|privacy (?:page|policy|statement|notice|promise)|(?:says|promises|states|claims)[^\n]{0,60}\bno(?:t)?\b[^\n]{0,30}(?:track|cookies)|do(?:es)? not track|\bconsent)'''

[[fact]]
text = "We do not track visitors."
where = "fixture:docs/privacy.md"

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"

[[baseline]]
model = "claude-opus-5-5"
arm = "none"
failures = 3
runs = 3
runner = 2
