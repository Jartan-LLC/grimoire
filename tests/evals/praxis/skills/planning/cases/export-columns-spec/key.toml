# Over-planning control at the light size: an agreed spec settles every decision.
# Written for the committed suite after the smoke, so no smoke result shaped it.
split = "screen"
kind = "regression"
hints = []

# What a right-sized plan must hold: both columns the spec names.
[[check]]
metric = "gap"
artifact = "files:**/plan.md"
present = '''(?s)\A(?=.*currency)(?=.*refunded_at)'''

# A size control at the light size: nothing on rollout, undo or cost, and at most 450 words,
# the light controls' ceiling.
[[check]]
metric = "lean"
artifact = "files:**/plan.md"
present = '''(?is)\A(?!.*(roll-?out|roll-?back|\bundo\b|\bcost\b|ceiling|\brevert|canary|feature[- ]flag))\s*(?:\S+\s+){0,450}\S*\s*\Z'''

[[check]]
metric = "recall"
artifact = "delivery"
skill = "praxis:planning"
state = "loaded"

[[baseline]]
model = "claude-opus-5-5"
arm = "none"
failures = 3
runs = 3
runner = 2
