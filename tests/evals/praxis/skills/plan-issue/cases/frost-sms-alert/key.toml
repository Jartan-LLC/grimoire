# Fixture 4's kind: an abstraction is tempting but has one use. Reported per model.

split = "screen"
kind = "target"
hints = ["abstraction", "interface", "notifier", "registry", "simple"]


# A Verification section (or Testing, Validation...) with a backticked command or a fenced block. A
# command holds a space, `::` or a known tool's name (`ruff`), or is a script path (`./check.sh`); a
# heading inside Steps is not the Verification section.
[[check]]
metric = "reader"
artifact = "file:.claude/workspace/issue-66/plan.md"
present = '''(?im)(?:^\#{1,2}(?!\#)|\A(?:(?:[^\n]*\n)*?\#{1,2}(?!\#)(?![ \t]*(?:\d+[.)][ \t]*)?(?:\*\*)?(?:implementation[ \t]+)?steps\b)[^\n]*\n)?(?:(?!\#{1,2}(?!\#))[^\n]*\n)*?\#{3,4}(?!\#))[ \t]*(?:\d+[.)][ \t]*)?(?:\*\*)?(?:verification|verify(?:ing)?|testing|tests?|test plan|validation|how to (?:test|verify))\b[^\n]*(?:\n(?!\#)[^\n]*)*?\n(?!\#)(?:(?:[^`\n]*`[^`\n]*`)*?[^`\n]*`(?:[^`\n]*?[^`\s][ \t]+[^`\s][^`\n]*?|[^`\n]*::[^`\n]*|pytest|tox|make|jest|vitest|ruff|mypy|pyright|eslint|prettier|black|flake8|pylint|shellcheck|tsc|\.{1,2}/[^`\s]+|[\w./-]+\.(?:sh|bash))`|[ \t]*```)'''

# No Complexity line or heading.
[[check]]
metric = "cut"
artifact = "file:.claude/workspace/issue-66/plan.md"
absent = '''(?im)^(?:\#{1,6}[ \t]*complexity\b|[ \t>*_-]*complexity[ \t*_]*:)'''

# No placeholder phases (Foundation / Core implementation / Integration).
[[check]]
metric = "cut"
artifact = "file:.claude/workspace/issue-66/plan.md"
absent = '''(?i)phase[ \t]*\d+\W{0,4}(?:foundation|core\b|integration)|\b(?:core implementation|integration[ \t]*(?:/|and|&)[ \t]*cleanup)\b'''

# At least one backticked path that exists in the fixture.
[[check]]
metric = "grounded"
artifact = "file:.claude/workspace/issue-66/plan.md"
present = '''`(?:\./)?(?:\.gitignore|AGENTS\.md|CLAUDE\.md|greenhouse/__init__\.py|greenhouse/__main__\.py|greenhouse/log\.py|greenhouse/sensor\.py|pyproject\.toml|tests/test_log\.py|greenhouse/?|tests/?)(?:[:#][^`\n]*)?`'''

# No backticked `path:line` whose path is not a fixture file or whose line is past its end; a list
# or range of lines and a `:col` are read too. The path must end in a source or text extension or
# be a known extensionless file such as `Makefile`, so a `host:port` is not read as one.
