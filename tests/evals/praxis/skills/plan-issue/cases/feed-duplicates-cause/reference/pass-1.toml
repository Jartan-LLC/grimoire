http line, and have `feedlet/reader.py` skip a URL already read after normalising the
scheme.
Rejected: dedupe by title -- two different posts can share a title.

## Decisions
None.

## Steps
1. Remove `http://blog.example.com/feed` from `feeds.txt`.
2. In `newest()`, drop a URL whose host and path were seen.

## Verification
- `python3 -m pytest -q` -- a test passes the same feed by http and https and gets each post once.
'''
