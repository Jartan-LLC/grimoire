".claude/workspace/issue-77/plan.md" = '''# Plan: Share a dotfile as a link (issue 77)

## Approach

Add a command that uploads one dotfile as a secret gist and prints its URL. Its name is the
open question below: `link` already symlinks the dotfiles, and setup scripts call it.

## Decisions for the user

- `dots link` is taken: it symlinks every dotfile into the home directory
  (`dots/cli.py:14`), and the project asks before renaming a subcommand. Options: rename
  the symlinking to `dots install` and give `link` to sharing (breaks setup scripts), or
  keep `link` and call the new one `dots share`. Default if unanswered: `dots share`.

## Steps

1. Add `dots/gist.py` with `share(path, token)`: POST the file as a secret gist with
   `urllib.request` and return its `html_url`; fail with a clear message when `GITHUB_TOKEN` is
   unset.
2. Register the command in `dots/cli.py`, following the subparsers at `dots/cli.py:13-15`.
3. Tests in `tests/test_gist.py` with `urlopen` patched, following `tests/test_cli.py:6-13`.
4. Document the command and `GITHUB_TOKEN` in `README.md`.

## Verification

- `python3 -m pytest -q` -- the new gist tests pass with the existing ones.
- `GITHUB_TOKEN=x python3 -c "from dots import gist"` -- the module imports with no network.
'''
