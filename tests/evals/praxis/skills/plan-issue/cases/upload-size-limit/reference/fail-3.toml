[files]
".claude/workspace/issue-58/plan.md" = '''# Plan: Size limit for uploads (issue 58)

## Approach

Turn the upload checks into a registry of rules keyed by name, each one enabled in a config
file, so the NAS admin can switch rules on and off.

## Decisions for the user

- Limit: 25 MB.

## Steps

1. `snapbox/rules.py`: the registry, with `type` and `size` rules.
2. `snapbox/store.py`: run the enabled rules from `snapbox.toml`.

## Verification

- `python3 -m pytest -q` -- the new size tests pass with the existing ones.
- With the server running locally, `curl -X POST --data-binary @big.jpg -H 'X-Filename: big.jpg'
  localhost:8420/upload` on a 30 MB file answers with the refusal message and saves nothing.
'''
