artifact = "file:.claude/workspace/issue-29/plan.md"
present = '''(?im)(?:^\#{1,2}(?!\#)|\A(?:(?:[^\n]*\n)*?\#{1,2}(?!\#)(?![ \t]*(?:\d+[.)][ \t]*)?(?:\*\*)?(?:implementation[ \t]+)?steps\b)[^\n]*\n)?(?:(?!\#{1,2}(?!\#))[^\n]*\n)*?\#{3,4}(?!\#))[ \t]*(?:\d+[.)][ \t]*)?(?:\*\*)?(?:verification|verify(?:ing)?|testing|tests?|test plan|validation|how to (?:test|verify))\b[^\n]*(?:\n(?![ \t]*```)(?!\#)[^\n]*|\n[ \t]*```[^\n]*(?:\n(?![ \t]*```)[^\n]*)*\n[ \t]*```[^\n]*)*?(?:\n(?![ \t]*```)(?!\#)[^\n]*(?:invalid|reject|refus|error|out of range|in use|already (?:in use|taken|bound)|exit(?:s)? (?:code |status |with )?[12]\b|non-?zero|fails? (?:with|for|on)|usage:|--port[ =](?:0|-1|65536|70000|99999|abc|x)\b)|\n[ \t]*```[^\n]*(?:\n(?![ \t]*```)[^\n]*)*?\n(?![ \t]*```)[^\n]*(?:invalid|reject|refus|error|out of range|in use|already (?:in use|taken|bound)|exit(?:s)? (?:code |status |with )?[12]\b|non-?zero|fails? (?:with|for|on)|usage:|--port[ =](?:0|-1|65536|70000|99999|abc|x)\b))'''

