".claude/workspace/issue-47/plan.md" = '''# Plan: JSON scores (issue 47)

## Approach

Add `--json` to `quizmark grade`: print `JSON.stringify` of the graded rows. A formatter
registry is not needed for one more output.

## Decisions for the user

None.

## Steps

1. `bin/quizmark.js`: read `--json` and print the rows as JSON instead of the table.
2. A test for the JSON output in `test/grade.test.js`.

## Verification

- `npm test` -- the new JSON test passes with the existing ones.
- `node bin/quizmark.js grade answers.csv key.txt --json` on a small sheet prints an array that
  `JSON.parse` reads back, one object per student.
'''
