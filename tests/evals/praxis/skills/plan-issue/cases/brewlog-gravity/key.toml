# Target: an Out of scope section names the tempting adjacent refactor, moving `brewlog/storage.py`
# from its hand-written split and join to the csv module. It implements the blind grading spec rule
# by rule (written from the prompt, the issue, the fixture and the plan format's Out of scope rule
# only). The section: a heading at any level, or a bold line, reading Out of scope, Not in scope,
# Non-goals, Scope exclusions, Deferred, Not doing or Not planned, up to the next heading of its level
# or higher. An item is a top-level bullet with its continuation lines and sub-bullets, or a paragraph,
# read with `*`, `_` and backticks removed and its lines joined. An item passes, unless it says the
# work is done here (ANTI: "done in step 2", "(step 3)", "needed for og", "prerequisite", none led by
# "not", "n't" or "no") or names another format (SQLite, JSON...) without the csv module, when it has:
# the csv module (TARGET: csv.reader, the csv module, "to csv"; a bare "CSV" is the log's format, not
# the module) with a change word (switch, move, replace, port...); or TARGET with "use" or "rely on"
# and a deferral word ("separate issue", "a new issue", "later", "not planned", "open an issue", a
# keep word); or a keep word with the hand-written code (hand-written, split/join, by hand), or with
# the file and a parser word; or a change word aimed at the file ("Rewriting storage.py", "a
# storage.py rewrite"); or the topic within its first four words, after an article, and a deferral
# word; or "No"/"Without" and TARGET leading it. The comma-in-name bug alone fails unless the item
# names the hand-written code in its first four words with a deferral (the spec passes that form, so
