  maintainer -- recommended: accept both names in 2.4.0, warn on `cb` with a
  `DeprecationWarning` -- default if unanswered: that -- if wrong: drop `cb` in 3.0.0.

## Steps
1. `subscribe(self, topic, callback=None, *, cb=None)` in `pubsubby/client.py`.
2. Update `README.md` and `tests/test_client.py`.

## Verification
- `python3 -m pytest -q` -- both names subscribe; `cb` warns.
