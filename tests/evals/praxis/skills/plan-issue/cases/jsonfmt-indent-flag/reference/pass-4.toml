".claude/workspace/issue-92/plan.md" = '''# Plan: Let me pick the indent (issue 92)

## Approach

Add `--indent <n>` and pass it through to `format`.

## Decisions for the user

- Should `-i 0` print the JSON on one line? -- default if unanswered: yes, as
  `JSON.stringify` does with 0.

## Steps

1. `src/format.js`: take an `indent` option, default 2, and pass it to `JSON.stringify` at
   `src/format.js:12`.
2. `bin/jsonfmt.js`: parse the new option, reject a value that is not a whole number from 0 to
   10, and pass it to `format`.
3. Tests in `test/format.test.js` for 4 spaces and for the default.
4. `README.md`: document it.

## Verification

- `npm test` -- the new indent tests pass with the existing ones.
- `echo '{"a":1}' > /tmp/a.json && node bin/jsonfmt.js --indent 4 /tmp/a.json` -- prints the
  object with four spaces.
'''
