[[check]]
metric = "grounded"
artifact = "file:.claude/workspace/issue-57/plan.md"
present = '''`(?:\./)?(?:\.gitignore|AGENTS\.md|CLAUDE\.md|README\.md|bin/todo\.js|package\.json|src/args\.js|src/commands/add\.js|src/commands/done\.js|src/commands/list\.js|src/store\.js|test/args\.test\.js|test/commands\.test\.js|bin/?|src/?|src/commands/?|test/?)(?:[:#][^`\n]*)?`'''

