# passing with a deferral word, fails. `TODO` counts only in capitals. A move word may take a
# backticked object ("Moving `x.js` to ..."), and "open an issue" or "file an issue" is a deferral.
[[check]]
metric = "reader"
artifact = "file:.claude/workspace/issue-53/plan.md"
