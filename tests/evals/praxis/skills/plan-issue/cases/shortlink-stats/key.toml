metric = "lean"
artifact = "file:.claude/workspace/issue-45/plan.md"
absent = '''(?im)^\#{1,4}(?!\#)[ \t]*(?![ \t])(?!(?:\d+[.)][ \t]*)?(?:\*\*)?(?:decisions?|open questions?|questions)\b)[^\n]*\n(?:[ \t]*\n)*[ \t]*(?:[-*+][ \t]+)?(?:\*\*|_)?\(?(?:none|n/?a|not applicable|(?:none|nothing)(?: (?:needed|required|planned))?|nothing to (?:add|note|report)|no changes?(?: needed)?)\)?[.!]?(?:\*\*|_)?(?:[ \t]*(?:--|:|,)[^\n]*)?[ \t]*(?:\n[ \t]*)*(?:\n(?=\#)|\Z)'''

# Target: an Out of scope section (or Non-goals...) names the tempting adjacent refactor in one item
# (a bullet or paragraph): its topic with a change word, what it moves to with a deferral word, or
# its topic leading the item with a deferral word; or its file with a change word on one line. A
# line on another bug in that file, one that only mentions the topic, or one that names it in
# passing with a deferral word, fails. `TODO` counts only in capitals.
[[check]]
metric = "reader"
artifact = "file:.claude/workspace/issue-45/plan.md"
present = '''(?im)^\#{1,4}[ \t]*(?:\d+[.)][ \t]*)?(?:\*\*)?(?:out[ -]of[ -]scope|not in scope|non-goals?|not (?:doing|planned|changing|included)|left out|deferred|scope boundar\w*)\b[^\n]*(?:\n(?!\#)[^\n]*)*?\n(?!\#)(?:(?:(?=(?:[^\n]|\n(?=[ \t]*\S)(?![ \t]*(?:[-*+]|\d+[.)])[ \t])(?!\#))*?(?:sqlite|database|\bdb\b|concurren\w*|lost writes?|\brace\b|sqlite))(?=(?:[^\n]|\n(?=[ \t]*\S)(?![ \t]*(?:[-*+]|\d+[.)])[ \t])(?!\#))*?\b(?:(?-i:TODO)|rewrit\w*|replac\w*|refactor\w*|rebuild\w*|rebuilt|restructur\w*|switch\w*|migrat\w*|mov(?:e|es|ed|ing) (?:it |them )?(?:to|onto)|hand-?rolled|rework\w*|port(?:s|ed|ing)?\b|convert\w*))|(?=(?:[^\n]|\n(?=[ \t]*\S)(?![ \t]*(?:[-*+]|\d+[.)])[ \t])(?!\#))*?(?:sqlite))(?=(?:[^\n]|\n(?=[ \t]*\S)(?![ \t]*(?:[-*+]|\d+[.)])[ \t])(?!\#))*?\b(?:separate|own (?:issue|change|pr|ticket)|follow-?up|later|defer\w*|future|not planned|not (?:in|part of) this|instead))|[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?(?:\*\*|_)?`?(?:(?:the|its|our|a|any)[ \t]+)?(?:(?:hand-?(?:rolled|written)|custom|existing|current|own|json)[ \t]+)?`?(?:sqlite|database|\bdb\b|concurren\w*|lost writes?|\brace\b|sqlite)(?=(?:[^\n]|\n(?=[ \t]*\S)(?![ \t]*(?:[-*+]|\d+[.)])[ \t])(?!\#))*?\b(?:separate|own (?:issue|change|pr|ticket)|follow-?up|later|defer\w*|future|not planned|not (?:in|part of) this|instead)))|[^\n]*(?:store\.js[^\n]*\b(?:(?-i:TODO)|rewrit\w*|replac\w*|refactor\w*|rebuild\w*|rebuilt|restructur\w*|switch\w*|migrat\w*|mov(?:e|es|ed|ing) (?:it |them )?(?:to|onto)|hand-?rolled|rework\w*|port(?:s|ed|ing)?\b|convert\w*)|\b(?:(?-i:TODO)|rewrit\w*|replac\w*|refactor\w*|rebuild\w*|rebuilt|restructur\w*|switch\w*|migrat\w*|mov(?:e|es|ed|ing) (?:it |them )?(?:to|onto)|hand-?rolled|rework\w*|port(?:s|ed|ing)?\b|convert\w*)\b[^\n]*store\.js))'''

