".claude/workspace/issue-91/plan.md" = '''# Plan: Choose which columns to print (issue 91)

## Approach
`bin/colcut.js:11` always picks column 0. Add a `--fields` option taking a `cut -f` list, parsed
by a new `parseFields` in `src/columns.js` into 0-based indexes for `pick`. Invalid lists are
refused up front, with exit 2 like the usage error at `bin/colcut.js:6-9`.

## Decisions
None.

## Out of scope
- Quoted fields (`src/columns.js:1`) -- not planned.
- Open-ended ranges such as `4-` -- not planned; refused for now.

## Steps
1. In `src/columns.js`, add and export `parseFields(list)`. Accept `N` and `N-M` with
   `1 <= N <= M`. Throw `invalid field list` on `0`, a non-number, an empty item, a reversed range
   such as `6-4`, or an open range.
2. In `bin/colcut.js:5`, read `--fields <list>` from argv in any position. On a throw from
   `parseFields`, or `--fields` with no value, print `colcut: invalid field list` and exit 2.
   Default to `[0]`; pass the indexes to `pick` at line 11.
3. In `test/columns.test.js`, add a `parseFields` test for `"2,4-6"`, following lines 5-8.
4. Update `AGENTS.md:3` and the usage line at `bin/colcut.js:7`; bump `package.json:3` to 1.3.0.

## Verification
- `npm test` -- passing shows `parseFields("2,4-6")` returns `[1, 3, 4, 5]`.
- `printf 'a,b,c,d,e,f\n' > /tmp/t.csv && node bin/colcut.js /tmp/t.csv --fields 2,4-6` --
  prints `b,d,e,f`.
- `node bin/colcut.js /tmp/t.csv` -- prints `a`, unchanged.
- `node bin/colcut.js; echo $?` -- prints the new usage line with `[--fields LIST]` and exits 2.
- `node bin/colcut.js /tmp/missing.csv --fields 2` -- exits non-zero with `ENOENT` and prints
  nothing on stdout.
'''
