split = "screen"
kind = "target"
hints = ["rename", "decision", "already exists", "backup", "clash"]


# A Verification section (or Testing, Validation...) with a backticked command or a fenced block.
[[check]]
metric = "reader"
artifact = "file:.claude/workspace/issue-22/plan.md"
