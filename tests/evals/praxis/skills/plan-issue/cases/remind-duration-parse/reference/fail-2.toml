## Decisions for the user

None.

## Steps

1. `parse_in` in `remindme/add.py`, used as the `type=` of `--in` in `remindme/__main__.py`.
2. Tests in `tests/test_add.py`.

## Verification

- `python3 -m pytest -q` -- the new `add` tests pass, and `tests/test_snooze.py` still does.
- `python3 -m remindme add "Call the dentist" --in 1h30m` then `python3 -m remindme list` shows it
