".claude/workspace/issue-19/plan.md" = '''## Implementation Plan

### Issue Summary
Retry thumbnail downloads so a short outage does not drop thumbnails.

### Patterns & Conventions Found
- Pattern: `feeds/fetch.py:13` -- feed fetches retry three times with a growing pause.

### Chosen Approach
- **What**: Extract the retry loop from `fetch_feed` into a shared helper used by both downloads.
- **Why**: One retry policy for both.
- **How**: New module, two call sites.

### Alternatives Considered
1. Copy the loop -- duplication.

### Files to Create/Modify
- `feeds/http.py` -- new helper
- `feeds/fetch.py`, `feeds/thumbs.py` -- call it

### Documentation Plan
- None needed.

### Implementation Checklist
- [ ] Phase 1: Foundation -- helper
- [ ] Phase 2: Core implementation -- call sites
- [ ] Phase 3: Integration/cleanup -- tests

### Complexity
Simple
'''
