".claude/workspace/issue-19/plan.md" = '''# Plan: Retry thumbnail downloads (issue 19)

## Approach

Reuse the retry loop that feed fetches already have: pull it out of `fetch_feed` into a common
helper and use it for thumbnails too. A refresh holds the cron slot longer while it waits, at
most three seconds per failing image.

## Decisions for the user

- Assumption: thumbnails can wait as long as feeds (1 s, then 2 s) -- if the display needs them
  faster, give the helper a backoff argument.

## Steps

1. Move the retry loop from `feeds/fetch.py` into a shared helper in `feeds/retry.py`.
2. Call it from `fetch_feed` and from `download_thumb`.
3. Test: a thumbnail that fails once with 503 is cached on the second attempt.

## Verification

- `python3 -m pytest -q` passes, with `time.sleep` patched out.
'''
