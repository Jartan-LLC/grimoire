# No Complexity line or heading.
[[check]]
metric = "cut"
artifact = "file:.claude/workspace/issue-40/plan.md"
absent = '''(?im)^(?:\#{1,6}[ \t]*complexity\b|[ \t>*_-]*complexity[ \t*_]*:)'''

# No placeholder phases (Foundation / Core implementation / Integration).
[[check]]
metric = "cut"
artifact = "file:.claude/workspace/issue-40/plan.md"
absent = '''(?i)phase[ \t]*\d+\W{0,4}(?:foundation|core\b|integration)|\b(?:core implementation|integration[ \t]*(?:/|and|&)[ \t]*cleanup)\b'''

# At least one backticked path that exists in the fixture.
[[check]]
metric = "grounded"
artifact = "file:.claude/workspace/issue-40/plan.md"
present = '''`(?:\./)?(?:\.gitignore|AGENTS\.md|CLAUDE\.md|pantry/__init__\.py|pantry/cli\.py|pantry/quantity\.py|pantry/recipe\.py|pyproject\.toml|recipes/pancakes\.txt|tests/test_quantity\.py|tests/test_recipe\.py|pantry/?|recipes/?|tests/?)(?:[:#][^`\n]*)?`'''

# No backticked `path:line` whose path is not a fixture file or whose line is past its end; the path
# must end in a source or text extension, so a `host:port` is not read as one.
