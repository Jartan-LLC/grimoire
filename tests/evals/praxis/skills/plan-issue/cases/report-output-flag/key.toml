metric = "grounded"
artifact = "file:.claude/workspace/issue-33/plan.md"
present = '''`(?:\./)?(?:\.gitignore|AGENTS\.md|CLAUDE\.md|README\.md|bin/sizecheck\.js|package\.json|src/measure\.js|src/report\.js|test/measure\.test\.js|test/report\.test\.js|bin/?|src/?|test/?)(?:[:#][^`\n]*)?`'''

# No backticked `path:line` whose path is not a fixture file or whose line is past its end; a list
# or range of lines and a `:col` are read too. The path must end in a source or text extension or
# be a known extensionless file such as `Makefile`, so a `host:port` is not read as one.
