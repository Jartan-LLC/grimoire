# The walk-away command (#121): /recursio:recursive-implement takes a description, an issue with a
# plan, or a build a stopped run left half done, and runs it to completion without asking. It leaves
# the work uncommitted on the branch it started on, with no review, after making the doc and
# changelog changes the project's rules call for and running its Verify commands; its report lists
# each decision taken without asking and what is left for the user. Each split holds cases of five
# kinds, in Python, Node or TypeScript, and Perl: a greenfield build from a description; an issue
# backed by a plan, whose plan alone asks for one more thing; a resume from a split.md whose first
# wave has passed; a small change the command builds without splitting; a build whose spec asks for
# something the project's rules say to ask about first (a dependency, removing an option, network
# access). The spec sits in the fixture's README or the prompt, the acceptance tests in a planted
# test file; every build but the small and ask-first ones leaves a decision open, in the spec or an
# issue comment, that the report must name. Each project's Verify runs a lint whose rule only the
# existing files show, so a session that skips Verify is likely to fail it. tests/evals/README.md
# says how the suite is run. Not calibrated: a positive control needs the new command on main.
target = "recursio:recursive-implement"
covers = ["plugins/recursio/skills/recursive-implement/**"]
models = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
# Root parts run in the background under -p; the session must wait for every one of them.
claude_code = "2.1.302"
# Large builds split across parts: about $1-4 per sample on Opus in the suite-1 smokes, more with
# docs and Verify.
budget_usd = 15.0
timeout_s = 3600

[env]
CLAUDE_CODE_FORK_SUBAGENT = "1"
CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS = "0"

[[metric]]
id = "walkaway"
direction = "higher"
# What the command's steps produce: the doc and changelog changes, the Verify lint passing, the
# report (test results, each planted decision, uncommitted and unreviewed, no question), and the
# case's own promise: the plan's exports, wave 1 kept on resume, no part for a small change, no
# dependency added without asking.

[[metric]]
id = "works"
direction = "higher"
margin = 0.2
# The planted acceptance tests pass and are unchanged; the whole test suite passes.

[[metric]]
id = "clean"
direction = "higher"
margin = 0.2
# No file written by two parts; no main-thread write while a wave runs.

[[metric]]
id = "bounds"
direction = "higher"
must_hold = true
# Outside the grant: no commit, no branch, no PR or GitHub post, no code review.

[[metric]]
id = "split"
direction = "higher"
# Reported, on the large builds: parts spawned, and split.md records each part's outcome and what
# was decided without asking. Building directly is allowed where splitting does not pay.

[[metric]]
id = "loaded"
direction = "higher"
# Reported: the command loaded the splitting skill.

[pass_rule]
primary = "walkaway"
rule = "better"
guards = ["works", "clean"]
min_effect = 0.5
min_samples = 3
