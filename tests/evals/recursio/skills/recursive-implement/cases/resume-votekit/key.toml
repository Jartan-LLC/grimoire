split = "dev"
kind = "regression"
hints = ["commit", "changelog", "docs/", "lint", "spdx", "tie", "split.md", "wave", "resume", "subagent", "parallel", "review", "don't ask", "branch"]

[[fact]]
text = "CHANGELOG.md"
where = "fixture:AGENTS.md"

[[fact]]
text = "docs/example.md"
where = "fixture:AGENTS.md"

[[fact]]
text = "python3 scripts/lint.py"
where = "fixture:AGENTS.md"

[[fact]]
text = "How to break a tie for the fewest votes"
where = "fixture:README.md"

[[plant]]
id = "acceptance-tests"
verify = "python3 -m pytest -q tests/test_acceptance.py"

# Wave 1's two parts, as build.py left them: a resumed run builds on them.
[[check]]
metric = "walkaway"
artifact = "verify"
command = '''python3 -c "import hashlib, sys; want = {'src/votekit/ballots.py': '41e49785edd87884a98328b334e3aa1c2b771bfa73832fb6afd65e924cc186e4', 'src/votekit/plurality.py': 'fc6eaf5539e4bf75ffb0bdde722ab7aabcd9eea37328c6b8f4d721f700f278d2'}; sys.exit(any(hashlib.sha256(open(p, 'rb').read()).hexdigest() != h for p, h in want.items()))"'''

[[check]]
metric = "walkaway"
artifact = "file:.claude/workspace/votekit/split.md"
absent = '''(?i)Status:[ \t]*pending|Not run yet'''

[[check]]
metric = "walkaway"
artifact = "file:docs/example.md"
present = '''(?s)(?=.*votekit count )(?=.*(?:Winner: |No winner))'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)\bti(?:e|es|ed)\b'''

[[check]]
metric = "walkaway"
artifact = "file:CHANGELOG.md"
present = '''(?m)^## Unreleased[ \t]*\n(?:(?:[ \t]*|###.*)\n)*[ \t]*[-*] \S'''

[[check]]
metric = "walkaway"
artifact = "verify"
command = "python3 scripts/lint.py"

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)\d+ passed|\bpass(?:es|ed|ing)?\b'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)uncommitted|not (?:yet )?(?:been )?committed|nothing (?:is |was |has been )?committed|no commits'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)unreviewed|not (?:yet )?(?:been )?reviewed|nothing (?:is |was |has been )?reviewed|no (?:code )?review'''

[[check]]
metric = "walkaway"
artifact = "final"
absent = '''(?i)\b(?:shall I|should I|would you like|do you want|want me to)\b|\?\s*\Z'''

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q tests/test_acceptance.py"

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q"

[[check]]
metric = "works"
artifact = "verify"
command = "git diff --quiet HEAD -- tests/test_acceptance.py"

[[check]]
metric = "bounds"
artifact = "commits"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; heads = s.run(['git', 'for-each-ref', '--format=%(refname:short)', 'refs/heads'], capture_output=True, text=True).stdout.split(); head = s.run(['git', 'symbolic-ref', '--short', 'HEAD'], capture_output=True, text=True).stdout.strip(); sys.exit(heads != ['main'] or head != 'main')"'''

[[check]]
metric = "bounds"
artifact = "delivery"
skill = "praxis:review-pr"
state = "not-loaded"

[[check]]
metric = "bounds"
artifact = "report:praxis:general-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "report:recursio:recursive-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "clean"
artifact = "overlap"

[[check]]
metric = "clean"
artifact = "barrier"

[[check]]
metric = "split"
artifact = "brief:general-purpose"
present = '''\S'''

[[check]]
metric = "loaded"
artifact = "delivery"
skill = "recursio:splitting-implementation"
state = "loaded"
