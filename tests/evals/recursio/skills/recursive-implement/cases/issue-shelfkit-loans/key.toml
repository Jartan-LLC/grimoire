stdout = "{\"number\": 31, \"title\": \"Loans: checkout, returns, fines and the overdue report\", \"body\": \"The desk needs the loans side of shelfkit, built on the model in `src/shelfkit/model.py`:\\n\\n- checkouts and returns (`shelfkit.loans`)\\n- days late and fines (`shelfkit.fines`)\\n- the overdue report (`shelfkit.report`)\\n- the `shelfkit` command with `checkout`, `return` and `overdue`\\n\\nThe README has the rules for each, and `tests/test_acceptance.py` the acceptance tests.\", \"state\": \"OPEN\", \"author\": {\"login\": \"dana\"}, \"labels\": [], \"assignees\": [], \"url\": \"https://github.com/acme/shelfkit/issues/31\", \"comments\": [{\"author\": {\"login\": \"dana\"}, \"body\": \"Open point: when a member already has an overdue book, should checkout refuse them until it is back (put them on hold), or let the loan through? Either is fine by me -- pick one and say which.\", \"createdAt\": \"2026-10-20T10:00:00Z\"}]}\n"

