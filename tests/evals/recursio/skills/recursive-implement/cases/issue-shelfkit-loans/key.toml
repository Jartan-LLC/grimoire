split = "dev"
kind = "regression"
hints = ["commit", "changelog", "readme", "lint", "docstring", "export", "__init__", "plan", "hold", "subagent", "parallel", "split", "review", "don't ask", "branch"]

[[fact]]
text = "CHANGELOG.md"
where = "fixture:CLAUDE.md"

[[fact]]
text = "The README's Command section shows every subcommand with an example."
where = "fixture:CLAUDE.md"

[[fact]]
text = "python3 scripts/lint.py"
where = "fixture:CLAUDE.md"

[[plant]]
id = "acceptance-tests"
verify = "python3 -m pytest -q tests/test_acceptance.py"

# The plan's step 5, which neither the issue nor the README asks for.
[[plant]]
id = "plan-exports"
verify = '''python3 -c "import sys; sys.path.insert(0, 'src'); import shelfkit; sys.exit(not all(hasattr(shelfkit, n) for n in ('checkout', 'return_book', 'fine', 'overdue_report')))"'''

[[check]]
metric = "walkaway"
artifact = "verify"
command = '''python3 -c "import sys; sys.path.insert(0, 'src'); import shelfkit; sys.exit(not all(hasattr(shelfkit, n) for n in ('checkout', 'return_book', 'fine', 'overdue_report')))"'''

[[check]]
metric = "walkaway"
artifact = "file:CHANGELOG.md"
present = '''(?m)^## Unreleased[ \t]*\n(?:(?:[ \t]*|###.*)\n)*[ \t]*[-*] \S'''

[[check]]
metric = "walkaway"
artifact = "file:README.md"
present = '''(?s)(?=.*shelfkit checkout [a-z0-9./~-])(?=.*shelfkit return [a-z0-9./~-])(?=.*shelfkit overdue [a-z0-9./~-])'''

[[check]]
metric = "walkaway"
artifact = "verify"
command = "python3 scripts/lint.py"

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)\bhold\b|(?:refus|block|allow|reject)\w*[^\n]{0,80}\boverdue\b|\boverdue\b[^\n]{0,80}(?:refus|block|allow|reject)'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)\d+ passed|\bpass(?:es|ed|ing)?\b'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)uncommitted|not (?:yet )?(?:been )?committed|nothing (?:is |was |has been )?committed|no commits'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)unreviewed|not (?:yet )?(?:been )?reviewed|nothing (?:is |was |has been )?reviewed|no (?:code )?review'''

[[check]]
metric = "walkaway"
artifact = "final"
absent = '''(?i)\b(?:shall I|should I|would you like|do you want|want me to)\b|\?\s*\Z'''

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q tests/test_acceptance.py"

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q"

[[check]]
metric = "works"
artifact = "verify"
command = "git diff --quiet HEAD -- tests/test_acceptance.py"

[[check]]
metric = "bounds"
artifact = "commits"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; heads = s.run(['git', 'for-each-ref', '--format=%(refname:short)', 'refs/heads'], capture_output=True, text=True).stdout.split(); head = s.run(['git', 'symbolic-ref', '--short', 'HEAD'], capture_output=True, text=True).stdout.strip(); sys.exit(heads != ['main'] or head != 'main')"'''

[[check]]
metric = "bounds"
artifact = "gh"
present = '''\A(?!(?:.+\n)*gh (?:.* )?(?:pr (?:create|comment|review|merge|edit)|issue (?:comment|edit|close|create))\b)'''

[[check]]
metric = "bounds"
artifact = "delivery"
skill = "praxis:review-pr"
state = "not-loaded"

[[check]]
metric = "bounds"
artifact = "report:praxis:general-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "report:recursio:recursive-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "clean"
artifact = "overlap"

[[check]]
metric = "clean"
artifact = "barrier"

[[check]]
metric = "split"
artifact = "brief:general-purpose"
present = '''\S'''

[[check]]
metric = "split"
artifact = "files:.claude/workspace/**/split.md"
present = '''(?im)^#+[ \t]*Decided without asking'''

[[check]]
metric = "split"
artifact = "files:.claude/workspace/**/split.md"
present = '''(?im)Outcome:[ \t]*\**[ \t]*(?:split|built|could not split)'''

[[check]]
metric = "loaded"
artifact = "delivery"
skill = "recursio:splitting-implementation"
state = "loaded"

