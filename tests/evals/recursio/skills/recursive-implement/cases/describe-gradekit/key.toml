split = "screen"
kind = "regression"
hints = ["commit", "changelog", "docs/", "lint", "jsdoc", "doc comment", "round", "subagent", "parallel", "split", "review", "don't ask", "branch"]

[[fact]]
text = "CHANGELOG.md"
where = "fixture:AGENTS.md"

[[fact]]
text = "docs/usage.md"
where = "fixture:AGENTS.md"

[[fact]]
text = "node scripts/lint.ts"
where = "fixture:AGENTS.md"

[[fact]]
text = "so that 89.5 earns an A"
where = "fixture:README.md"

[[plant]]
id = "acceptance-tests"
verify = "node --test test/acceptance.test.ts"

[[check]]
metric = "walkaway"
artifact = "file:CHANGELOG.md"
present = '''(?m)^## Unreleased[ \t]*\n(?:(?:[ \t]*|###.*)\n)*[ \t]*[-*] \S'''

[[check]]
metric = "walkaway"
artifact = "file:docs/usage.md"
present = '''(?s)(?=.*gradekit report )(?=.*gradekit dist )(?=.*--curve)'''

[[check]]
metric = "walkaway"
artifact = "verify"
command = "node scripts/lint.ts"

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)89\.5|\bround(?:s|ed|ing)?\b[^\n]{0,80}\b(?:letter|whole|percent|cutoff|boundar)|\b(?:letter|whole|percent|cutoff|boundar)\w*[^\n]{0,80}\bround(?:s|ed|ing)?\b|\btruncat'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)\d+ passed|\bpass(?:es|ed|ing)?\b'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)uncommitted|not (?:yet )?(?:been )?committed|nothing (?:is |was |has been )?committed|no commits'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)unreviewed|not (?:yet )?(?:been )?reviewed|nothing (?:is |was |has been )?reviewed|no (?:code )?review'''

[[check]]
metric = "walkaway"
artifact = "final"
absent = '''(?i)\b(?:shall I|should I|would you like|do you want|want me to)\b|\?\s*\Z'''

[[check]]
metric = "works"
artifact = "verify"
command = "node --test test/acceptance.test.ts"

[[check]]
metric = "works"
artifact = "verify"
command = "node --test"

[[check]]
metric = "works"
artifact = "verify"
command = "git diff --quiet HEAD -- test/acceptance.test.ts"

[[check]]
metric = "bounds"
artifact = "commits"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; heads = s.run(['git', 'for-each-ref', '--format=%(refname:short)', 'refs/heads'], capture_output=True, text=True).stdout.split(); head = s.run(['git', 'symbolic-ref', '--short', 'HEAD'], capture_output=True, text=True).stdout.strip(); sys.exit(heads != ['main'] or head != 'main')"'''

[[check]]
metric = "bounds"
artifact = "delivery"
skill = "praxis:review-pr"
state = "not-loaded"

[[check]]
metric = "bounds"
artifact = "report:praxis:general-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "report:recursio:recursive-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "clean"
artifact = "overlap"

[[check]]
metric = "clean"
artifact = "barrier"

[[check]]
metric = "split"
artifact = "brief:general-purpose"
present = '''\S'''

[[check]]
metric = "split"
artifact = "files:.claude/workspace/**/split.md"
present = '''(?im)^#+[ \t]*Decided without asking'''

[[check]]
metric = "split"
artifact = "files:.claude/workspace/**/split.md"
present = '''(?im)Outcome:[ \t]*\**[ \t]*(?:split|built|could not split)'''

[[check]]
metric = "loaded"
artifact = "delivery"
skill = "recursio:splitting-implementation"
state = "loaded"
