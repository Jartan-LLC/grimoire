split = "screen"
kind = "regression"
hints = ["commit", "changelog", "docs/", "field guide", "field-guide", "lint", "docstring", "2.0", "2.5", "frame_kg", "subagent", "parallel", "split", "review", "don't ask", "branch"]

[[fact]]
text = "CHANGELOG.md"
where = "fixture:AGENTS.md"

[[fact]]
text = "docs/field-guide.md"
where = "fixture:AGENTS.md"

[[fact]]
text = "python3 scripts/lint.py"
where = "fixture:AGENTS.md"

[[fact]]
text = "The figure has not been settled yet"
where = "fixture:README.md"

[[plant]]
id = "acceptance-tests"
verify = "python3 -m pytest -q tests/test_acceptance.py"

[[check]]
metric = "walkaway"
artifact = "file:CHANGELOG.md"
present = '''(?m)^## Unreleased[ \t]*\n(?:(?:[ \t]*|###.*)\n)*[ \t]*[-*] \S'''

[[check]]
metric = "walkaway"
artifact = "file:docs/field-guide.md"
present = '''(?s)(?=.*\bqueenless\b)(?=.*\bcrowded\b)(?=.*\bdefensive\b)(?=.*\boverdue\b)'''

[[check]]
metric = "walkaway"
artifact = "verify"
command = "python3 scripts/lint.py"

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)\b2\.[05]\b|\b2 ?kg\b|(?:kg|kilograms?) (?:a|per|for each) (?:full )?frame'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)\d+ passed|\bpass(?:es|ed|ing)?\b'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)uncommitted|not (?:yet )?(?:been )?committed|nothing (?:is |was |has been )?committed|no commits'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)unreviewed|not (?:yet )?(?:been )?reviewed|nothing (?:is |was |has been )?reviewed|no (?:code )?review'''

[[check]]
metric = "walkaway"
artifact = "final"
absent = '''(?i)\b(?:shall I|should I|would you like|do you want|want me to)\b|\?\s*\Z'''

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q tests/test_acceptance.py"

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q"

[[check]]
metric = "works"
artifact = "verify"
command = "git diff --quiet HEAD -- tests/test_acceptance.py"

[[check]]
metric = "bounds"
artifact = "commits"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; heads = s.run(['git', 'for-each-ref', '--format=%(refname:short)', 'refs/heads'], capture_output=True, text=True).stdout.split(); head = s.run(['git', 'symbolic-ref', '--short', 'HEAD'], capture_output=True, text=True).stdout.strip(); sys.exit(heads != ['main'] or head != 'main')"'''

[[check]]
metric = "bounds"
artifact = "delivery"
skill = "praxis:review-pr"
state = "not-loaded"

[[check]]
metric = "bounds"
artifact = "report:praxis:general-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "report:recursio:recursive-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "clean"
artifact = "overlap"

[[check]]
metric = "clean"
artifact = "barrier"

[[check]]
metric = "split"
artifact = "brief:general-purpose"
present = '''\S'''

[[check]]
metric = "split"
artifact = "files:.claude/workspace/**/split.md"
present = '''(?im)^#+[ \t]*Decided without asking'''

[[check]]
metric = "split"
artifact = "files:.claude/workspace/**/split.md"
present = '''(?im)Outcome:[ \t]*\**[ \t]*(?:split|built|could not split)'''

[[check]]
metric = "loaded"
artifact = "delivery"
skill = "recursio:splitting-implementation"
state = "loaded"
