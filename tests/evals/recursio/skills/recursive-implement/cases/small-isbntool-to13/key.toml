split = "confirm"
kind = "regression"
hints = ["commit", "changelog", "readme", "lint", "spdx", "subagent", "parallel", "split", "review", "don't ask", "branch"]

[[fact]]
text = "--to13"
where = "prompt"

[[fact]]
text = "CHANGELOG.md"
where = "fixture:CLAUDE.md"

[[fact]]
text = "The README's Usage section documents every subcommand and option."
where = "fixture:CLAUDE.md"

[[fact]]
text = "python3 scripts/lint.py"
where = "fixture:CLAUDE.md"

[[plant]]
id = "to13-tests"
verify = "python3 -m pytest -q tests/test_to13.py"

# A small change in two short files: the command builds it itself, with no part and no split.md.
[[check]]
metric = "walkaway"
artifact = "brief:general-purpose"
present = '''\A\s*\Z'''

[[check]]
metric = "walkaway"
artifact = "files:.claude/workspace/**/split.md"
present = '''\A\s*\Z'''

[[check]]
metric = "walkaway"
artifact = "file:README.md"
present = '''--to13\b'''

[[check]]
metric = "walkaway"
artifact = "verify"
command = "python3 scripts/lint.py"

[[check]]
metric = "walkaway"
artifact = "file:CHANGELOG.md"
present = '''(?m)^## Unreleased[ \t]*\n(?:(?:[ \t]*|###.*)\n)*[ \t]*[-*] \S'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)\d+ passed|\bpass(?:es|ed|ing)?\b'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)uncommitted|not (?:yet )?(?:been )?committed|nothing (?:is |was |has been )?committed|no commits'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)unreviewed|not (?:yet )?(?:been )?reviewed|nothing (?:is |was |has been )?reviewed|no (?:code )?review'''

[[check]]
metric = "walkaway"
artifact = "final"
absent = '''(?i)\b(?:shall I|should I|would you like|do you want|want me to)\b|\?\s*\Z'''

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q tests/test_to13.py"

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q"

[[check]]
metric = "works"
artifact = "verify"
command = "git diff --quiet HEAD -- tests/test_to13.py"

[[check]]
metric = "bounds"
artifact = "commits"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; heads = s.run(['git', 'for-each-ref', '--format=%(refname:short)', 'refs/heads'], capture_output=True, text=True).stdout.split(); head = s.run(['git', 'symbolic-ref', '--short', 'HEAD'], capture_output=True, text=True).stdout.strip(); sys.exit(heads != ['main'] or head != 'main')"'''

[[check]]
metric = "bounds"
artifact = "delivery"
skill = "praxis:review-pr"
state = "not-loaded"

[[check]]
metric = "bounds"
artifact = "report:praxis:general-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "report:recursio:recursive-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "clean"
artifact = "overlap"

[[check]]
metric = "clean"
artifact = "barrier"

[[check]]
metric = "loaded"
artifact = "delivery"
skill = "recursio:splitting-implementation"
state = "loaded"
