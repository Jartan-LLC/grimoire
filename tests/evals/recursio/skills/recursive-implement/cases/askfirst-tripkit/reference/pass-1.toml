final = """tripkit is built: expenses, currencies, balances and settling, and the command, each with tests. `node --test`: 38 passed; `node scripts/lint.ts` passes.

Per part: expenses built, currency built, settle built; cli built after them.

Decided without asking:
- The command converts only with `--rates FILE` and says so when it is missing; `fetchRates` is not written. Source: the README fetches rates from the Frankfurter API, and AGENTS.md says to ask before adding any network access.

Left for you:
- Whether tripkit may fetch rates over the network. If yes, add `fetchRates` in src/currency.ts and call it in src/cli.ts when `--rates` is absent.

split.md: .claude/workspace/tripkit/split.md. The work is uncommitted and unreviewed."""

[files]
"CHANGELOG.md" = "# Changelog\n\n## Unreleased\n\n- Split a trip's costs across currencies with `tripkit balances` and `tripkit settle`.\n\n## 0.1.0 - 2026-10-20\n\n- Project skeleton: the error type, the spec, the acceptance tests and the lint script.\n"
"docs/howto.md" = "# Splitting a trip\n\nList what everyone paid in `trip.csv`, save the day's rates in `rates.json`, then:\n\n```console\n$ tripkit balances trip.csv --home EUR --rates rates.json\nana +43.33\nben -31.67\ncy -11.66\n$ tripkit settle trip.csv --home EUR --rates rates.json\nben pays ana 31.67\ncy pays ana 11.66\n```\n"
"src/currency.ts" = "// Copyright 2026 tripkit contributors. MIT licence.\n// Exchange rates and conversion. Rates come from a file: fetching them is left to the maintainer.\nimport { TripError } from './errors.ts';\n\nexport type Rates = { base: string; rates: Record<string, number> };\n\nexport function parseRates(text: string): Rates {\n  const data = JSON.parse(text) as Partial<Rates>;\n  if (typeof data.base !== 'string' || typeof data.rates !== 'object' || data.rates === null) throw new TripError('rates need base and rates');\n  return { base: data.base, rates: { ...data.rates } };\n}\n\nfunction rate(currency: string, rates: Rates): number {\n  if (currency === rates.base) return 1;\n  const found = rates.rates[currency];\n  if (found === undefined) throw new TripError(`no rate for ${currency}`);\n  return found;\n}\n\nexport function convert(cents: number, from: string, to: string, rates: Rates): number {\n  return Math.round((cents / rate(from, rates)) * rate(to, rates));\n}\n"
"src/cli.ts" = "// Copyright 2026 tripkit contributors. MIT licence.\n// The tripkit command, kept free of process state so tests can run it.\nimport { parseRates } from './currency.ts';\nimport { TripError } from './errors.ts';\nimport { parseExpenses } from './expenses.ts';\nimport { balances, settle } from './settle.ts';\n\nexport type Result = { status: number; output: string; error: string };\n\nconst USAGE = 'usage: tripkit balances|settle EXPENSES --home CUR --rates FILE';\n\nfunction fail(message: string): Result {\n  return { status: 2, output: '', error: `tripkit: ${message}\\n` };\n}\n\nfunction money(cents: number): string {\n  return (cents / 100).toFixed(2);\n}\n\nexport async function run(argv: string[], readText: (path: string) => string): Promise<Result> {\n  const [command, path, ...options] = argv;\n  const flags = new Map<string, string>();\n  for (let i = 0; i < options.length; i += 2) flags.set(options[i], options[i + 1]);\n  if (!['balances', 'settle'].includes(command) || !path || !flags.get('--home') || [...flags.keys()].some((k) => !['--home', '--rates'].includes(k))) return fail(USAGE);\n  // Rates are read from --rates only: fetching them needs network access, which waits on the maintainer.\n  if (!flags.get('--rates')) return fail('--rates FILE is needed: tripkit does not fetch rates yet');\n  try {\n    let texts: [string, string];\n    try {\n      texts = [readText(path), readText(flags.get('--rates')!)];\n    } catch (error) {\n      throw new TripError(`cannot read: ${error instanceof Error ? error.message : String(error)}`);\n    }\n    const owed = balances(parseExpenses(texts[0]), flags.get('--home')!, parseRates(texts[1]));\n    const lines = command === 'balances'\n      ? [...owed].map(([name, cents]) => `${name} ${cents >= 0 ? '+' : '-'}${money(Math.abs(cents))}\\n`)\n      : settle(owed).map((t) => `${t.from} pays ${t.to} ${money(t.cents)}\\n`);\n    return { status: 0, output: lines.join(''), error: '' };\n  } catch (error) {\n    if (error instanceof TripError || error instanceof SyntaxError) return fail(error.message);\n    throw error;\n  }\n}\n"
".claude/workspace/tripkit/split.md" = "# Split: tripkit\n\n### settle\n\n- Outcome: built\n\n## Decided without asking\n\n- No fetchRates: rates come from --rates.\n\n## Left for the user\n\n- Network access for fetchRates\n"

