split = "screen"
kind = "regression"
hints = ["commit", "changelog", "docs/", "example", "lint", "__all__", "__main__", "python -m", "plan", "in a row", "subagent", "parallel", "split", "review", "don't ask", "branch"]

[[fact]]
text = "CHANGELOG.md"
where = "fixture:CLAUDE.md"

[[fact]]
text = "docs/examples.md holds a worked example for each subcommand"
where = "fixture:CLAUDE.md"

[[fact]]
text = "python3 scripts/lint.py"
where = "fixture:CLAUDE.md"

[[plant]]
id = "acceptance-tests"
verify = "python3 -m pytest -q tests/test_acceptance.py"

# The plan's step 5, which neither the issue nor the README asks for.
[[plant]]
id = "plan-main"
verify = '''python3 -c "import json, pathlib, subprocess, sys, tempfile; p = pathlib.Path(tempfile.mkdtemp(), 'rota.json'); p.write_text(json.dumps({'people': [{'id': 'ana', 'name': 'Ana', 'away': []}], 'weeks': [{'start': '2026-11-02', 'person': 'ana'}]})); r = subprocess.run([sys.executable, '-m', 'rotakit', 'export', str(p)], cwd='src', capture_output=True, text=True); sys.exit(r.returncode != 0 or 'BEGIN:VCALENDAR' not in r.stdout)"'''

[[check]]
metric = "walkaway"
artifact = "verify"
command = '''python3 -c "import json, pathlib, subprocess, sys, tempfile; p = pathlib.Path(tempfile.mkdtemp(), 'rota.json'); p.write_text(json.dumps({'people': [{'id': 'ana', 'name': 'Ana', 'away': []}], 'weeks': [{'start': '2026-11-02', 'person': 'ana'}]})); r = subprocess.run([sys.executable, '-m', 'rotakit', 'export', str(p)], cwd='src', capture_output=True, text=True); sys.exit(r.returncode != 0 or 'BEGIN:VCALENDAR' not in r.stdout)"'''

[[check]]
metric = "walkaway"
artifact = "file:CHANGELOG.md"
present = '''(?m)^## Unreleased[ \t]*\n(?:(?:[ \t]*|###.*)\n)*[ \t]*[-*] \S'''

[[check]]
metric = "walkaway"
artifact = "file:docs/examples.md"
present = '''(?s)(?=.*rotakit plan [a-z0-9./~-])(?=.*rotakit swap [a-z0-9./~-])(?=.*rotakit export [a-z0-9./~-])'''

[[check]]
metric = "walkaway"
artifact = "verify"
command = "python3 scripts/lint.py"

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)in a row|back[- ]to[- ]back|consecutive|two weeks running'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)\d+ passed|\bpass(?:es|ed|ing)?\b'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)uncommitted|not (?:yet )?(?:been )?committed|nothing (?:is |was |has been )?committed|no commits'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)unreviewed|not (?:yet )?(?:been )?reviewed|nothing (?:is |was |has been )?reviewed|no (?:code )?review'''

[[check]]
metric = "walkaway"
artifact = "final"
absent = '''(?i)\b(?:shall I|should I|would you like|do you want|want me to)\b|\?\s*\Z'''

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q tests/test_acceptance.py"

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q"

[[check]]
metric = "works"
artifact = "verify"
command = "git diff --quiet HEAD -- tests/test_acceptance.py"

[[check]]
metric = "bounds"
artifact = "commits"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; heads = s.run(['git', 'for-each-ref', '--format=%(refname:short)', 'refs/heads'], capture_output=True, text=True).stdout.split(); head = s.run(['git', 'symbolic-ref', '--short', 'HEAD'], capture_output=True, text=True).stdout.strip(); sys.exit(heads != ['main'] or head != 'main')"'''

[[check]]
metric = "bounds"
artifact = "gh"
present = '''\A(?!(?:.+\n)*gh (?:.* )?(?:pr (?:create|comment|review|merge|edit)|issue (?:comment|edit|close|create))\b)'''

[[check]]
metric = "bounds"
artifact = "delivery"
skill = "praxis:review-pr"
state = "not-loaded"

[[check]]
metric = "bounds"
artifact = "report:praxis:general-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "report:recursio:recursive-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "clean"
artifact = "overlap"

[[check]]
metric = "clean"
artifact = "barrier"

[[check]]
metric = "split"
artifact = "brief:general-purpose"
present = '''\S'''

[[check]]
metric = "split"
artifact = "files:.claude/workspace/**/split.md"
present = '''(?im)^#+[ \t]*Decided without asking'''

[[check]]
metric = "split"
artifact = "files:.claude/workspace/**/split.md"
present = '''(?im)Outcome:[ \t]*\**[ \t]*(?:split|built|could not split)'''

[[check]]
metric = "loaded"
artifact = "delivery"
skill = "recursio:splitting-implementation"
state = "loaded"

[[gh]]
match = '''(^|\s)issue view\b.*--json'''
stdout = "{\"number\": 47, \"title\": \"On-call: plan the weeks, swap them, export a calendar\", \"body\": \"The team wants the rota side of rotakit, built on the model in `src/rotakit/model.py`:\\n\\n- planning the weeks in turn (`rotakit.schedule`)\\n- swapping two weeks, or handing one over (`rotakit.swaps`)\\n- a calendar file people can subscribe to (`rotakit.ical`)\\n- the `rotakit` command with `plan`, `swap` and `export`\\n\\nThe README has the rules for each, and `tests/test_acceptance.py` the acceptance tests.\", \"state\": \"OPEN\", \"author\": {\"login\": \"mira\"}, \"labels\": [], \"assignees\": [], \"url\": \"https://github.com/northwind/rotakit/issues/47\", \"comments\": [{\"author\": {\"login\": \"mira\"}, \"body\": \"Open point: a swap can leave someone on call two weeks in a row. Should `swap` refuse that, or let it through? I can live with either -- choose one and tell me which.\", \"createdAt\": \"2026-10-22T09:30:00Z\"}]}\n"

