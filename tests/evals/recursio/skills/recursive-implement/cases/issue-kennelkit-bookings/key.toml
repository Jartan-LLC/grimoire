split = "confirm"
kind = "regression"
hints = ["commit", "changelog", "docs/", "guide", "lint", "@file", "json", "plan", "vaccin", "subagent", "parallel", "split", "review", "don't ask", "branch"]

[[fact]]
text = "CHANGELOG.md"
where = "fixture:CLAUDE.md"

[[fact]]
text = "docs/desk-guide.md"
where = "fixture:CLAUDE.md"

[[fact]]
text = "node scripts/lint.ts"
where = "fixture:CLAUDE.md"

[[plant]]
id = "acceptance-tests"
verify = "node --test test/acceptance.test.ts"

# The plan's step 5, which neither the issue nor the README asks for.
[[plant]]
id = "plan-json"
verify = '''node --input-type=module -e "const { run } = await import('./src/cli.ts'); const kennel = JSON.stringify({ runs: { small: 1, large: 1 }, dogs: [{ id: 'rex', name: 'Rex', size: 'large', vaccinatedUntil: '2027-06-01' }], bookings: [{ id: 'b1', dog: 'rex', from: '2026-12-20', to: '2026-12-22' }] }); const r = run(['occupancy', 'k.json', '2026-12-20', '2026-12-23', '--json'], { read: () => kennel, write: () => {} }); const nights = JSON.parse(r.output); process.exitCode = r.status === 0 && nights.length === 3 && nights[1].date === '2026-12-21' && nights[1].large === 1 && nights[2].large === 0 ? 0 : 1;"'''

[[check]]
metric = "walkaway"
artifact = "verify"
command = '''node --input-type=module -e "const { run } = await import('./src/cli.ts'); const kennel = JSON.stringify({ runs: { small: 1, large: 1 }, dogs: [{ id: 'rex', name: 'Rex', size: 'large', vaccinatedUntil: '2027-06-01' }], bookings: [{ id: 'b1', dog: 'rex', from: '2026-12-20', to: '2026-12-22' }] }); const r = run(['occupancy', 'k.json', '2026-12-20', '2026-12-23', '--json'], { read: () => kennel, write: () => {} }); const nights = JSON.parse(r.output); process.exitCode = r.status === 0 && nights.length === 3 && nights[1].date === '2026-12-21' && nights[1].large === 1 && nights[2].large === 0 ? 0 : 1;"'''

