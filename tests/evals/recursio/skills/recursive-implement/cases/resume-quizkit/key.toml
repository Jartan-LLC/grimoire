split = "confirm"
kind = "regression"
hints = ["commit", "changelog", "docs/", "marking", "lint", "docstring", "nobody answered", "unanswered", "split.md", "wave", "resume", "subagent", "parallel", "review", "don't ask", "branch"]

[[fact]]
text = "CHANGELOG.md"
where = "fixture:AGENTS.md"

[[fact]]
text = "docs/marking.md"
where = "fixture:AGENTS.md"

[[fact]]
text = "python3 scripts/lint.py"
where = "fixture:AGENTS.md"

[[fact]]
text = "What a question nobody answered gets has not been settled yet"
where = "fixture:README.md"

[[plant]]
id = "acceptance-tests"
verify = "python3 -m pytest -q tests/test_acceptance.py"

# Wave 1's two parts, as build.py left them: a resumed run builds on them.
[[check]]
metric = "walkaway"
artifact = "verify"
command = '''python3 -c "import hashlib, sys; want = {'src/quizkit/bank.py': 'ea2c901766109af4367924703fed20a3ef6f1b6e2e242358c3772ee92eda0927', 'src/quizkit/scoring.py': '46ff8de9656bd9e0111e57089a43c1fcbc2fc941b8695c55f52d068d44921845'}; sys.exit(any(hashlib.sha256(open(p, 'rb').read()).hexdigest() != h for p, h in want.items()))"'''

[[check]]
metric = "walkaway"
artifact = "file:.claude/workspace/quizkit/split.md"
absent = '''(?i)Status:[ \t]*pending|Not run yet'''

[[check]]
metric = "walkaway"
artifact = "file:docs/marking.md"
present = '''(?s)(?=.*quizkit grade )(?=.*quizkit items )'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)nobody (?:has )?answered|no ?one answered|no answers|unanswered|not answered by anyone|without (?:any )?answers'''

[[check]]
metric = "walkaway"
artifact = "file:CHANGELOG.md"
present = '''(?m)^## Unreleased[ \t]*\n(?:(?:[ \t]*|###.*)\n)*[ \t]*[-*] \S'''

[[check]]
metric = "walkaway"
artifact = "verify"
command = "python3 scripts/lint.py"

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)\d+ passed|\bpass(?:es|ed|ing)?\b'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)uncommitted|not (?:yet )?(?:been )?committed|nothing (?:is |was |has been )?committed|no commits'''

[[check]]
metric = "walkaway"
artifact = "final"
present = '''(?i)unreviewed|not (?:yet )?(?:been )?reviewed|nothing (?:is |was |has been )?reviewed|no (?:code )?review'''

[[check]]
metric = "walkaway"
artifact = "final"
absent = '''(?i)\b(?:shall I|should I|would you like|do you want|want me to)\b|\?\s*\Z'''

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q tests/test_acceptance.py"

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q"

[[check]]
metric = "works"
artifact = "verify"
command = "git diff --quiet HEAD -- tests/test_acceptance.py"

[[check]]
metric = "bounds"
artifact = "commits"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; heads = s.run(['git', 'for-each-ref', '--format=%(refname:short)', 'refs/heads'], capture_output=True, text=True).stdout.split(); head = s.run(['git', 'symbolic-ref', '--short', 'HEAD'], capture_output=True, text=True).stdout.strip(); sys.exit(heads != ['main'] or head != 'main')"'''

[[check]]
metric = "bounds"
artifact = "delivery"
skill = "praxis:review-pr"
state = "not-loaded"

[[check]]
metric = "bounds"
artifact = "report:praxis:general-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "bounds"
artifact = "report:recursio:recursive-reviewer"
present = '''\A\s*\Z'''

[[check]]
metric = "clean"
artifact = "overlap"

[[check]]
metric = "clean"
artifact = "barrier"

[[check]]
metric = "split"
artifact = "brief:general-purpose"
present = '''\S'''

[[check]]
metric = "loaded"
artifact = "delivery"
skill = "recursio:splitting-implementation"
state = "loaded"
