split = "confirm"
kind = "trigger"
hints = ["subagent", "parallel", "agents", "delegate", "wave"]
remote = true

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "recursio:splitting-implementation"
state = "not-loaded"

[[check]]
metric = "quiet"
artifact = "brief:general-purpose"
present = '''\A\Z'''

[[gh]]
match = '''(^|\s)pr create\b'''
stdout = "https://github.com/acme/confkit/pull/109\n"

[[gh]]
match = '''(^|\s)pr view\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr edit\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr list\b.*--json'''
stdout = "[]\n"

[[gh]]
match = '''(^|\s)pr list\b'''
stdout = ""

[[gh]]
match = '''(^|\s)pr status\b'''
stdout = "Current branch\n  There is no pull request associated with [feature/issue-9]\n"

[[gh]]
match = '''(^|\s)issue view\b.*--json'''
stdout = "{\"number\": 9, \"title\": \"Add a --version flag\", \"body\": \"`confkit --version` should print `confkit <version>` with the version from the installed package metadata, and exit 0.\", \"state\": \"OPEN\", \"author\": {\"login\": \"dana\"}, \"labels\": [], \"comments\": [], \"assignees\": [], \"url\": \"https://github.com/acme/confkit/issues/9\"}\n"

[[gh]]
match = '''(^|\s)issue view\b'''
stdout = "title:\tAdd a --version flag\nstate:\tOPEN\nauthor:\tdana\nlabels:\t\ncomments:\t0\nassignees:\t\nprojects:\t\nmilestone:\t\nnumber:\t9\n--\n`confkit --version` should print `confkit <version>` with the version from the installed package metadata, and exit 0.\n"

[[gh]]
match = '''(^|\s)issue list\b.*--json'''
stdout = "[{\"number\": 9, \"title\": \"Add a --version flag\", \"state\": \"OPEN\", \"url\": \"https://github.com/acme/confkit/issues/9\"}]\n"

[[gh]]
match = '''(^|\s)issue list\b'''
stdout = "9\tOPEN\tAdd a --version flag\t\t2026-10-20T10:00:00Z\n"

[[gh]]
match = '''(^|\s)api\b.*pulls'''
stdout = "[]\n"

[[gh]]
match = '''(^|\s)repo view\b.*--json'''
stdout = "{\"name\": \"confkit\", \"nameWithOwner\": \"acme/confkit\", \"url\": \"https://github.com/acme/confkit\", \"defaultBranchRef\": {\"name\": \"main\"}, \"visibility\": \"PUBLIC\", \"owner\": {\"login\": \"acme\"}}\n"

[[gh]]
match = '''(^|\s)repo view\b'''
stdout = "name:\tacme/confkit\ndescription:\t\n"

[[gh]]
match = '''(^|\s)auth status\b'''
stdout = "github.com\n  Logged in to github.com account alice (keyring)\n"

[[gh]]
match = '''(^|\s)api user\b'''
stdout = "{\"login\": \"alice\"}\n"
