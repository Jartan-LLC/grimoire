split = "screen"
kind = "trigger"
hints = ["subagent", "parallel", "agents", "delegate"]
remote = true

[[check]]
metric = "quiet"
artifact = "delivery"
skill = "recursio:splitting-implementation"
state = "not-loaded"

[[check]]
metric = "quiet"
artifact = "brief:general-purpose"
present = '''\A\Z'''

[[gh]]
match = '''(^|\s)pr create\b'''
stdout = "https://github.com/acme/mailroom/pull/139\n"

[[gh]]
match = '''(^|\s)pr view\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr edit\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr list\b.*--json'''
stdout = "[]\n"

[[gh]]
match = '''(^|\s)pr list\b'''
stdout = ""

[[gh]]
match = '''(^|\s)pr status\b'''
stdout = "Current branch\n  There is no pull request associated with [feature/issue-39]\n"

[[gh]]
match = '''(^|\s)issue view\b.*--json'''
stdout = "{\"number\": 39, \"title\": \"Roadmap\", \"body\": \"See the README.\", \"state\": \"OPEN\", \"author\": {\"login\": \"dana\"}, \"labels\": [], \"comments\": [], \"assignees\": [], \"url\": \"https://github.com/acme/mailroom/issues/39\"}\n"

[[gh]]
