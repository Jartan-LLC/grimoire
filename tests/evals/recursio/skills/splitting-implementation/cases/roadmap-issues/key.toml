stdout = "[{\"number\": 39, \"title\": \"Roadmap\", \"state\": \"OPEN\", \"url\": \"https://github.com/acme/mailroom/issues/39\"}]\n"

[[gh]]
match = '''(^|\s)issue list\b'''
stdout = "39\tOPEN\tRoadmap\t\t2026-10-20T10:00:00Z\n"

[[gh]]
match = '''(^|\s)issue create\b'''
stdout = "https://github.com/acme/mailroom/issues/40\n"

[[gh]]
match = '''(^|\s)label list\b'''
stdout = "bug\tSomething is not working\t#d73a4a\nenhancement\tNew feature or request\t#a2eeef\n"

[[gh]]
match = '''(^|\s)api\b.*pulls'''
stdout = "[]\n"

[[gh]]
match = '''(^|\s)repo view\b.*--json'''
stdout = "{\"name\": \"mailroom\", \"nameWithOwner\": \"acme/mailroom\", \"url\": \"https://github.com/acme/mailroom\", \"defaultBranchRef\": {\"name\": \"main\"}, \"visibility\": \"PUBLIC\", \"owner\": {\"login\": \"acme\"}}\n"

