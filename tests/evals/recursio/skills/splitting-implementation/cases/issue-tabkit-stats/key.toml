split = "dev"
kind = "trigger"
hints = ["subagent", "parallel", "split", "agents", "delegate", "wave", "recursi"]
remote = true

[[check]]
metric = "recall"
artifact = "delivery"
skill = "recursio:splitting-implementation"
write = "spawn"
state = "in-context"

[[check]]
metric = "split"
artifact = "brief:general-purpose"
present = '''\S'''

