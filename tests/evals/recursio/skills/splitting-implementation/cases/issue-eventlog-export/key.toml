stdout = "title:\tExport events as CSV, NDJSON and iCalendar\nstate:\tOPEN\nauthor:\tdana\nlabels:\t\ncomments:\t0\nassignees:\t\nprojects:\t\nmilestone:\t\nnumber:\t58\n--\nAdd `eventlog export --format csv|ndjson|ics [--since DATE] [--tag TAG]`. CSV follows RFC 4180 with a header row; NDJSON writes one event per line; iCalendar follows RFC 5545: a VEVENT per event with UID, DTSTART, DTEND and SUMMARY, lines folded at 75 octets, commas and semicolons escaped. `--since` and `--tag` filter the events before any format sees them.\n"

