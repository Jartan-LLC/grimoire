[[gh]]
match = '''(^|\s)issue view\b.*--json'''
stdout = "{\"number\": 58, \"title\": \"Export events as CSV, NDJSON and iCalendar\", \"body\": \"Add `eventlog export --format csv|ndjson|ics [--since DATE] [--tag TAG]`. CSV follows RFC 4180 with a header row; NDJSON writes one event per line; iCalendar follows RFC 5545: a VEVENT per event with UID, DTSTART, DTEND and SUMMARY, lines folded at 75 octets, commas and semicolons escaped. `--since` and `--tag` filter the events before any format sees them.\", \"state\": \"OPEN\", \"author\": {\"login\": \"dana\"}, \"labels\": [], \"comments\": [], \"assignees\": [], \"url\": \"https://github.com/acme/eventlog/issues/58\"}\n"

[[gh]]
