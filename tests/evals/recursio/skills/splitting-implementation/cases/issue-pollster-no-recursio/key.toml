split = "screen"
kind = "trigger"
hints = ["subagent", "parallel", "agents", "delegate", "wave"]
without = ["recursio"]
remote = true

[[check]]
metric = "quiet"
artifact = "brief:general-purpose"
present = '''\A\Z'''

[[gh]]
match = '''(^|\s)pr create\b'''
stdout = "https://github.com/acme/pollster/pull/123\n"

[[gh]]
match = '''(^|\s)pr view\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr edit\b'''
stdout = ""
exit = 1

[[gh]]
match = '''(^|\s)pr list\b.*--json'''
stdout = "[]\n"

[[gh]]
match = '''(^|\s)pr list\b'''
stdout = ""

[[gh]]
match = '''(^|\s)pr status\b'''
stdout = "Current branch\n  There is no pull request associated with [feature/issue-23]\n"

[[gh]]
match = '''(^|\s)issue view\b.*--json'''
stdout = "{\"number\": 23, \"title\": \"Instant-runoff, Borda and Condorcet counting\", \"body\": \"The tally only does plurality. Add three counting methods, each in its own module with tests: instant-runoff (eliminate the last-placed candidate and transfer their ballots until one has a majority; ties broken by fewest first preferences, then alphabetically), Borda count (n-1 points for a first preference down to 0), and Condorcet with the Schulze method for cycles. Add `--method plurality|irv|borda|schulze` to `bin/tally.js`, plurality staying the default.\", \"state\": \"OPEN\", \"author\": {\"login\": \"dana\"}, \"labels\": [], \"comments\": [], \"assignees\": [], \"url\": \"https://github.com/acme/pollster/issues/23\"}\n"

[[gh]]
match = '''(^|\s)issue view\b'''
stdout = "title:\tInstant-runoff, Borda and Condorcet counting\nstate:\tOPEN\nauthor:\tdana\nlabels:\t\ncomments:\t0\nassignees:\t\nprojects:\t\nmilestone:\t\nnumber:\t23\n--\nThe tally only does plurality. Add three counting methods, each in its own module with tests: instant-runoff (eliminate the last-placed candidate and transfer their ballots until one has a majority; ties broken by fewest first preferences, then alphabetically), Borda count (n-1 points for a first preference down to 0), and Condorcet with the Schulze method for cycles. Add `--method plurality|irv|borda|schulze` to `bin/tally.js`, plurality staying the default.\n"

[[gh]]
match = '''(^|\s)issue list\b.*--json'''
stdout = "[{\"number\": 23, \"title\": \"Instant-runoff, Borda and Condorcet counting\", \"state\": \"OPEN\", \"url\": \"https://github.com/acme/pollster/issues/23\"}]\n"

[[gh]]
match = '''(^|\s)issue list\b'''
stdout = "23\tOPEN\tInstant-runoff, Borda and Condorcet counting\t\t2026-10-20T10:00:00Z\n"

[[gh]]
match = '''(^|\s)api\b.*pulls'''
stdout = "[]\n"

[[gh]]
match = '''(^|\s)repo view\b.*--json'''
stdout = "{\"name\": \"pollster\", \"nameWithOwner\": \"acme/pollster\", \"url\": \"https://github.com/acme/pollster\", \"defaultBranchRef\": {\"name\": \"main\"}, \"visibility\": \"PUBLIC\", \"owner\": {\"login\": \"acme\"}}\n"

[[gh]]
match = '''(^|\s)repo view\b'''
stdout = "name:\tacme/pollster\ndescription:\t\n"

[[gh]]
match = '''(^|\s)auth status\b'''
stdout = "github.com\n  Logged in to github.com account alice (keyring)\n"

[[gh]]
match = '''(^|\s)api user\b'''
stdout = "{\"login\": \"alice\"}\n"

