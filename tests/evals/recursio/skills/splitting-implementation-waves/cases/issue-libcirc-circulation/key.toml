split = "dev"
# A root may extend model.py before spawning, which the skill allows, so `contract` can fail here
# without any part touching the contract.
kind = "regression"
hints = ["barrier", "wait", "meanwhile", "in the meantime", "until", "model.py", "split.md"]

[[plant]]
id = "acceptance-tests"
verify = "python3 -m unittest discover -s tests/planted"

[[check]]
metric = "barrier"
artifact = "barrier"

[[check]]
metric = "clean"
artifact = "overlap"

[[check]]
metric = "clean"
artifact = "spawn-writes"
write = "commit"

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q tests/planted"

[[check]]
metric = "works"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; base = s.run(['git', 'rev-list', '--max-parents=0', 'HEAD'], capture_output=True, text=True).stdout.split(); sys.exit(not base or s.run(['git', 'diff', '--quiet', base[-1], '--', 'tests/planted']).returncode)"'''

[[check]]
metric = "contract"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; base = s.run(['git', 'rev-list', '--max-parents=0', 'HEAD'], capture_output=True, text=True).stdout.split(); sys.exit(not base or s.run(['git', 'diff', '--quiet', base[-1], '--', 'src/libcirc/model.py', 'tests/test_model.py']).returncode)"'''

[[check]]
metric = "split"
artifact = "brief:general-purpose"
present = '''\S'''

