split = "dev"
# Depth should-fire: the Importers part is four formats, each read and written, so under the skill it
# loads the skill and splits once more.
kind = "regression"
hints = ["barrier", "wait", "meanwhile", "in the meantime", "until", "split", "nest", "recurs", "depth", "level"]

[[fact]]
text = "tests/planted/"
where = "prompt"

[[plant]]
id = "acceptance-tests"
verify = "python3 -m pytest -q tests/planted"

[[check]]
metric = "barrier"
artifact = "barrier"

[[check]]
metric = "clean"
artifact = "overlap"

[[check]]
metric = "clean"
artifact = "spawn-writes"
write = "commit"

[[check]]
metric = "works"
artifact = "verify"
command = "python3 -m pytest -q tests/planted"

[[check]]
metric = "works"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; base = s.run(['git', 'rev-list', '--max-parents=0', 'HEAD'], capture_output=True, text=True).stdout.split(); sys.exit(not base or s.run(['git', 'diff', '--quiet', base[-1], '--', 'tests/planted']).returncode)"'''

[[check]]
metric = "contract"
artifact = "verify"
command = '''python3 -c "import subprocess as s, sys; base = s.run(['git', 'rev-list', '--max-parents=0', 'HEAD'], capture_output=True, text=True).stdout.split(); sys.exit(not base or s.run(['git', 'diff', '--quiet', base[-1], '--', 'ledgerkit/model.py', 'tests/test_model.py']).returncode)"'''

[[check]]
metric = "split"
artifact = "brief:general-purpose"
present = '''\S'''

[[check]]
metric = "resplit"
artifact = "delivery"
skill = "recursio:splitting-implementation"
write = "spawn"
state = "in-context"
agent = "general-purpose"
